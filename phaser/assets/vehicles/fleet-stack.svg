<svg xmlns="http://www.w3.org/2000/svg" width="192" height="280" viewBox="0 0 192 280">
  <!-- Authored horizontal sections. Every cell is 48 x 28, nose points right.
       Neutral matte paint is tinted by the vehicle palette; smoked glass and aged trim stay separate. -->
  <defs>
    <path id="body" d="M9 6.4 36.7 6.4 40.8 8.2 41 19.8 37 21.6 9 21.6 7.2 19.9 7.2 8.1Z"/>
    <path id="deck" d="M10 6.8 36.4 6.8 39.7 8.8 39.7 19.2 36.4 21.2 10 21.2 8.7 19.7 8.7 8.3Z"/>
    <path id="glass" d="M15 8 26.7 8 30.8 10 30.8 18 26.7 20 15 20 11.8 18 11.8 10Z"/>
    <linearGradient id="paint" x2="0" y2="1"><stop stop-color="#b3b2ac"/><stop offset=".17" stop-color="#adada5"/><stop offset=".8" stop-color="#9c9d96"/><stop offset="1" stop-color="#858782"/></linearGradient>
    <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#b9b9b0"/><stop offset=".22" stop-color="#adada6"/><stop offset=".82" stop-color="#a3a49c"/><stop offset="1" stop-color="#8d9189"/></linearGradient>
    <linearGradient id="screen" x2=".3" y2="1"><stop stop-color="#4c5a60"/><stop offset=".23" stop-color="#26333c"/><stop offset=".7" stop-color="#17232c"/><stop offset="1" stop-color="#0e151d"/></linearGradient>
    <linearGradient id="flank" x2="0" y2="1"><stop stop-color="#bbbfc1"/><stop offset=".18" stop-color="#9b9ea0"/><stop offset=".45" stop-color="#62676c"/><stop offset=".75" stop-color="#51585d"/><stop offset="1" stop-color="#33393f"/></linearGradient>
  </defs>
  <!-- 0: contact shadow -->
  <path d="M8 6 38 6 42 9 42 21 38 24 8 24 5 21 5 9Z" fill="#060808" opacity=".36"/>
  <!-- 1: one tyre, centred in its cell -->
  <g transform="translate(48)"><rect x="20.7" y="12.4" width="6.6" height="3.2" rx=".65" fill="#cacaca"/><path d="M21.5 13h5M21.5 15h5" stroke="#fff" stroke-width=".35"/></g>
  <!-- 2: dark undertray -->
  <g transform="translate(96)"><path d="M9 7 38 7 41 9 41 19 38 21 9 21 7 19 7 9Z" fill="#171b1c"/></g>
  <!-- 3: lower body section -->
  <g transform="translate(144)"><use href="#body" fill="#a1a1a1"/><path d="M10 7h25M10 21h25" stroke="#666" stroke-width=".75"/></g>
  <!-- 4: sculpted shoulder, subtly bevelled nose and boot -->
  <g transform="translate(0 28)"><use href="#body" fill="url(#paint)"/><path d="m37 7.5 2.2 1v11l-2.2 1M10 7.5v13" fill="none" stroke="#777" stroke-width=".4"/></g>
  <!-- 5: bonnet and boot deck -->
  <g transform="translate(48 28)"><use href="#deck" fill="url(#paint)"/><path d="M31 8.2h5.4l1.2.8v10l-1.2.8H31M10.8 8.5v11" fill="none" stroke="#626262" stroke-width=".35"/><path d="M32.5 8.8h3.2M11.6 8.6v10.8" stroke="#c5c5c5" stroke-opacity=".25" stroke-width=".28"/></g>
  <!-- 6: bumpers, grille, rectangular lamps and door furniture -->
  <g transform="translate(96 28)">
    <path d="M7.4 8.7v10.6M40.5 8.7v10.6" stroke="#797d73" stroke-width=".8"/>
    <path d="M40.4 11v6" stroke="#24282a" stroke-width="1.2"/><path d="M40.6 11.4v5.2" stroke="#5c635c" stroke-width=".25"/>
    <path d="M38.8 8.8v2.5M38.8 16.7v2.5" stroke="#c5b48c" stroke-width="1.5"/>
    <path d="M8.7 8.2v3.2M8.7 16.6v3.2" stroke="#753b36" stroke-width="1.1"/>
    <path d="M12 6.6h23M12 21.4h23" stroke="#555e56" stroke-width=".35"/>
    <path d="M17.8 7h1.5M25 7h1.5M17.8 21h1.5M25 21h1.5" stroke="#8b8b7c" stroke-width=".4"/>
  </g>
  <!-- 7: full lower glass section -->
  <g transform="translate(144 28)"><use href="#glass" fill="#202729" stroke="#4f5851" stroke-width=".25"/><path d="M15 8.6 12.8 10.2v7.6l2.2 1.6M26.5 8.5l3.5 1.8v7.4l-3.5 1.8" fill="none" stroke="#121c20" stroke-width=".5"/></g>
  <!-- 8: tapering cabin -->
  <g transform="translate(0 56)"><path d="M16 8.7h10l3 1.8v7l-3 1.8H16l-2.6-1.8v-7Z" fill="#293133"/><path d="M20.8 8.6v10.8" stroke="#171e20" stroke-width="1"/></g>
  <!-- 9: upper cabin -->
  <g transform="translate(48 56)"><path d="M16 9.4h10.3l2.2 1.4v6.4l-2.2 1.4H16l-1.6-1.4v-6.4Z" fill="#2b3537"/><path d="M27.8 10.8v6.4M15 11v6" stroke="#4b5b55" stroke-width=".28"/></g>
  <!-- 10: metal roof, gently tapered and inset -->
  <g transform="translate(96 56)"><path d="M15.2 9.35h12.2v9.3H15.2Z" fill="url(#roof)"/><path d="M15.8 9.9h11M15.8 18.1h11" fill="none" stroke="#dadfe1" stroke-opacity=".27" stroke-width=".3"/></g>
  <!-- 11: upper surface details and mirrors -->
  <g transform="translate(144 56)"><path d="M17.8 11.6h4.7v4.8h-4.7Z" fill="#263136" stroke="#505e56" stroke-width=".3"/><path d="M18.3 12.1h3.6" stroke="#69786a" stroke-opacity=".5" stroke-width=".25"/><path d="M27.8 7v-1.4h-1.4v1.7M27.8 21v1.4h-1.4v-1.7" fill="#494f49" stroke="#171d1d" stroke-width=".3"/></g>
  <!-- 12: separately tintable bonnet damage -->
  <g transform="translate(0 84)"><path d="M31.2 8.5h4.7l1.4.9v9.2l-1.4.9h-4.7Z" fill="#dadada"/><path d="m32 9.5 2 2-1 3 2 3-2 1" fill="none" stroke="#777" stroke-width=".45"/></g>
  <!-- 13: body outline -->
  <g transform="translate(48 84)"><use href="#body" fill="none" stroke="#fff" stroke-width=".45"/></g>
  <!-- 14: restrained scratches on upper body -->
  <g transform="translate(96 84)" fill="none"><path d="M10 17.8h1.5M34 19.4h2M33.8 8.8h1.2" stroke="#b9b09b" stroke-opacity=".32" stroke-width=".24"/></g>
  <!-- 15: square commercial body section -->
  <g transform="translate(144 84)"><path d="M8 6h30l3 2v12l-3 2H8L7 20V8Z" fill="url(#paint)"/><path d="M8 7h28M8 21h28" stroke="#696969" stroke-width=".6"/></g>
  <!-- 16: flat roof/cargo section, metal seams -->
  <g transform="translate(0 112)"><path d="M9 6.7h28l3 2v10.6l-3 2H9L8 20V8Z" fill="url(#roof)"/><path d="M10 8v12M37 9v10M11 8h24" fill="none" stroke="#8e8e8e" stroke-width=".45"/></g>
  <!-- 17: bus windscreen, nose points right -->
  <g transform="translate(48 112)"><path d="M30 7h7l2 2v10l-2 2h-7Z" fill="#18272b" stroke="#697267" stroke-width=".4"/><path d="M37.5 10v7M32 7v14" stroke="#405553" stroke-width=".5"/></g>
  <!-- 18: pickup open bed -->
  <g transform="translate(96 112)"><path d="M8 8h14v12H8Z" fill="#151c1d" stroke="#5d675b" stroke-width=".6"/><path d="M9.5 10h11M9.5 12h11M9.5 14h11M9.5 16h11M9.5 18h11" stroke="#3a4443" stroke-width=".45"/></g>
  <!-- 19: raised taxi roof lamp -->
  <g transform="translate(144 112)"><path d="M21 12h6v4h-6Z" fill="#948363" stroke="#342f24" stroke-width=".6"/><path d="M22 13h4" stroke="#c2b18b" stroke-width=".45"/><path d="M22 14h.5m.5 0h.5m.5 0h.5m.5 0h.5" stroke="#332e22" stroke-width="1"/></g>
  <!-- 20: emergency roof bar -->
  <g transform="translate(0 140)"><path d="M22 8h4v12h-4Z" fill="#171c20"/><path d="M22.5 8.5h3v4h-3Z" fill="#3c5468"/><path d="M22.5 15.5h3v4h-3Z" fill="#873f3b"/><path d="M22.7 9h2.4M22.7 16h2.4" stroke="#a7a898" stroke-opacity=".55" stroke-width=".45"/></g>
  <!-- 21: marked police doors; dark roof stays separate -->
  <g transform="translate(48 140)"><path d="M16 6.2h13v2.2H16ZM16 19.6h13v2.2H16Z" fill="#8e9488"/><path d="m23 6.4 1 .6-1 1-1-1Zm0 13.5 1 .6-1 1-1-1Z" fill="#776951"/><path d="M8 8v12M40 8v12" stroke="#141b20" stroke-width="1.5"/></g>
  <!-- 22: medical emblem on the high rear compartment -->
  <g transform="translate(96 140)"><path d="M17 10h4v3h4v3h-4v3h-4v-3h-4v-3h4Z" fill="#983d39"/><path d="M17.3 10.4h3.2" stroke="#95594c" stroke-width=".4"/></g>
  <!-- 23: bus roof vents, recognisable from overhead -->
  <g transform="translate(144 140)"><path d="M10 9h6v10h-6ZM29 9h6v10h-6Z" fill="#4e5851" stroke="#7f8879" stroke-width=".45"/><path d="M11 11h4M11 13h4M11 15h4M11 17h4M30 11h4M30 13h4M30 15h4M30 17h4" stroke="#252c2c" stroke-width=".6"/></g>
  <!-- 24: vinyl hearse roof and discreet silver funeral cross -->
  <g transform="translate(0 168)"><path d="M8 7h23v14H8Z" fill="#171b1e" stroke="#646960" stroke-width=".6"/><path d="M12 9v10M27 9v10" stroke="#424949" stroke-width=".4"/><path d="M18 10v8M15.5 13h5" stroke="#797f72" stroke-width=".7"/></g>
  <!-- 25: sporting bonnet/boot stripes -->
  <g transform="translate(48 168)"><path d="M9 11h28v2H9ZM9 15h28v2H9Z" fill="#1a2022" opacity=".82"/></g>
  <!-- 26: commercial roof pressed ribs -->
  <g transform="translate(96 168)" fill="none"><path d="M10 9h27M10 12h27M10 16h27M10 19h27" stroke="#777c73" stroke-width=".45"/><path d="M11 9.4h25M11 16.4h25" stroke="#a8afa0" stroke-opacity=".35" stroke-width=".3"/></g>
  <!-- 27: waist-height mirrors (not part of the roof) -->
  <g transform="translate(144 168)"><path d="M27.8 7V5.6h-1.4v1.7M27.8 21v1.4h-1.4v-1.7" fill="#666d64" stroke="#171d1d" stroke-width=".3"/></g>
  <!-- 28: bus upper window section -->
  <g transform="translate(0 196)"><path d="M8 6h31v16H8Z" fill="#233033"/><path d="M9 6v16M14 6v16M19 6v16M24 6v16M29 6v16M34 6v16M39 6v16" stroke="#727e71" stroke-width=".8"/><path d="M10 7h28M10 21h28" stroke="#405855" stroke-width=".5"/></g>
  <!-- 29: broad restrained rust; no tiny noisy speckles -->
  <g transform="translate(48 196)"><path d="m10 7 4 .5-1 2-4-.5ZM28 18l5 .5 1 2-6 .2Z" fill="#6c493b" opacity=".7"/></g>
  <!-- 30: ambulance lower red side stripes -->
  <g transform="translate(96 196)"><path d="M8 6.2h28v1.6H8ZM8 20.2h28v1.6H8Z" fill="#993c36"/><path d="M8 7.9h28M8 20h28" stroke="#909585" stroke-width=".35"/></g>
  <!-- 31: SUV roof rails -->
  <g transform="translate(144 196)"><path d="M10 7h26M10 21h26" stroke="#171e20" stroke-width="1.2"/><path d="M10 6.6h26M10 20.6h26" stroke="#5c6c5b" stroke-width=".4"/></g>
  <!-- 32: windshield / rear glass, UV top edge follows the metal roof -->
  <g transform="translate(0 224)">
    <rect x="4" y="4" width="40" height="20" fill="#151b21"/>
    <path d="M5.2 5h37.6v17.5H5.2Z" fill="url(#screen)"/>
    <path d="M5.8 5.7h36.4" stroke="#829098" stroke-width=".45" opacity=".75"/>
    <path d="M8 21.3l12-2.1M25 21.3l13-2.1" stroke="#090e13" stroke-width=".65"/>
    <path d="M6 7h7l-6 12Z" fill="#647783" opacity=".12"/>
  </g>
  <!-- 33: separate side glazing: narrow pillars, two tall readable panes -->
  <g transform="translate(48 224)">
    <rect x="4" y="4" width="40" height="20" fill="#12191f"/>
    <path d="M5.5 5.6h13v16H5.5ZM20.7 5.6h21.8v16H20.7Z" fill="url(#screen)"/>
    <path d="M5 4.9h38M5 23h38" stroke="#6a777e" stroke-width=".5"/>
    <path d="M7 7h9M22 7h18" stroke="#81919b" stroke-opacity=".3" stroke-width=".6"/>
    <path d="M19.4 5v17" stroke="#363f45" stroke-width=".6"/>
  </g>
  <!-- 34: sculpted long flank with true transparent wheel-arch cutouts -->
  <g transform="translate(96 224)">
    <path d="M4 4h40v20h-2.9v-4.5a4.4 5.6 0 0 0-8.8 0V24H14.1v-4.5a4.4 5.6 0 0 0-8.8 0V24H4Z" fill="url(#flank)"/>
    <path d="M4.5 5.3h39M14.8 20.4h16.8" stroke="#d0d3d3" stroke-width=".4" opacity=".4"/>
    <path d="M17 5v14.3M29.4 5v14.3M4 12.5h40" stroke="#23292e" stroke-width=".55"/>
    <path d="M18 7.4h2.1M30.2 7.4h2.1" stroke="#bdc3c6" stroke-width=".5"/>
    <path d="M5.3 22v-2.5a4.4 5.6 0 0 1 8.8 0V22M32.3 22v-2.5a4.4 5.6 0 0 1 8.8 0V22" fill="none" stroke="#b0b6ba" stroke-width=".55"/>
  </g>
  <!-- 35: plain folded metal for beveled body ends and commercial sides -->
  <g transform="translate(144 224)"><rect x="4" y="4" width="40" height="20" fill="url(#flank)"/><path d="M4 5.3h40M4 20.4h40" stroke="#c1c5c6" stroke-width=".4" opacity=".32"/><path d="M4 13h40" stroke="#2d3339" stroke-width=".55"/></g>
  <!-- 36: front fascia: wide grille, paired rectangular headlights, bumper -->
  <g transform="translate(0 252)">
    <rect x="4" y="4" width="40" height="20" fill="#252d34"/>
    <path d="M4 5h40M4 19.5h40" stroke="#707d85" stroke-width=".8"/>
    <path d="M15 6.5h18v9H15Z" fill="#080d12"/>
    <path d="M16 8h16M16 10h16M16 12h16M16 14h16" stroke="#4d5b64" stroke-width=".4"/>
    <path d="M5.5 7h8v7h-8ZM34.5 7h8v7h-8Z" fill="#c9c3a0"/>
    <path d="M6 7.4h7M35 7.4h7" stroke="#f0e2b9" stroke-width=".8"/>
    <path d="M20 20.5h8v2h-8Z" fill="#686a66"/>
  </g>
  <!-- 37: low rear lamps and recessed number plate -->
  <g transform="translate(48 252)"><rect x="4" y="4" width="40" height="20" fill="#20272d"/><path d="M4 5h40M4 19.5h40" stroke="#68737a" stroke-width=".7"/><path d="M5.5 7h10v5h-10ZM32.5 7h10v5h-10Z" fill="#912c29"/><path d="M20 10h8v4h-8Z" fill="#8f927f"/><path d="M5.8 7.5h9M33 7.5h9" stroke="#bb4a35" stroke-width=".65"/></g>
  <!-- 38: tyre sidewall, inset hub and steel rim -->
  <g transform="translate(96 252)"><ellipse cx="24" cy="14" rx="8" ry="7" fill="#090d12"/><ellipse cx="24" cy="14" rx="5" ry="5.4" fill="#222b32"/><ellipse cx="24" cy="14" rx="3.8" ry="4.2" fill="#65737c"/><ellipse cx="24" cy="14" rx="2.6" ry="3" fill="#26323a"/><path d="M24 11v6M21.8 12.7l4.4 2.6M21.8 15.3l4.4-2.6" stroke="#78858c" stroke-width=".5"/><ellipse cx="24" cy="14" rx="1" ry="1.1" fill="#8d969b"/></g>
  <!-- 39: commercial passenger glazing -->
  <g transform="translate(144 252)"><rect x="4" y="4" width="40" height="20" fill="url(#screen)"/><path d="M4 4h40M4 24h40" stroke="#727e86" stroke-width="1.6"/><path d="M5 4v20M11 4v20M17 4v20M23 4v20M29 4v20M35 4v20M42 4v20" stroke="#232c34" stroke-width="1.1"/></g>
</svg>
