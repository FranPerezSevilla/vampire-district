<svg xmlns="http://www.w3.org/2000/svg" width="192" height="112" viewBox="0 0 192 112">
  <!-- Authored horizontal sections. Every cell is 48 x 28, nose points right.
       Neutral paint is tinted by the vehicle palette; glass and trim are separate. -->
  <defs>
    <path id="body" d="M9 6.4 36.7 6.4 40.8 8.2 41 19.8 37 21.6 9 21.6 7.2 19.9 7.2 8.1Z"/>
    <path id="deck" d="M10 6.8 36.4 6.8 39.7 8.8 39.7 19.2 36.4 21.2 10 21.2 8.7 19.7 8.7 8.3Z"/>
    <path id="glass" d="M15 8 26.7 8 30.8 10 30.8 18 26.7 20 15 20 11.8 18 11.8 10Z"/>
    <linearGradient id="paint" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".17" stop-color="#e6e6e6"/><stop offset=".8" stop-color="#c4c4c4"/><stop offset="1" stop-color="#777"/></linearGradient>
    <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#fbfbfb"/><stop offset=".22" stop-color="#e4e4e4"/><stop offset=".82" stop-color="#d6d6d6"/><stop offset="1" stop-color="#989898"/></linearGradient>
  </defs>
  <!-- 0: contact shadow -->
  <path d="M8 6 38 6 42 9 42 21 38 24 8 24 5 21 5 9Z" fill="#060808" opacity=".36"/>
  <!-- 1: one tyre, centred in its cell -->
  <g transform="translate(48)"><rect x="20.7" y="12.4" width="6.6" height="3.2" rx=".65" fill="#cacaca"/><path d="M21.5 13h5M21.5 15h5" stroke="#fff" stroke-width=".35"/></g>
  <!-- 2: dark undertray -->
  <g transform="translate(96)"><path d="M9 7 38 7 41 9 41 19 38 21 9 21 7 19 7 9Z" fill="#171b1c"/></g>
  <!-- 3: lower body section -->
  <g transform="translate(144)"><use href="#body" fill="#a1a1a1"/><path d="M10 7h25M10 21h25" stroke="#666" stroke-width=".75"/></g>
  <!-- 4: sculpted shoulder, subtly bevelled nose and boot -->
  <g transform="translate(0 28)"><use href="#body" fill="url(#paint)"/><path d="m37 7.5 2.2 1v11l-2.2 1M10 7.5v13" fill="none" stroke="#777" stroke-width=".4"/></g>
  <!-- 5: bonnet and boot deck -->
  <g transform="translate(48 28)"><use href="#deck" fill="url(#paint)"/><path d="M31 8.2h5.4l1.2.8v10l-1.2.8H31M10.8 8.5v11" fill="none" stroke="#626262" stroke-width=".35"/><path d="M32.5 8.8h3.2M11.6 8.6v10.8" stroke="#fff" stroke-opacity=".4" stroke-width=".28"/></g>
  <!-- 6: bumpers, grille, rectangular lamps and door furniture -->
  <g transform="translate(96 28)">
    <path d="M7.4 8.7v10.6M40.5 8.7v10.6" stroke="#b2a797" stroke-width=".8"/>
    <path d="M40.4 11v6" stroke="#24282a" stroke-width="1.2"/><path d="M40.6 11.4v5.2" stroke="#8a887d" stroke-width=".25"/>
    <path d="M38.8 8.8v2.5M38.8 16.7v2.5" stroke="#ecdbb3" stroke-width="1.5"/>
    <path d="M8.7 8.2v3.2M8.7 16.6v3.2" stroke="#943a35" stroke-width="1.1"/>
    <path d="M12 6.6h23M12 21.4h23" stroke="#948e81" stroke-width=".35"/>
    <path d="M17.8 7h1.5M25 7h1.5M17.8 21h1.5M25 21h1.5" stroke="#ccc1aa" stroke-width=".4"/>
  </g>
  <!-- 7: full lower glass section -->
  <g transform="translate(144 28)"><use href="#glass" fill="#253034" stroke="#686d64" stroke-width=".25"/><path d="M15 8.6 12.8 10.2v7.6l2.2 1.6M26.5 8.5l3.5 1.8v7.4l-3.5 1.8" fill="none" stroke="#121c20" stroke-width=".5"/></g>
  <!-- 8: tapering cabin -->
  <g transform="translate(0 56)"><path d="M16 8.7h10l3 1.8v7l-3 1.8H16l-2.6-1.8v-7Z" fill="#303d40"/><path d="M20.8 8.6v10.8" stroke="#171e20" stroke-width="1"/></g>
  <!-- 9: upper cabin -->
  <g transform="translate(48 56)"><path d="M16 9.4h10.3l2.2 1.4v6.4l-2.2 1.4H16l-1.6-1.4v-6.4Z" fill="#354347"/><path d="M27.8 10.8v6.4M15 11v6" stroke="#6b7b76" stroke-width=".28"/></g>
  <!-- 10: metal roof, gently tapered and inset -->
  <g transform="translate(96 56)"><path d="M17 9.7h8.8l1 1v6.6l-1 1H17l-1-1v-6.6Z" fill="url(#roof)"/><path d="M17.4 10.4h8M16.6 11v6.1" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width=".25"/></g>
  <!-- 11: upper surface details and mirrors -->
  <g transform="translate(144 56)"><path d="M17.8 11.6h4.7v4.8h-4.7Z" fill="#263136" stroke="#727b76" stroke-width=".3"/><path d="M18.3 12.1h3.6" stroke="#92988b" stroke-opacity=".5" stroke-width=".25"/><path d="M27.8 7v-1.4h-1.4v1.7M27.8 21v1.4h-1.4v-1.7" fill="#494f49" stroke="#171d1d" stroke-width=".3"/></g>
  <!-- 12: separately tintable bonnet damage -->
  <g transform="translate(0 84)"><path d="M31.2 8.5h4.7l1.4.9v9.2l-1.4.9h-4.7Z" fill="#dadada"/><path d="m32 9.5 2 2-1 3 2 3-2 1" fill="none" stroke="#777" stroke-width=".45"/></g>
  <!-- 13: body outline -->
  <g transform="translate(48 84)"><use href="#body" fill="none" stroke="#fff" stroke-width=".45"/></g>
  <!-- 14: restrained scratches on upper body -->
  <g transform="translate(96 84)" fill="none"><path d="M10 17.8h1.5M34 19.4h2M33.8 8.8h1.2" stroke="#b9b09b" stroke-opacity=".32" stroke-width=".24"/></g>
</svg>
