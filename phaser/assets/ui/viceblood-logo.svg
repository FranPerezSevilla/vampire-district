<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">VICEBLOOD</title>
  <desc id="desc">Distressed urban noir logo for ViceBlood.</desc>
  <defs>
    <filter id="distress" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.12" numOctaves="3" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="maskNoise">
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="maskNoise" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g transform="skewX(-5)" filter="url(#distress)" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="260" font-weight="900" letter-spacing="-10">
      <text x="40" y="270" fill="#ece7dc">VICE</text>
      <text x="535" y="270" fill="#a30d14">BLOOD</text>
    </g>
    <path d="M75 295 L116 295 L96 354 Z" fill="#ece7dc" opacity=".95"/>
  </g>
</svg>
