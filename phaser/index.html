<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Viceblood</title>
  <link rel="stylesheet" href="viewport.css" />
  <link rel="stylesheet" href="title-screen.css" />
  <link rel="stylesheet" href="ui-dist/interface.css" />
</head>
<body class="viceblood-title-active">
  <main id="viceblood-app" class="game-frame" aria-label="ViceBlood">
    <div id="game-root"></div>
    <div id="game-ui" aria-label="Game interface">
      <div id="interface-root"></div>
      <div id="ui-overlay-host"></div>
    </div>
    <div id="game-effects" aria-hidden="true"></div>
  <audio id="viceblood-main-menu-theme" src="assets/audio/music/main-menu-theme-01.mp3" preload="auto" aria-hidden="true"></audio>
  <div id="viceblood-title-screen" class="viceblood-title-screen" data-state="boot" aria-label="ViceBlood title screen">
    <div class="viceblood-title-full-cover" aria-hidden="true"></div>
    <div class="viceblood-title-menu-veil" aria-hidden="true"></div>

    <section class="viceblood-title-boot" aria-label="ViceBlood loading">
      <div class="viceblood-title-boot-lockup">
        <img class="viceblood-title-boot-logo" src="assets/ui/viceblood-logo.svg" alt="ViceBlood" />
        <p class="viceblood-title-boot-message" data-title-boot-message>The city never sleeps</p>
      </div>
    </section>

    <section class="viceblood-title-menu" data-title-menu aria-label="ViceBlood main menu" aria-hidden="true">
      <header class="viceblood-title-brand">
        <img class="viceblood-title-menu-logo" src="assets/ui/viceblood-logo.svg" alt="ViceBlood" />
      </header>

      <nav class="viceblood-title-nav" aria-label="Main menu">
        <button class="viceblood-title-action" data-title-action="continue" type="button" disabled>Continue</button>
        <button class="viceblood-title-action" data-title-action="new-night" type="button">New Night</button>
        <button class="viceblood-title-action" data-title-action="options" type="button">Options</button>
        <button class="viceblood-title-action" data-title-action="credits" type="button">Credits</button>
      </nav>

      <footer class="viceblood-title-footer">
        <span>The city never sleeps.</span>
        <small>ViceBlood · Pre-alpha</small>
      </footer>
    </section>

    <aside class="viceblood-title-drawer" data-title-drawer aria-hidden="true">
      <div class="viceblood-title-drawer-inner">
        <h2 data-title-drawer-title></h2>
        <p class="viceblood-title-drawer-body" data-title-drawer-body></p>
        <div class="viceblood-title-drawer-content" data-title-drawer-content></div>
        <p class="viceblood-title-drawer-hint" data-title-drawer-hint></p>
      </div>
    </aside>
  </div>


  </main>
  <script type="module" src="src/app-bootstrap.js"></script>
</body>
</html>
