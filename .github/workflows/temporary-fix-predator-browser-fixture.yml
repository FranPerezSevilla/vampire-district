name: Fix Milestone 15.7 browser fixture

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-predator-browser-fixture-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/blood-sense-whisper-beast'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Make the predator-power fixture streaming-safe
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('tests/browser/predator-powers.spec.js')
          text = path.read_text()

          old_origin = '''    scene.currentLayer = 0;
    scene.player.setPosition(1490, 500);
    scene.feedingSystem.hunger = 10;
'''
          new_origin = '''    scene.currentLayer = 0;
    const origin = { x: scene.player.x, y: scene.player.y };
    scene.feedingSystem.hunger = 10;
'''

          old_positions = '''    resetNpc(prey, 1520, 500);
    resetNpc(memoryTarget, 1560, 500);
    resetNpc(watcher, 1800, 500);
    resetNpc(officer, 1600, 500);
    memoryTarget.combat.resilience = 1;
    officer.noHeartbeat = true;
'''
          new_positions = '''    resetNpc(prey, origin.x + 30, origin.y);
    resetNpc(memoryTarget, origin.x + 70, origin.y);
    resetNpc(watcher, origin.x + 310, origin.y);
    resetNpc(officer, origin.x + 110, origin.y);
    memoryTarget.combat.resilience = 1;
    officer.noHeartbeat = true;
'''

          old_blood = '''    scene.evidenceSystem.createBloodStain(1540, 520, 0, "browser-predator-powers");
'''
          new_blood = '''    scene.evidenceSystem.createBloodStain(origin.x + 50, origin.y + 20, 0, "browser-predator-powers");
'''

          for old, new, label in (
              (old_origin, new_origin, 'origin'),
              (old_positions, new_positions, 'positions'),
              (old_blood, new_blood, 'blood stain'),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected {label} fixture precondition: {text.count(old)} matches')
              text = text.replace(old, new)

          path.write_text(text)
          PY

          rm -f .github/workflows/temporary-fix-predator-browser-fixture.yml
          git diff --check

      - name: Publish fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make predator powers browser fixture streaming-safe'
          git push origin "HEAD:${TARGET_BRANCH}"
