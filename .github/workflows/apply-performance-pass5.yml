# transient applicator: remove itself after successful focused validation
name: Apply performance pass 5

on:
  push:
    branches: [audio/playtest-p0]
    paths:
      - .github/workflows/apply-performance-pass5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hot-path interaction selection optimization
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          traversal = Path('phaser/src/data/traversal.js')
          text = traversal.read_text()
          old = '''export function selectTraversalCandidate(player, aimDirection, candidates = [], rules = TRAVERSAL_RULES) {
  return candidates
    .map(candidate => ({ candidate, evaluation: evaluateTraversalCandidate(player, aimDirection, candidate, rules) }))
    .filter(item => item.evaluation.valid)
    .sort((a, b) => {
      const score = a.evaluation.score - b.evaluation.score;
      if (Math.abs(score) > 1e-9) return score;
      return String(a.candidate.id || "").localeCompare(String(b.candidate.id || ""));
    })[0]?.candidate || null;
}
'''
          new = '''export function selectTraversalCandidate(player, aimDirection, candidates = [], rules = TRAVERSAL_RULES) {
  let selected = null;
  let selectedEvaluation = null;
  for (const candidate of candidates) {
    const evaluation = evaluateTraversalCandidate(player, aimDirection, candidate, rules);
    if (!evaluation.valid) continue;
    if (!selected) {
      selected = candidate;
      selectedEvaluation = evaluation;
      continue;
    }
    const score = evaluation.score - selectedEvaluation.score;
    if (score < -1e-9 || (
      Math.abs(score) <= 1e-9
      && String(candidate.id || "").localeCompare(String(selected.id || "")) < 0
    )) {
      selected = candidate;
      selectedEvaluation = evaluation;
    }
  }
  return selected;
}
'''
          if old not in text:
            raise SystemExit('Traversal selection source no longer matches expected baseline')
          traversal.write_text(text.replace(old, new))

          interaction = Path('phaser/src/systems/InteractionSystemCore.js')
          text = interaction.read_text()
          anchor = '''const TRAVERSAL_TYPES = new Set([
  "fireEscapeUp",
  "fireEscapeDown",
  "sewerDown",
  "sewerUp",
  "privateShaft",
  "roofJump",
  "roofDrop"
]);
'''
          addition = anchor + '''
const DEFAULT_AIM = Object.freeze({ x: 0, y: -1 });

function compareStandardOptions(a, b) {
  const priority = (b.priority || 0) - (a.priority || 0);
  if (priority !== 0) return priority;
  const distance = (a.distance || 0) - (b.distance || 0);
  if (Math.abs(distance) > 1e-9) return distance;
  return String(a.id || "").localeCompare(String(b.id || ""));
}
'''
          if anchor not in text:
            raise SystemExit('Interaction traversal anchor missing')
          text = text.replace(anchor, addition, 1)
          old_method = '''  sortOptions(options = []) {
    if (options.length && options.every(isTraversalAction) && this.scene?.player) {
      const player = { x: this.scene.player.x, y: this.scene.player.y };
      const aim = this.scene.combatSystem?.aimDirection || { x: 0, y: -1 };
      const selected = selectTraversalCandidate(player, aim, options);
      if (!selected) return [];
      return [...options].sort((a, b) => {
        if (a === selected) return -1;
        if (b === selected) return 1;
        const ea = evaluateTraversalCandidate(player, aim, a);
        const eb = evaluateTraversalCandidate(player, aim, b);
        const score = ea.score - eb.score;
        if (Math.abs(score) > 1e-9) return score;
        return String(a.id || "").localeCompare(String(b.id || ""));
      });
    }

    return [...options].sort((a, b) => {
      const priority = (b.priority || 0) - (a.priority || 0);
      if (priority !== 0) return priority;
      const distance = (a.distance || 0) - (b.distance || 0);
      if (Math.abs(distance) > 1e-9) return distance;
      return String(a.id || "").localeCompare(String(b.id || ""));
    });
  }
'''
          new_method = '''  bestOption(options = []) {
    if (!options.length) return null;
    if (options.every(isTraversalAction) && this.scene?.player) {
      const aim = this.scene.combatSystem?.aimDirection || DEFAULT_AIM;
      return selectTraversalCandidate(this.scene.player, aim, options);
    }

    let best = null;
    for (const option of options) {
      if (!best || compareStandardOptions(option, best) < 0) best = option;
    }
    return best;
  }

  sortOptions(options = []) {
    if (options.length && options.every(isTraversalAction) && this.scene?.player) {
      const player = this.scene.player;
      const aim = this.scene.combatSystem?.aimDirection || DEFAULT_AIM;
      const selected = selectTraversalCandidate(player, aim, options);
      if (!selected) return [];
      return [...options].sort((a, b) => {
        if (a === selected) return -1;
        if (b === selected) return 1;
        const ea = evaluateTraversalCandidate(player, aim, a);
        const eb = evaluateTraversalCandidate(player, aim, b);
        const score = ea.score - eb.score;
        if (Math.abs(score) > 1e-9) return score;
        return String(a.id || "").localeCompare(String(b.id || ""));
      });
    }

    return [...options].sort(compareStandardOptions);
  }
'''
          if old_method not in text:
            raise SystemExit('Interaction sortOptions source no longer matches expected baseline')
          interaction.write_text(text.replace(old_method, new_method, 1))

          runtime = Path('phaser/src/runtime/GameplayRuntimeCore.js')
          text = runtime.read_text()
          old_nearest = '''function nearest(scene, options = []) {
  return scene.interactionSystem.sortOptions(options)[0] || null;
}
'''
          new_nearest = '''function nearest(scene, options = []) {
  const bestOption = scene.interactionSystem?.bestOption;
  if (typeof bestOption === "function") return bestOption.call(scene.interactionSystem, options);
  return scene.interactionSystem.sortOptions(options)[0] || null;
}
'''
          if old_nearest not in text:
            raise SystemExit('GameplayRuntime nearest source no longer matches expected baseline')
          runtime.write_text(text.replace(old_nearest, new_nearest, 1))

          Path('tests/interaction-selection-performance.test.js').write_text('''import test from "node:test";
import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import { InteractionSystem } from "../phaser/src/systems/InteractionSystemCore.js";
import { selectTraversalCandidate } from "../phaser/src/data/traversal.js";

const source = path => readFileSync(new URL(`../${path}`, import.meta.url), "utf8");

test("bestOption preserves standard interaction priority without sorting or cloning", () => {
  const scene = { player: { x: 0, y: 0 }, combatSystem: { aimDirection: { x: 1, y: 0 } } };
  const system = new InteractionSystem(scene);
  const options = [
    { id: "lower-priority", priority: 5, distance: 1 },
    { id: "far", priority: 10, distance: 8 },
    { id: "b-near", priority: 10, distance: 3 },
    { id: "a-near", priority: 10, distance: 3 }
  ];
  const order = [...options];
  const best = system.bestOption(options);
  assert.equal(best.id, "a-near");
  assert.equal(system.sortOptions(options)[0], best);
  assert.deepEqual(options, order);
});

test("traversal selection remains deterministic while using a single pass", () => {
  const player = { x: 0, y: 0 };
  const aim = { x: 1, y: 0 };
  const options = [
    { id: "far", x: 30, y: 0, priority: 60 },
    { id: "b-near", x: 8, y: 0, priority: 60 },
    { id: "a-near", x: 8, y: 0, priority: 60 }
  ];
  assert.equal(selectTraversalCandidate(player, aim, options)?.id, "a-near");

  const traversalSource = source("phaser/src/data/traversal.js");
  const selectionBody = traversalSource.slice(traversalSource.indexOf("export function selectTraversalCandidate"));
  assert.doesNotMatch(selectionBody, /candidates\s*\.map\s*\(/);
  assert.doesNotMatch(selectionBody, /\.filter\s*\(/);
  assert.doesNotMatch(selectionBody, /\.sort\s*\(/);
});

test("GameplayRuntime nearest hot path uses bestOption instead of full option sorting", () => {
  const runtime = source("phaser/src/runtime/GameplayRuntimeCore.js");
  const nearestBody = runtime.slice(runtime.indexOf("function nearest"), runtime.indexOf("export class GameplayRuntime"));
  assert.match(nearestBody, /interactionSystem\?\.bestOption/);
  assert.match(nearestBody, /typeof bestOption === "function"/);
});
''')

          docs = Path('docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md')
          doc = docs.read_text()
          marker = '## Performance pass 5 — interaction selection hot path'
          if marker not in doc:
            doc += '''\n\n## Performance pass 5 — interaction selection hot path\n\n**State: implemented on PR #55; browser frame-time impact still requires in-game observation.**\n\n- Profiling review of `GameplayRuntimeCore` found that nearest-action lookup was calling `InteractionSystem.sortOptions()` repeatedly on the active gameplay path. A normal active frame performs at least four nearest lookups (movement + interaction before simulation, then both again after simulation), and traversal/interact input can add more. Each lookup cloned and fully sorted the candidate array even though only the first option was needed.\n- `InteractionSystem.bestOption()` now performs a zero-clone linear scan for ordinary interactions. Full sorting remains available only where ordered menus actually need it. This changes nearest selection from **O(n log n) + one array clone** to **O(n)** with no candidate-array clone.\n- At 60 FPS, the baseline four nearest lookups represented at least **240 unnecessary full sorts and array clones per second / 14,400 per minute** during active gameplay. Those hot-path sorts are now eliminated.\n- Traversal candidate selection also moved from `map → filter → sort` to a deterministic single pass, removing the temporary mapped/filter arrays and wrapper objects while preserving score and stable-id tie breaking.\n- This pass deliberately does not claim an FPS gain from static analysis alone. RuntimeDiagnostics remains the browser authority for before/after frame-time observation; the change removes a confirmed repeated hot-path allocation/sort cost without altering interaction semantics.\n\n### Acceptance\n\n- The same highest-priority/nearest/stable-id ordinary interaction wins before and after the optimization.\n- Traversal selection preserves committed-radius, aim and stable-id behavior.\n- Opening a multi-option interaction menu still returns the fully ordered option list.\n- Active-frame nearest lookup does not clone/sort the full interaction candidate list.\n'''
            docs.write_text(doc)

          Path('.github/workflows/apply-performance-pass5.yml').unlink()
          PY
      - name: Run focused regression tests
        run: node --test tests/interaction-selection-performance.test.js
      - name: Commit performance pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize interaction selection hot path"
          git push origin HEAD:audio/playtest-p0
