name: Integrate systemic vehicle engine audio

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/integrate-systemic-vehicle-engine-audio.yml
      - tools/_tmp-integrate-vehicle-engine-audio.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply systemic engine audio
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_tmp-integrate-vehicle-engine-audio.py

      - name: Remove one-off helpers
        shell: bash
        run: |
          set -euo pipefail
          rm tools/_tmp-integrate-vehicle-engine-audio.py
          rm .github/workflows/integrate-systemic-vehicle-engine-audio.yml

      - name: Validate focused vehicle audio behavior
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/vehicle-engine-audio.test.js \
            tests/vehicle-model.test.js \
            tests/vehicle-runtime-source.test.js \
            tests/aggressive-driving-panic.test.js \
            tests/vehicle-skid-audio.test.js \
            tests/motorized-police.test.js \
            tests/city-streaming-4e.test.js
          git diff --check
          npm run check:affected:plan -- --base=origin/main

      - name: Compare full fast-check baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run check:fast 2>&1 | tee /tmp/check-fast.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "check:fast is fully green."
            exit 0
          fi
          if ! grep -Eq '^# fail 10$' /tmp/check-fast.log; then
            echo "check:fast no longer matches the known 10-failure branch baseline." >&2
            exit "$status"
          fi
          echo "check:fast retains exactly the known 10-failure branch baseline; focused engine tests passed."

      - name: Commit systemic engine audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add systemic gear-aware vehicle engine audio"
          git push
