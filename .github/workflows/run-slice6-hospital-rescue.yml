name: Run corrected Slice 6 hospital applicator

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/run-slice6-hospital-rescue.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute corrected applicator body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/apply-slice6-hospital.yml').read_text().splitlines()
          marker = '        run: |'
          start = lines.index(marker) + 1
          body = []
          for line in lines[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          script = script.replace(
              'assert.match(code, /hospital-recovery-lackey/);',
              'assert.match(code, /HOSPITAL_RECOVERY\\.lackeyId/);'
          )
          Path('/tmp/apply-slice6.sh').write_text(script)
          PY
          bash /tmp/apply-slice6.sh