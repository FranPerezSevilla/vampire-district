name: HUD review build
on:
  push:
    branches: [codex/hud-build]
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2c63f149b53f10bdcac515ae08b7db8cda63308
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native and DOM checks
        run: npm run check:fast
      - name: Build exact production package
        run: |
          npm run build
          node tools/boot/verify-package.mjs
          node tools/boot/smoke-module.mjs
      - name: Publish bounded HUD review assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const { createHash } = require('node:crypto');
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const source = 'e2c63f149b53f10bdcac515ae08b7db8cda63308';
            const expectedPages = '6f44c4b526a0f20093da3fbd7d1c46689537783b';
            const pagesBranch = 'codex/traffic-junction-topology';
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const blobSha = bytes => createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes])).digest('hex');
            if (git('rev-parse', 'HEAD') !== source) throw new Error('Wrong HUD source checkout');
            const build = JSON.parse(await fs.readFile('dist/build.json', 'utf8'));
            if (build.revision !== source || build.dirty) throw new Error('Build provenance mismatch');
            const runtimePath = `phaser/runtime-dist/game.${build.runtimeSha256.slice(0,16)}.js`;
            const allowed = [
              'build.json',
              'boot-assets.json',
              'index.html',
              'phaser/index.html',
              'phaser/ui-dist/interface.js',
              'phaser/ui-dist/interface.css',
              runtimePath
            ];
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${pagesBranch}` });
            if (ref.data.object.sha !== expectedPages) throw new Error(`Pages moved: ${ref.data.object.sha}`);
            const currentCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: expectedPages });
            const currentTree = await github.rest.git.getTree({ owner, repo, tree_sha: currentCommit.data.tree.sha, recursive: '1' });
            const current = new Map(currentTree.data.tree.filter(e => e.type === 'blob').map(e => [e.path, e.sha]));
            const changes = [];
            for (const path of allowed) {
              const bytes = await fs.readFile(`dist/${path}`);
              const sha = blobSha(bytes);
              if (current.get(path) === sha) continue;
              const created = await github.rest.git.createBlob({ owner, repo, content: bytes.toString('base64'), encoding: 'base64' });
              if (created.data.sha !== sha) throw new Error(`Blob mismatch for ${path}`);
              changes.push({ path, mode: '100644', type: 'blob', sha });
            }
            if (!changes.length) throw new Error('No HUD publication changes found');
            const tree = await github.rest.git.createTree({ owner, repo, base_tree: currentCommit.data.tree.sha, tree: changes });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: `deploy: publish gothic-punk in-game HUD review\n\nReview build from ${source}. Bounded to generated HUD/runtime entry assets; existing accepted source and Pages history stay intact. Native/DOM/package smoke passed in this workflow. PR #85 remains unmerged pending player visual acceptance.`,
              tree: tree.data.sha,
              parents: [expectedPages]
            });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${pagesBranch}`, sha: commit.data.sha, force: false });
            core.notice(`Published ${commit.data.sha}: ${changes.map(e => e.path).join(', ')}`);
      - uses: actions/upload-artifact@v4
        with:
          name: hud-review-dist
          path: dist/
          retention-days: 3
