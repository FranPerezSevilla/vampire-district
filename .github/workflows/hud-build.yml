name: HUD review build
on:
  push:
    branches: [codex/hud-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gothic-punk-game-hud
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native and DOM checks
        run: npm run check:fast
      - name: Build exact production package
        run: |
          npm run build
          node tools/boot/verify-package.mjs
          node tools/boot/smoke-module.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hud-review-dist
          path: dist/
          retention-days: 3
