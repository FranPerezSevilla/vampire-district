name: Repair PR73 one-time workflow

on:
  push:
    branches:
      - codex/traffic-junction-topology
    paths:
      - .github/workflows/one-time-repair-pr73-workflow.yml

permissions:
  contents: write

jobs:
  repair-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/traffic-junction-topology
          fetch-depth: 0

      - name: Correct queued-body policy and validation staging
        run: python tools/dev/one-time-pr73-meta-repair.py

      - name: Commit repaired repair inputs
        shell: bash
        run: |
          rm tools/dev/one-time-pr73-meta-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/dev/one-time-pr73-junction-patch.py \
            tools/dev/one-time-pr73-meta-repair.py \
            .github/workflows/one-time-pr73-video-traffic-fix.yml
          git commit -m "chore: correct PR73 video repair validation"
          git push origin HEAD:codex/traffic-junction-topology
