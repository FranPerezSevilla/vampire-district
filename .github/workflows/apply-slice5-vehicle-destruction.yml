name: Apply Slice 5 vehicle destruction

on:
  push:
    branches: ["audio/playtest-p0"]
    paths:
      - ".github/workflows/apply-slice5-vehicle-destruction.yml"
      - ".github/scripts/apply-slice5-vehicle-destruction.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "audio/playtest-p0"
          fetch-depth: 0
      - name: Apply increment
        run: python .github/scripts/apply-slice5-vehicle-destruction.py
      - name: Focused tests
        run: node --test tests/player-damage.test.js tests/vehicle-destruction.test.js
      - name: Commit implementation
        run: |
          git config user.name "FranPerezSevilla"
          git config user.email "fjperezga@gmail.com"
          git add phaser/src/vehicles/VehicleDestructionPolicy.js phaser/src/vehicles/VehicleSystem.js phaser/src/vehicles/VehicleDriving.js tests/vehicle-destruction.test.js docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md
          git rm .github/workflows/apply-slice5-vehicle-destruction.yml .github/scripts/apply-slice5-vehicle-destruction.py
          git commit -m "Complete Slice 5 vehicle destruction"
          git push origin HEAD:audio/playtest-p0
