name: Integrate vehicle door close audio

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/integrate-vehicle-door-close.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Reconstruct and integrate door-close audio
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integrate_vehicle_door_close.py

      - name: Validate focused vehicle-door behavior
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/audio-sample-catalog.test.js tests/vehicle-door-audio.test.js

      - name: Remove one-off staging helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/_door_close_parts
          rm -f scripts/integrate_vehicle_door_close.py
          rm -f .github/workflows/integrate-vehicle-door-close.yml

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 1
          fi
          git commit -m "Integrate real vehicle door closing audio"
          git push
