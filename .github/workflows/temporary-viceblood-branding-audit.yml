name: Temporary Viceblood branding audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build branding and legacy audit report
        shell: bash
        run: |
          set -euo pipefail
          report=branding-audit-report.txt
          : > "$report"

          {
            echo '===== VAMPIRE DISTRICT BRANDING OCCURRENCES ====='
            git grep -n -I -i -E 'vampire[ _-]+district' -- . || true

            echo '===== PROTOTYPE AND LEGACY REFERENCES ====='
            git grep -n -I -i -E 'original prototype|prototype original|legacy prototype|old prototype|prototype link|legacy/|/legacy|prototype/' -- . || true

            echo '===== OLD-SLUG / PROTOTYPE URLS AND HREFS ====='
            git grep -n -I -i -E '(https?://[^ ]*(vampire-district|prototype|legacy)|href=[^ >]*(vampire-district|prototype|legacy))' -- . || true

            echo '===== LEGACY BLOCK FILES ====='
            git ls-files css js legacy | sort || true

            echo '===== REFERENCES TO ROOT CSS/JS/LEGACY OUTSIDE THAT BLOCK ====='
            git grep -n -I -i -E '(["'"'/(])(css|js|legacy)/|prototype-threat-limits' -- . ':(exclude)css/**' ':(exclude)js/**' ':(exclude)legacy/**' || true

            echo '===== PATCH TOOL FILES ====='
            git ls-files 'tools/patch-*.mjs' | sort || true

            echo '===== REFERENCES TO PATCH TOOLS OUTSIDE THEMSELVES ====='
            git grep -n -I -i -E 'tools/patch-[^ ]+\.mjs|patch-phase11-powers|patch-phaser-hunters' -- . ':(exclude)tools/patch-*.mjs' || true

            echo '===== PACKAGE AND WORKFLOW TOOL REFERENCES ====='
            git grep -n -I -i -E 'tools/|legacy/|css/|js/' -- package.json '.github/workflows/*.yml' '.github/workflows/*.yaml' || true
          } >> "$report"

          wc -l "$report"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: viceblood-branding-audit
          path: branding-audit-report.txt
          if-no-files-found: error
          retention-days: 2
