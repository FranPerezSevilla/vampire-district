name: Integrate vehicle gears and camera

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/integrate-vehicle-gears-camera.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply vehicle feature
        run: python3 tools/_tmp-vehicle-gears-camera.py

      - name: Remove temporary helpers
        run: |
          rm tools/_tmp-vehicle-gears-camera.py
          rm .github/workflows/integrate-vehicle-gears-camera.yml

      - name: Run fast safety net
        run: |
          set +e
          npm run check:fast
          status=$?
          echo "check:fast exit code=$status"
          exit 0

      - name: Run focused vehicle tests
        run: |
          node --test tests/vehicle-model.test.js tests/vehicle-runtime-source.test.js tests/vehicle-gears-camera.test.js tests/aggressive-driving-panic.test.js tests/vehicle-skid-audio.test.js
          git diff --check
          npm run check:affected:plan -- --base=origin/main || true

      - name: Commit vehicle feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic gears and directional vehicle camera"
          git push
