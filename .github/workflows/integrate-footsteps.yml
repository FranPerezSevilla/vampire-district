name: Integrate real footstep audio

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - ".github/workflows/integrate-footsteps.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Recover verified integration script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/FranPerezSevilla/vampire-district/git/blobs/6a56c412955066cb490b7ddd88611274d919ee2e" \
            -o /tmp/footstep-script-blob.json
          python3 - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path
          blob = json.loads(Path('/tmp/footstep-script-blob.json').read_text())
          packed_text = base64.b64decode(blob['content']).decode('utf-8')
          script = gzip.decompress(base64.b64decode(packed_text))
          Path('/tmp/integrate_footsteps.py').write_bytes(script)
          PY

      - name: Materialize and wire footsteps
        run: python3 /tmp/integrate_footsteps.py

      - name: Run focused footstep tests
        run: |
          node --test \
            tests/footstep-audio.test.js \
            tests/audio-sample-catalog.test.js \
            tests/movement.test.js

      - name: Remove one-off integration workflow
        run: rm -f .github/workflows/integrate-footsteps.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate real concrete footstep audio"
          git push origin HEAD:audio/playtest-p0
