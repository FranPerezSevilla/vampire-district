name: Remove weapon-change popups

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/hunting-rights-poaching
          fetch-depth: 0

      - name: Detect pending change
        id: gate
        shell: bash
        run: |
          if grep -q 'this.scene.lastActionText = `EQUIPPED:' phaser/src/systems/WeaponSystem.js; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply popup cleanup and regression test
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          weapon = Path('phaser/src/systems/WeaponSystem.js')
          text = weapon.read_text()
          old = '''    RawAudio.play("menu", { cooldown: 0.04 });\n    this.scene.lastActionText = `EQUIPPED: ${current.name}${this.ammoLabel(current, true)}.`;\n    this.scene.events?.emit?.("weapon:changed", {\n'''
          new = '''    RawAudio.play("menu", { cooldown: 0.04 });\n    this.scene.events?.emit?.("weapon:changed", {\n'''
          if old not in text:
              raise SystemExit('WeaponSystem popup contract changed unexpectedly.')
          weapon.write_text(text.replace(old, new))

          guidance = Path('phaser/src/systems/UxGuidanceSystem.js')
          text = guidance.read_text()
          old = '''  handleWeaponChanged(payload = {}) {\n    this.weaponChanges += 1;\n    const ammo = payload.ammo == null ? "unlimited use" : `${payload.ammo} rounds`;\n    this.showTransient(\n      "LMB",\n      `${payload.name || "Weapon"} equipped · ${ammo}. Left-click attacks in the aimed direction.`,\n      3_800,\n      "weapon"\n    );\n  }\n'''
          new = '''  handleWeaponChanged() {\n    this.weaponChanges += 1;\n  }\n'''
          if old not in text:
              raise SystemExit('UxGuidance weapon popup contract changed unexpectedly.')
          guidance.write_text(text.replace(old, new))

          docs = Path('docs/WEAPON_SYSTEM.md')
          text = docs.read_text()
          docs.write_text(text.replace(
              '- Successful wheel step produces `EQUIPPED: ...`.\n',
              '- Weapon cycling updates only the persistent weapon HUD; it creates no transient top or bottom popup.\n'
          ))
          PY

          cat > tests/browser/weapon-cycle-feedback.spec.js <<'EOF'
          import { expect, test } from "@playwright/test";

          test("weapon cycling updates the persistent HUD without top or bottom popups", async ({ page }) => {
            await page.goto("/?rcTest=1", { waitUntil: "domcontentloaded" });
            await page.waitForFunction(() => Boolean(
              window.NBD_APP_READY
              && window.NBD_PHASER_GAME?.scene?.getScene?.("GameScene")?.weaponSystem
            ));
            await page.keyboard.press("Enter");

            const result = await page.evaluate(() => {
              const scene = window.NBD_PHASER_GAME.scene.getScene("GameScene");
              scene.registry.set("uiPaused", false);
              scene.lastActionText = "";
              scene.registry.set("lastActionText", "");
              scene.uxGuidanceSystem.transient = null;
              const before = scene.weaponSystem.state();
              const changed = scene.weaponSystem.cycle(1);
              const after = scene.weaponSystem.state();
              return {
                changed,
                beforeId: before.id,
                afterId: after.id,
                afterName: after.name,
                lastActionText: scene.lastActionText,
                transient: scene.uxGuidanceSystem.transient
              };
            });

            expect(result.changed).toBe(true);
            expect(result.afterId).not.toBe(result.beforeId);
            expect(result.lastActionText).toBe("");
            expect(result.transient).toBeNull();
            await expect(page.locator(".weapon-hud strong")).toHaveText(result.afterName);
            await expect(page.locator("#hud-toast")).not.toHaveClass(/visible/);
          });
          EOF

          rm -f .github/workflows/temporary-remove-weapon-popups.yml

      - name: Install dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run unit tests
        if: steps.gate.outputs.apply == 'true'
        run: node --test tests/*.test.js

      - name: Install Chromium
        if: steps.gate.outputs.apply == 'true'
        run: npx playwright install chromium

      - name: Validate popup removal
        if: steps.gate.outputs.apply == 'true'
        run: npx playwright test tests/browser/weapon-cycle-feedback.spec.js

      - name: Commit implementation
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add phaser/src/systems/WeaponSystem.js phaser/src/systems/UxGuidanceSystem.js docs/WEAPON_SYSTEM.md tests/browser/weapon-cycle-feedback.spec.js
          git commit -m "Remove weapon change popups"
          git push origin HEAD:agent/hunting-rights-poaching
