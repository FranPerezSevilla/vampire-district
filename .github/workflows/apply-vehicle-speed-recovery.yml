name: Apply vehicle speed recovery

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/apply-vehicle-speed-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply vehicle speed recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: anchor mismatch: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          vehicles = "phaser/src/data/vehicles.js"
          for old, new in [
              ("maxSpeed: 310", "maxSpeed: 340"),
              ("maxSpeed: 330", "maxSpeed: 360"),
              ("maxSpeed: 275", "maxSpeed: 300"),
              ("maxSpeed: 365", "maxSpeed: 400"),
          ]:
              replace_once(vehicles, old, new)

          model = "phaser/src/vehicles/VehicleModel.js"
          replace_once(model,
              "  // Keep the launch punch, then let higher gears trade torque for a longer,\n  // readable build toward top speed instead of sprinting through the box.\n  return 1.20 - 0.62 * Math.pow(progress, 0.82);",
              "  // Lower gears keep the lively launch. Upper gears still trade torque, but not\n  // enough to make the post-shift car feel strangled: fifth retains 70% drive torque.\n  return 1.20 - 0.50 * Math.pow(progress, 0.85);")
          replace_once(model,
              "  const taperStart = 0.58;\n  if (ratio <= taperStart) return 1;\n  const remaining = clamp((1 - ratio) / (1 - taperStart), 0, 1);\n  // Near maximum speed the car should keep gaining speed, but slowly enough\n  // that 4th/5th gear have time to exist as an audible/driving state.\n  return 0.02 + 0.98 * Math.pow(remaining, 1.5);",
              "  const taperStart = 0.62;\n  if (ratio <= taperStart) return 1;\n  const remaining = clamp((1 - ratio) / (1 - taperStart), 0, 1);\n  // Preserve a readable final pull without making the last gears feel artificially weak.\n  return 0.025 + 0.975 * Math.pow(remaining, 1.35);")

          macro = "phaser/src/streaming/MacroTrafficPoliceSystem.js"
          replace_once(macro,
              "export const DEFAULT_MACRO_GRAPH_URL = new URL(\n  \"../../assets/city/packs/macro-graph.json\",\n  import.meta.url\n).toString();",
              "export const DEFAULT_MACRO_GRAPH_URL = new URL(\n  \"../../assets/city/packs/macro-graph.json\",\n  import.meta.url\n).toString();\n\nexport const DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER = 1.12;\n\nexport function effectiveTrafficTravelSeconds(value, multiplier = DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER) {\n  const bounded = Math.max(0.75, Math.min(1.5, finite(multiplier, DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER)));\n  return Math.max(1, finite(value, 6)) / bounded;\n}")
          replace_once(macro,
              "    policeBudget = 4,\n    maxCatchUpTicks = 2\n  } = {}) {",
              "    policeBudget = 4,\n    maxCatchUpTicks = 2,\n    trafficSpeedMultiplier = DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER\n  } = {}) {")
          replace_once(macro,
              "    this.maxCatchUpTicks = Math.max(1, Math.floor(finite(maxCatchUpTicks, 2)));\n    this.graph = null;",
              "    this.maxCatchUpTicks = Math.max(1, Math.floor(finite(maxCatchUpTicks, 2)));\n    this.trafficSpeedMultiplier = Math.max(0.75, Math.min(1.5, finite(\n      trafficSpeedMultiplier, DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER\n    )));\n    this.graph = null;")
          replace_once(macro,
              "      const increment = Math.max(0, finite(seconds)) / Math.max(1, finite(edge.travelSeconds, 6));",
              "      const increment = Math.max(0, finite(seconds)) / effectiveTrafficTravelSeconds(\n        edge.travelSeconds, this.trafficSpeedMultiplier\n      );")

          behavior = "phaser/src/streaming/TrafficLocalBehaviorSystem.js"
          replace_once(behavior,
              "import { LAYERS } from \"../data/district.js\";\nimport { RawAudio } from \"../systems/RawAudioSystem.js\";",
              "import { LAYERS } from \"../data/district.js\";\nimport { RawAudio } from \"../systems/RawAudioSystem.js\";\nimport { effectiveTrafficTravelSeconds } from \"./MacroTrafficPoliceSystem.js\";")
          replace_once(behavior,
              "    const travelSeconds = Math.max(1, finite(edge?.travelSeconds, 6));",
              "    const travelSeconds = effectiveTrafficTravelSeconds(\n      edge?.travelSeconds, this.materializer.macro?.trafficSpeedMultiplier ?? 1\n    );")

          policy = "phaser/src/police/MotorizedPolicePolicy.js"
          replace_once(policy,
              "export const MOTORIZED_POLICE_TACTICS = Object.freeze({\n  ROUTE: \"route\",\n  INTERCEPT: \"intercept\",\n  RAM_TELEGRAPH: \"ram-telegraph\",\n  RAM_COMMIT: \"ram-commit\",\n  REAR_QUARTER: \"rear-quarter\",\n  PIT_TELEGRAPH: \"pit-telegraph\",\n  PIT_COMMIT: \"pit-commit\",\n  ROADBLOCK: \"roadblock\"\n});",
              "export const MOTORIZED_POLICE_TACTICS = Object.freeze({\n  ROUTE: \"route\",\n  INTERCEPT: \"intercept\",\n  RAM_TELEGRAPH: \"ram-telegraph\",\n  RAM_COMMIT: \"ram-commit\",\n  REAR_QUARTER: \"rear-quarter\",\n  PIT_TELEGRAPH: \"pit-telegraph\",\n  PIT_COMMIT: \"pit-commit\",\n  ROADBLOCK: \"roadblock\"\n});\n\nexport const MOTORIZED_POLICE_LOCAL_SPEEDS = Object.freeze({\n  PIT_TELEGRAPH: 315, PIT_COMMIT: 430, REAR_QUARTER: 390,\n  RAM_TELEGRAPH: 90, RAM_COMMIT: 240, ON_FOOT_INTERCEPT: 175\n});")

          police = "phaser/src/police/MotorizedPoliceSystem.js"
          replace_once(police,
              "  MOTORIZED_POLICE_ROLES,\n  MOTORIZED_POLICE_TACTICS,\n  policeTacticLabel,",
              "  MOTORIZED_POLICE_ROLES,\n  MOTORIZED_POLICE_TACTICS,\n  MOTORIZED_POLICE_LOCAL_SPEEDS,\n  policeTacticLabel,")
          for old, new in [
              ("this.moveTacticalUnit(unit, pressureTarget, dt, 108, { turnRate: 1.55 });", "this.moveTacticalUnit(unit, pressureTarget, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_TELEGRAPH, { turnRate: 1.55 });"),
              ("this.moveTacticalUnit(unit, contactTarget, dt, 190, {", "this.moveTacticalUnit(unit, contactTarget, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_COMMIT, {"),
              ("this.moveTacticalUnit(unit, pressureTarget, dt, 138, { turnRate: 2.35 });", "this.moveTacticalUnit(unit, pressureTarget, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.REAR_QUARTER, { turnRate: 2.35 });"),
              ("this.moveTacticalUnit(unit, unit.tacticTarget || intercept, dt, 62, { turnRate: 1.35 });", "this.moveTacticalUnit(unit, unit.tacticTarget || intercept, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.RAM_TELEGRAPH, { turnRate: 1.35 });"),
              ("this.moveTacticalUnit(unit, unit.tacticTarget, dt, 205, {", "this.moveTacticalUnit(unit, unit.tacticTarget, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.RAM_COMMIT, {"),
              ("this.moveTacticalUnit(unit, intercept, dt, 128, { turnRate: 2.45 });", "this.moveTacticalUnit(unit, intercept, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.ON_FOOT_INTERCEPT, { turnRate: 2.45 });")
          ]:
              replace_once(police, old, new)

          vehicle_test = "tests/vehicle-model.test.js"
          replace_once(vehicle_test,
              "  assert.ok(timeToNinetyNine >= 3.0, \"maximum speed should take several seconds to build\");\n  assert.ok(timeToNinetyNine <= 5.5, \"the arcade car should still reach its performance envelope\");\n  assert.equal(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.50, archetype.maxSpeed), 1);\n  assert.ok(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.95, archetype.maxSpeed) < 0.08);",
              "  assert.ok(timeToNinetyNine >= 2.0, \"maximum speed should still require a readable multi-gear build\");\n  assert.ok(timeToNinetyNine <= 4.0, \"upper gears must no longer make the car feel strangled\");\n  assert.equal(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.50, archetype.maxSpeed), 1);\n  assert.ok(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.95, archetype.maxSpeed) < 0.10);\n  assert.ok(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.99, archetype.maxSpeed) < 0.04);")

          Path("tests/vehicle-speed-recovery.test.js").write_text('''import test from "node:test";
import assert from "node:assert/strict";
import { VEHICLE_ARCHETYPES } from "../phaser/src/data/vehicles.js";
import { createVehicleState, stepVehicleKinematics, vehicleGearTorqueMultiplier, vehicleHighSpeedAccelerationMultiplier } from "../phaser/src/vehicles/VehicleModel.js";
import { DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER, effectiveTrafficTravelSeconds } from "../phaser/src/streaming/MacroTrafficPoliceSystem.js";
import { MOTORIZED_POLICE_LOCAL_SPEEDS } from "../phaser/src/police/MotorizedPolicePolicy.js";

function metrics(id) {
  const archetype = VEHICLE_ARCHETYPES[id];
  let state = createVehicleState({ id: `speed-${id}`, x: 0, y: 0, angle: 0, parked: true }, archetype);
  let halfSecondSpeed = 0, timeToNinety = null, timeToNinetyNine = null;
  const shifts = [];
  let previousGear = state.gear;
  for (let index = 0; index < 160; index++) {
    state = stepVehicleKinematics(state, { move: { x: 0, y: -1 } }, 0.05, archetype);
    const elapsed = (index + 1) * 0.05;
    if (index === 9) halfSecondSpeed = state.speed;
    if (state.gear > previousGear) shifts.push(elapsed);
    previousGear = state.gear;
    if (timeToNinety == null && state.speed >= archetype.maxSpeed * 0.90) timeToNinety = elapsed;
    if (timeToNinetyNine == null && state.speed >= archetype.maxSpeed * 0.99) timeToNinetyNine = elapsed;
  }
  return { halfSecondSpeed, timeToNinety, timeToNinetyNine, shifts, speed: state.speed };
}

test("driveable archetypes recover speed without instant acceleration", () => {
  assert.deepEqual(Object.fromEntries(Object.entries(VEHICLE_ARCHETYPES).map(([id, a]) => [id, a.maxSpeed])), { compact: 340, sedan: 360, van: 300, police: 400 });
  for (const id of ["compact", "sedan", "van", "police"]) {
    const a = VEHICLE_ARCHETYPES[id];
    const m = metrics(id);
    assert.ok(m.halfSecondSpeed < a.maxSpeed * 0.75);
    assert.ok(m.timeToNinety <= 1.5);
    assert.ok(m.timeToNinetyNine >= 2.4 && m.timeToNinetyNine <= 3.6);
    assert.equal(m.shifts.length, a.gearCount - 1);
    assert.ok(m.speed <= a.maxSpeed);
  }
});

test("upper gears keep useful torque and a readable final taper", () => {
  assert.ok(vehicleGearTorqueMultiplier(5, 5) >= 0.69);
  assert.equal(vehicleHighSpeedAccelerationMultiplier(0.62 * 340, 340), 1);
  assert.ok(vehicleHighSpeedAccelerationMultiplier(0.90 * 340, 340) > 0.18);
  assert.ok(vehicleHighSpeedAccelerationMultiplier(0.99 * 340, 340) < 0.04);
});

test("civilian traffic gets one shared modest cruise increase", () => {
  assert.equal(DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER, 1.12);
  assert.ok(Math.abs((1500 / effectiveTrafficTravelSeconds(10)) - 168) < 0.001);
});

test("police tactical pace remains above the quicker road cars where it must close distance", () => {
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.REAR_QUARTER > VEHICLE_ARCHETYPES.sedan.maxSpeed);
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_COMMIT > VEHICLE_ARCHETYPES.police.maxSpeed);
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_TELEGRAPH < MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_COMMIT);
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.RAM_TELEGRAPH < MOTORIZED_POLICE_LOCAL_SPEEDS.RAM_COMMIT);
});
''')

          doc = Path("docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md")
          text = doc.read_text()
          if "## Follow-up — vehicle speed recovery after gearbox retune" not in text:
              text += '''\n\n## Follow-up — vehicle speed recovery after gearbox retune\n\n**State: implemented on PR #55; pending in-game validation.**\n\nThe prior gearbox pass left fifth gear at about **58%** drive torque and began a steep acceleration taper at **58% of top speed**, matching the reported loss of pace.\n\n- Top speeds rise from **310/330/275/365** to **340/360/300/400 px/s** for compact, sedan, van and police.\n- Fifth-gear drive torque retains **70%** and the final taper begins at **62%**, while existing gear dwell and shift duration remain intact.\n- At deterministic 20 Hz, 99% top speed now arrives at about **2.5 s compact, 2.9 s sedan, 3.25 s van and 2.9 s police**, versus roughly **3.55/4.10/4.55/4.10 s** before this pass.\n- Civilian macro/local traffic uses a shared **1.12x** cruise multiplier, moving canonical 150 px/s flow to about **168 px/s** without raising density.\n- Police route response remains fast; local rear-quarter/PIT pressure rises to **390 / 315→430 px/s** so Wanted 2 can still close on faster player cars. On-foot RAM/intercept speeds stay deliberately lower for counterplay.\n- Regression coverage locks speed caps, time-to-speed, all forward gears, upper-gear torque, civilian cruise and police tactical relationships.\n\n### Acceptance\n\n- Cars feel materially faster after second gear without snapping instantly to top speed.\n- All forward gears remain perceptible.\n- Civilian traffic is livelier but retains braking/yield behavior.\n- Wanted 2 police can close on a fast sedan and PIT remains telegraphed.\n'''
              doc.write_text(text)
          PY
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Run focused speed tests
        run: node --test tests/vehicle-model.test.js tests/vehicle-speed-recovery.test.js
      - name: Commit implementation and remove temporary applicators
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/apply-vehicle-speed-recovery.yml .github/workflows/apply-traffic-visibility-lifecycle.yml .github/workflows/apply-traffic-visibility-lifecycle-v2.yml
          git add phaser/src/data/vehicles.js phaser/src/vehicles/VehicleModel.js phaser/src/streaming/MacroTrafficPoliceSystem.js phaser/src/streaming/TrafficLocalBehaviorSystem.js phaser/src/police/MotorizedPolicePolicy.js phaser/src/police/MotorizedPoliceSystem.js tests/vehicle-model.test.js tests/vehicle-speed-recovery.test.js docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md
          git commit -m "Recover vehicle speed after gearbox retune"
          git push origin HEAD:audio/playtest-p0
