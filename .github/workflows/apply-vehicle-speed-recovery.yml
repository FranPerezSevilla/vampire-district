name: Apply vehicle speed recovery

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/apply-vehicle-speed-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover vehicle pace without losing gearbox readability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          vehicles = "phaser/src/data/vehicles.js"
          for old, new in [
              ("maxSpeed: 310", "maxSpeed: 340"),
              ("maxSpeed: 330", "maxSpeed: 360"),
              ("maxSpeed: 275", "maxSpeed: 300"),
              ("maxSpeed: 365", "maxSpeed: 400"),
          ]:
              replace_once(vehicles, old, new)

          model = "phaser/src/vehicles/VehicleModel.js"
          replace_once(
              model,
              "  // Keep the launch punch, then let higher gears trade torque for a longer,\n  // readable build toward top speed instead of sprinting through the box.\n  return 1.20 - 0.62 * Math.pow(progress, 0.82);",
              "  // Lower gears keep the lively launch. Upper gears still trade torque, but not\n  // enough to make the post-shift car feel strangled: fifth retains 70% drive torque.\n  return 1.20 - 0.50 * Math.pow(progress, 0.85);"
          )
          replace_once(
              model,
              "  const taperStart = 0.58;\n  if (ratio <= taperStart) return 1;\n  const remaining = clamp((1 - ratio) / (1 - taperStart), 0, 1);\n  // Near maximum speed the car should keep gaining speed, but slowly enough\n  // that 4th/5th gear have time to exist as an audible/driving state.\n  return 0.02 + 0.98 * Math.pow(remaining, 1.5);",
              "  const taperStart = 0.62;\n  if (ratio <= taperStart) return 1;\n  const remaining = clamp((1 - ratio) / (1 - taperStart), 0, 1);\n  // Preserve a readable final pull without making the last gears feel artificially weak.\n  return 0.025 + 0.975 * Math.pow(remaining, 1.35);"
          )

          macro = "phaser/src/streaming/MacroTrafficPoliceSystem.js"
          replace_once(
              macro,
              "export const DEFAULT_MACRO_GRAPH_URL = new URL(\n  \"../../assets/city/packs/macro-graph.json\",\n  import.meta.url\n).toString();",
              "export const DEFAULT_MACRO_GRAPH_URL = new URL(\n  \"../../assets/city/packs/macro-graph.json\",\n  import.meta.url\n).toString();\n\nexport const DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER = 1.12;\n\nexport function effectiveTrafficTravelSeconds(value, multiplier = DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER) {\n  const bounded = Math.max(0.75, Math.min(1.5, finite(multiplier, DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER)));\n  return Math.max(1, finite(value, 6)) / bounded;\n}"
          )
          replace_once(
              macro,
              "    policeBudget = 4,\n    maxCatchUpTicks = 2\n  } = {}) {",
              "    policeBudget = 4,\n    maxCatchUpTicks = 2,\n    trafficSpeedMultiplier = DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER\n  } = {}) {"
          )
          replace_once(
              macro,
              "    this.maxCatchUpTicks = Math.max(1, Math.floor(finite(maxCatchUpTicks, 2)));\n    this.graph = null;",
              "    this.maxCatchUpTicks = Math.max(1, Math.floor(finite(maxCatchUpTicks, 2)));\n    this.trafficSpeedMultiplier = Math.max(0.75, Math.min(1.5, finite(\n      trafficSpeedMultiplier,\n      DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER\n    )));\n    this.graph = null;"
          )
          replace_once(
              macro,
              "      const increment = Math.max(0, finite(seconds)) / Math.max(1, finite(edge.travelSeconds, 6));",
              "      const increment = Math.max(0, finite(seconds)) / effectiveTrafficTravelSeconds(\n        edge.travelSeconds,\n        this.trafficSpeedMultiplier\n      );"
          )

          behavior = "phaser/src/streaming/TrafficLocalBehaviorSystem.js"
          replace_once(
              behavior,
              "import { LAYERS } from \"../data/district.js\";\nimport { RawAudio } from \"../systems/RawAudioSystem.js\";",
              "import { LAYERS } from \"../data/district.js\";\nimport { RawAudio } from \"../systems/RawAudioSystem.js\";\nimport { effectiveTrafficTravelSeconds } from \"./MacroTrafficPoliceSystem.js\";"
          )
          replace_once(
              behavior,
              "    const travelSeconds = Math.max(1, finite(edge?.travelSeconds, 6));",
              "    const travelSeconds = effectiveTrafficTravelSeconds(\n      edge?.travelSeconds,\n      this.materializer.macro?.trafficSpeedMultiplier ?? 1\n    );"
          )

          policy = "phaser/src/police/MotorizedPolicePolicy.js"
          replace_once(
              policy,
              "export const MOTORIZED_POLICE_TACTICS = Object.freeze({\n  ROUTE: \"route\",\n  INTERCEPT: \"intercept\",\n  RAM_TELEGRAPH: \"ram-telegraph\",\n  RAM_COMMIT: \"ram-commit\",\n  REAR_QUARTER: \"rear-quarter\",\n  PIT_TELEGRAPH: \"pit-telegraph\",\n  PIT_COMMIT: \"pit-commit\",\n  ROADBLOCK: \"roadblock\"\n});",
              "export const MOTORIZED_POLICE_TACTICS = Object.freeze({\n  ROUTE: \"route\",\n  INTERCEPT: \"intercept\",\n  RAM_TELEGRAPH: \"ram-telegraph\",\n  RAM_COMMIT: \"ram-commit\",\n  REAR_QUARTER: \"rear-quarter\",\n  PIT_TELEGRAPH: \"pit-telegraph\",\n  PIT_COMMIT: \"pit-commit\",\n  ROADBLOCK: \"roadblock\"\n});\n\nexport const MOTORIZED_POLICE_LOCAL_SPEEDS = Object.freeze({\n  PIT_TELEGRAPH: 315,\n  PIT_COMMIT: 430,\n  REAR_QUARTER: 390,\n  RAM_TELEGRAPH: 90,\n  RAM_COMMIT: 240,\n  ON_FOOT_INTERCEPT: 175\n});"
          )

          police = "phaser/src/police/MotorizedPoliceSystem.js"
          replace_once(
              police,
              "  MOTORIZED_POLICE_ROLES,\n  MOTORIZED_POLICE_TACTICS,\n  policeTacticLabel,",
              "  MOTORIZED_POLICE_ROLES,\n  MOTORIZED_POLICE_TACTICS,\n  MOTORIZED_POLICE_LOCAL_SPEEDS,\n  policeTacticLabel,"
          )
          for old, new in [
              ("this.moveTacticalUnit(unit, pressureTarget, dt, 108, { turnRate: 1.55 });", "this.moveTacticalUnit(unit, pressureTarget, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_TELEGRAPH, { turnRate: 1.55 });"),
              ("this.moveTacticalUnit(unit, contactTarget, dt, 190, {", "this.moveTacticalUnit(unit, contactTarget, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_COMMIT, {"),
              ("this.moveTacticalUnit(unit, pressureTarget, dt, 138, { turnRate: 2.35 });", "this.moveTacticalUnit(unit, pressureTarget, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.REAR_QUARTER, { turnRate: 2.35 });"),
              ("this.moveTacticalUnit(unit, unit.tacticTarget || intercept, dt, 62, { turnRate: 1.35 });", "this.moveTacticalUnit(unit, unit.tacticTarget || intercept, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.RAM_TELEGRAPH, { turnRate: 1.35 });"),
              ("this.moveTacticalUnit(unit, unit.tacticTarget, dt, 205, {", "this.moveTacticalUnit(unit, unit.tacticTarget, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.RAM_COMMIT, {"),
              ("this.moveTacticalUnit(unit, intercept, dt, 128, { turnRate: 2.45 });", "this.moveTacticalUnit(unit, intercept, dt, MOTORIZED_POLICE_LOCAL_SPEEDS.ON_FOOT_INTERCEPT, { turnRate: 2.45 });"),
          ]:
              replace_once(police, old, new)

          vehicle_test = "tests/vehicle-model.test.js"
          replace_once(
              vehicle_test,
              "  assert.ok(timeToNinetyNine >= 3.0, \"maximum speed should take several seconds to build\");\n  assert.ok(timeToNinetyNine <= 5.5, \"the arcade car should still reach its performance envelope\");\n  assert.equal(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.50, archetype.maxSpeed), 1);\n  assert.ok(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.95, archetype.maxSpeed) < 0.08);",
              "  assert.ok(timeToNinetyNine >= 2.0, \"maximum speed should still require a readable multi-gear build\");\n  assert.ok(timeToNinetyNine <= 4.0, \"upper gears must no longer make the car feel strangled\");\n  assert.equal(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.50, archetype.maxSpeed), 1);\n  assert.ok(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.95, archetype.maxSpeed) < 0.10);\n  assert.ok(vehicleHighSpeedAccelerationMultiplier(archetype.maxSpeed * 0.99, archetype.maxSpeed) < 0.04);"
          )

          Path("tests/vehicle-speed-recovery.test.js").write_text('''import test from "node:test";
import assert from "node:assert/strict";

import { VEHICLE_ARCHETYPES } from "../phaser/src/data/vehicles.js";
import {
  createVehicleState,
  stepVehicleKinematics,
  vehicleGearTorqueMultiplier,
  vehicleHighSpeedAccelerationMultiplier
} from "../phaser/src/vehicles/VehicleModel.js";
import {
  DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER,
  effectiveTrafficTravelSeconds
} from "../phaser/src/streaming/MacroTrafficPoliceSystem.js";
import { MOTORIZED_POLICE_LOCAL_SPEEDS } from "../phaser/src/police/MotorizedPolicePolicy.js";

const definitions = Object.fromEntries(Object.keys(VEHICLE_ARCHETYPES).map(id => [id, {
  id: `speed-${id}`,
  x: 0,
  y: 0,
  angle: 0,
  parked: true
}]));

function accelerationMetrics(id, dt = 0.05, duration = 8) {
  const archetype = VEHICLE_ARCHETYPES[id];
  let state = createVehicleState(definitions[id], archetype);
  let halfSecondSpeed = 0;
  let timeToNinety = null;
  let timeToNinetyNine = null;
  const shifts = [];
  let previousGear = state.gear;
  for (let index = 0; index < Math.ceil(duration / dt); index++) {
    state = stepVehicleKinematics(state, { move: { x: 0, y: -1 } }, dt, archetype);
    const elapsed = (index + 1) * dt;
    if (index === Math.round(0.5 / dt) - 1) halfSecondSpeed = state.speed;
    if (state.gear > previousGear) shifts.push(elapsed);
    previousGear = state.gear;
    if (timeToNinety == null && state.speed >= archetype.maxSpeed * 0.90) timeToNinety = elapsed;
    if (timeToNinetyNine == null && state.speed >= archetype.maxSpeed * 0.99) timeToNinetyNine = elapsed;
  }
  return { halfSecondSpeed, timeToNinety, timeToNinetyNine, shifts, speed: state.speed };
}

test("driveable archetypes recover higher top speed without instant acceleration", () => {
  assert.deepEqual(
    Object.fromEntries(Object.entries(VEHICLE_ARCHETYPES).map(([id, archetype]) => [id, archetype.maxSpeed])),
    { compact: 340, sedan: 360, van: 300, police: 400 }
  );

  for (const id of ["compact", "sedan", "van", "police"]) {
    const archetype = VEHICLE_ARCHETYPES[id];
    const metrics = accelerationMetrics(id);
    assert.ok(metrics.halfSecondSpeed < archetype.maxSpeed * 0.75, `${id} must not snap to top speed at launch`);
    assert.ok(metrics.timeToNinety <= 1.5, `${id} should enter its fast envelope promptly`);
    assert.ok(metrics.timeToNinetyNine >= 2.4, `${id} should retain a readable multi-gear build`);
    assert.ok(metrics.timeToNinetyNine <= 3.6, `${id} should no longer crawl through upper gears`);
    assert.equal(metrics.shifts.length, archetype.gearCount - 1, `${id} should still visit every forward gear`);
    assert.ok(metrics.speed <= archetype.maxSpeed);
  }
});

test("upper gear torque and high-speed taper keep useful drive after the gearbox retune", () => {
  assert.ok(vehicleGearTorqueMultiplier(5, 5) >= 0.69);
  assert.equal(vehicleHighSpeedAccelerationMultiplier(0.62 * 340, 340), 1);
  assert.ok(vehicleHighSpeedAccelerationMultiplier(0.90 * 340, 340) > 0.18);
  assert.ok(vehicleHighSpeedAccelerationMultiplier(0.99 * 340, 340) < 0.04);
});

test("civilian traffic gets a modest systemic cruise-speed increase", () => {
  assert.equal(DEFAULT_CIVILIAN_TRAFFIC_SPEED_MULTIPLIER, 1.12);
  const baselineTravel = 10;
  const boostedTravel = effectiveTrafficTravelSeconds(baselineTravel);
  assert.ok(boostedTravel < baselineTravel);
  assert.ok(Math.abs((1500 / boostedTravel) - 168) < 0.001);
});

test("local police tactics remain fast enough to pressure the quicker player cars", () => {
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.REAR_QUARTER > VEHICLE_ARCHETYPES.sedan.maxSpeed);
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_COMMIT > VEHICLE_ARCHETYPES.police.maxSpeed);
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_TELEGRAPH < MOTORIZED_POLICE_LOCAL_SPEEDS.PIT_COMMIT);
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.RAM_TELEGRAPH < MOTORIZED_POLICE_LOCAL_SPEEDS.RAM_COMMIT);
  assert.ok(MOTORIZED_POLICE_LOCAL_SPEEDS.ON_FOOT_INTERCEPT < VEHICLE_ARCHETYPES.compact.maxSpeed);
});
''')

          doc = Path("docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md")
          text = doc.read_text()
          heading = "## Follow-up — vehicle speed recovery after gearbox retune"
          if heading in text:
              raise SystemExit("vehicle speed recovery section already present")
          text += '''\n\n## Follow-up — vehicle speed recovery after gearbox retune\n\n**State: implemented on PR #55; pending in-game validation.**\n\nThe previous gearbox listening pass correctly created audible dwell, but it also cut fifth-gear torque to about **58%** and began a steep acceleration taper at **58% of top speed**. That combination explains the reported loss of pace even though the nominal speed caps had not changed.\n\n- Driveable top speeds rise from **310/330/275/365** to **340/360/300/400 px/s** for compact, sedan, van and police respectively (roughly +9–10%).\n- Fifth-gear drive torque now retains **70%** instead of 58%, while the high-speed taper starts at **62%** and falls less aggressively. Gear dwell, shift durations and the launch character are preserved.\n- Deterministic 20 Hz acceleration benchmarks now put 99% top speed at about **2.5 s compact, 2.9 s sedan, 3.25 s van and 2.9 s police**, versus roughly **3.55/4.10/4.55/4.10 s** before this recovery pass.\n- Civilian macro/local traffic uses one shared **1.12×** cruise multiplier, moving the canonical 150 px/s road flow to about **168 px/s** without changing traffic density or braking/yield behavior.\n- Motorized police route response was already around 398–420 px/s at Wanted 2–3, so route speed stays intact. Local pursuit was the real mismatch: rear-quarter pressure is now **390 px/s**, PIT telegraph/commit **315/430**, while on-foot intercept/RAM values remain lower and readable.\n- New regression coverage measures top speed, time-to-speed, gear count, upper-gear torque, civilian cruise scaling and police tactical speed relationships.\n\n### Acceptance\n\n- Player cars feel materially faster after second gear without returning to instant top speed.\n- Every forward gear remains perceptible and no archetype skips the gearbox.\n- Civilian traffic is livelier but still brakes/yields before collisions.\n- Wanted 2 police can actually close on a fast sedan; PIT remains telegraphed before the higher-speed commit.\n- Police remain faster than ordinary traffic without making on-foot RAM attacks unreadable.\n'''
          doc.write_text(text)
          PY

      - name: Install exact test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run focused vehicle speed regression
        run: node --test tests/vehicle-model.test.js tests/vehicle-speed-recovery.test.js tests/city-streaming-4d.test.js tests/motorized-police.test.js tests/police-vehicle-tactics.test.js

      - name: Record full unit-suite state
        shell: bash
        run: |
          set +e
          npm test > /tmp/unit-test.log 2>&1
          code=$?
          tail -n 30 /tmp/unit-test.log
          echo "full_suite_exit=$code" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Commit speed recovery and remove applicators
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/apply-vehicle-speed-recovery.yml \
            .github/workflows/apply-traffic-visibility-lifecycle.yml \
            .github/workflows/apply-traffic-visibility-lifecycle-v2.yml
          git add phaser/src/data/vehicles.js \
            phaser/src/vehicles/VehicleModel.js \
            phaser/src/streaming/MacroTrafficPoliceSystem.js \
            phaser/src/streaming/TrafficLocalBehaviorSystem.js \
            phaser/src/police/MotorizedPolicePolicy.js \
            phaser/src/police/MotorizedPoliceSystem.js \
            tests/vehicle-model.test.js \
            tests/vehicle-speed-recovery.test.js \
            docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md
          git commit -m "Recover vehicle speed after gearbox retune"
          git push origin HEAD:audio/playtest-p0
