name: Diagnose faction territory patch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct validated payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/territory-payload.b64 \
            .github/territory-payload.part-01 \
            .github/territory-payload.part-02 \
            > /tmp/territory.b64
          echo '9444f62f96d9dd6f65c08e672aca24589cd41adb2f43cb05c49b94ea0869d1de  /tmp/territory.b64' | sha256sum -c -
          base64 -d /tmp/territory.b64 | gzip -dc > /tmp/territory.patch
          echo '883193f385c3a8c181aae641a7c1017ca37f5243f0d26a2835dae0c07419802e  /tmp/territory.patch' | sha256sum -c -

      - name: Capture git apply diagnostics
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git apply --check --verbose /tmp/territory.patch 2>&1 | tee /tmp/territory-apply.log

      - name: Upload apply diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: territory-apply-diagnostics
          path: /tmp/territory-apply.log
          if-no-files-found: error
          retention-days: 2

      - name: Report result
        run: |
          echo "git apply outcome: ${{ steps.apply.outcome }}"
