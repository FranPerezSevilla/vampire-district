name: Apply faction territory foundation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Detect pending territory payload
        id: gate
        shell: bash
        run: |
          if [ -f .github/territory-payload.b64 ] \
            && [ -f .github/territory-payload.part-01 ] \
            && [ -f .github/territory-payload.part-02 ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Territory implementation payload already consumed.'
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply territory patch
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-territory-source-snapshot.yml
          cp "$workflow" /tmp/territory-workflow.yml
          rm -f "$workflow"
          cat \
            .github/territory-payload.b64 \
            .github/territory-payload.part-01 \
            .github/territory-payload.part-02 \
            | base64 -d | gzip -dc > /tmp/territory.patch
          git apply /tmp/territory.patch
          rm -f \
            .github/territory-payload.b64 \
            .github/territory-payload.part-01 \
            .github/territory-payload.part-02

      - name: Install exact dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run unit regression
        if: steps.gate.outputs.apply == 'true'
        run: node --test tests/*.test.js

      - name: Validate city topology
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:validate

      - name: Compile current city
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:compile -- --output-dir=/tmp/viceblood-territory-city

      - name: Compile Foundry candidates
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:foundry -- --output-dir=/tmp/viceblood-territory-foundry

      - name: Verify patch quality
        if: steps.gate.outputs.apply == 'true'
        run: git diff --check

      - name: Publish faction territory implementation
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-territory-source-snapshot.yml
          mkdir -p .github/workflows
          mv /tmp/territory-workflow.yml "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement faction territory foundation'
          git push origin "HEAD:${TARGET_BRANCH}"
