name: Apply faction territory foundation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Detect pending territory payload
        id: gate
        shell: bash
        run: |
          if [ -f .github/territory-payload.b64 ] \
            && [ -f .github/territory-payload.part-01 ] \
            && [ -f .github/territory-payload.part-02 ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Territory implementation payload already consumed.'
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble and verify Base64 payload
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/territory-payload.b64 \
            .github/territory-payload.part-01 \
            .github/territory-payload.part-02 \
            > /tmp/territory.b64
          test "$(wc -c < /tmp/territory.b64)" = '20424'
          echo '9444f62f96d9dd6f65c08e672aca24589cd41adb2f43cb05c49b94ea0869d1de  /tmp/territory.b64' | sha256sum -c -

      - name: Decode and verify gzip payload
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/territory.b64 > /tmp/territory.patch.gz
          test "$(wc -c < /tmp/territory.patch.gz)" = '15318'
          echo '1d486722ee98a65976a2cf9068db564fde4aa2f59189ddea0d77c6a33622afaf  /tmp/territory.patch.gz' | sha256sum -c -
          gzip -t /tmp/territory.patch.gz

      - name: Expand and verify territory patch
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc /tmp/territory.patch.gz > /tmp/territory.patch
          test "$(wc -c < /tmp/territory.patch)" = '58203'
          echo '883193f385c3a8c181aae641a7c1017ca37f5243f0d26a2835dae0c07419802e  /tmp/territory.patch' | sha256sum -c -

      - name: Apply territory patch
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-territory-source-snapshot.yml
          cp "$workflow" /tmp/territory-workflow.yml
          rm -f "$workflow"
          git apply --check /tmp/territory.patch
          git apply /tmp/territory.patch
          rm -f \
            .github/territory-payload.b64 \
            .github/territory-payload.part-01 \
            .github/territory-payload.part-02

      - name: Install exact dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run unit regression
        if: steps.gate.outputs.apply == 'true'
        run: node --test tests/*.test.js

      - name: Validate city topology
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:validate

      - name: Compile current city
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:compile -- --output-dir=/tmp/viceblood-territory-city

      - name: Compile Foundry candidates
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:foundry -- --output-dir=/tmp/viceblood-territory-foundry

      - name: Verify patch quality
        if: steps.gate.outputs.apply == 'true'
        run: git diff --check

      - name: Publish validated territory tree
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-territory-source-snapshot.yml
          mkdir -p .github/workflows
          mv /tmp/territory-workflow.yml "$workflow"

          python <<'PY'
          import base64
          import json
          import os
          import stat
          import subprocess
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["TARGET_BRANCH"]

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def paths_from_git(*args):
              raw = subprocess.check_output(args)
              return [item.decode() for item in raw.split(b"\0") if item]

          def request(method, path, payload):
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent = command("git", "rev-parse", "HEAD")
          base_tree = command("git", "rev-parse", "HEAD^{tree}")
          changed = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=ACMRTUXB", "HEAD"
          )
          changed += paths_from_git("git", "ls-files", "--others", "--exclude-standard", "-z")
          deleted = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=D", "HEAD"
          )

          entries = []
          for path in sorted(set(changed)):
              with open(path, "rb") as source:
                  content = base64.b64encode(source.read()).decode("ascii")
              blob = request("POST", "/git/blobs", {"content": content, "encoding": "base64"})
              mode = "100755" if os.stat(path).st_mode & stat.S_IXUSR else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          for path in sorted(set(deleted)):
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})

          tree = request("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Implement faction territory foundation",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          ref = urllib.parse.quote(f"heads/{branch}", safe="/")
          request("PATCH", f"/git/refs/{ref}", {"sha": commit["sha"], "force": False})
          print(f"Published territory commit {commit['sha']}")
          PY
