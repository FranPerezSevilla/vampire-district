name: Apply pedestrian performance pass 1b

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/apply-performance-pass-1b.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply performance increment
        run: python .github/scripts/apply-performance-pass-1.py
      - name: Run focused pedestrian regressions
        run: node --test tests/pedestrian-collision.test.js tests/pedestrian-route-expansion.test.js tests/entity-streaming.test.js tests/pedestrian-performance.test.js
      - name: Commit performance increment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/src/systems/PedestrianSystem.js tests/pedestrian-performance.test.js docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md
          git commit -m "Optimize pedestrian crowd broadphase"
          git push origin HEAD:audio/playtest-p0