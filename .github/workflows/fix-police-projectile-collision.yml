name: Fix motorized police projectile collision

on:
  push:
    branches:
      - audio/playtest-p0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - name: Complete police cruiser collision authority
        shell: bash
        run: |
          cat > /tmp/fix_police_projectile.py.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/fix_police_projectile.py.gz.b64 | gzip -d > /tmp/fix_police_projectile.py
          python3 /tmp/fix_police_projectile.py

      - name: Run focused projectile tests
        run: |
          node --test \
            tests/ballistic-projectile.test.js \
            tests/bullet-hit-world-audio.test.js \
            tests/combat.test.js \
            tests/motorized-police.test.js

      - name: Commit correction
        shell: bash
        run: |
          rm .github/workflows/fix-police-projectile-collision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            phaser/src/combat/CombatSystem.js \
            phaser/src/police/MotorizedPoliceSystem.js \
            tests/ballistic-projectile.test.js \
            docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md \
            .github/workflows/fix-police-projectile-collision.yml
          git commit -m "Complete police cruiser bullet collision"
          git push origin HEAD:audio/playtest-p0
