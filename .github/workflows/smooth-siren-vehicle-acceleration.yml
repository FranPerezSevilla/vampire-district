name: Smooth siren and stretch vehicle acceleration

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/smooth-siren-vehicle-acceleration.yml
      - tools/_tmp-smooth-siren-vehicle-acceleration.py

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Repair siren loop and stretch acceleration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_tmp-smooth-siren-vehicle-acceleration.py

      - name: Remove one-off helpers
        shell: bash
        run: |
          set -euo pipefail
          rm tools/_tmp-smooth-siren-vehicle-acceleration.py
          rm .github/workflows/smooth-siren-vehicle-acceleration.yml

      - name: Validate focused police audio and vehicle behavior
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 phaser/assets/audio/police/police-siren-loop-01.wav
          node --test \
            tests/vehicle-model.test.js \
            tests/vehicle-engine-audio.test.js \
            tests/vehicle-gears-camera.test.js \
            tests/audio-sample-catalog.test.js \
            tests/motorized-police.test.js
          git diff --check
          npm run check:affected:plan -- --base=origin/main

      - name: Commit tuning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Smooth police siren loop and stretch vehicle acceleration"
          git push
