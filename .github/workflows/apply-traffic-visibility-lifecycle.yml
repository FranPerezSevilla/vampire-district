name: Apply traffic visibility lifecycle

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/apply-traffic-visibility-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded traffic lifecycle change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "phaser/src/streaming/TrafficMaterializationSystem.js",
              "const SPAWN_CAMERA_MARGIN = 54;",
              "const SPAWN_CAMERA_MARGIN = 120;"
          )

          behavior = "phaser/src/streaming/TrafficLocalBehaviorSystem.js"
          replace_once(
              behavior,
              "        authorityTravel: wrapPhase(token.phase),\n        visualTravel: wrapPhase(token.phase),\n        speedFactor: 1,",
              "        authorityTravel: wrapPhase(token.phase),\n        visualTravel: wrapPhase(token.phase),\n        localPassEnd: 1,\n        completedLocalPass: false,\n        speedFactor: 1,"
          )
          replace_once(
              behavior,
              "  decisionFor(slot, state, token, active) {\n    const lane = this.laneFor(state);",
              "  decisionFor(slot, state, token, active) {\n    if (state.completedLocalPass) {\n      return {\n        desiredSpeedFactor: 0,\n        reason: \"lane-end\",\n        gap: null,\n        blockerId: null,\n        junctionId: null,\n        lane: this.laneFor(state)\n      };\n    }\n    const lane = this.laneFor(state);"
          )
          replace_once(
              behavior,
              "    const available = Math.max(0, state.authorityTravel - state.visualTravel);\n    const advance = Math.min(available, seconds / travelSeconds * Math.max(0, state.speedFactor));",
              "    const available = Math.max(0, state.authorityTravel - state.visualTravel);\n    const remainingLocalPass = Math.max(0, finite(state.localPassEnd, 1) - state.visualTravel);\n    const advance = Math.min(\n      available,\n      seconds / travelSeconds * Math.max(0, state.speedFactor),\n      remainingLocalPass\n    );"
          )
          replace_once(
              behavior,
              "    state.visualTravel += advance;\n    state.lag = Math.max(0, state.authorityTravel - state.visualTravel);\n\n    const visualPhase = wrapPhase(state.visualTravel);",
              "    state.visualTravel += advance;\n    state.completedLocalPass = state.visualTravel >= finite(state.localPassEnd, 1) - 0.0005;\n    if (state.completedLocalPass) {\n      state.visualTravel = finite(state.localPassEnd, 1);\n      state.desiredSpeedFactor = 0;\n      state.speedFactor = moveToward(state.speedFactor, 0, this.brakingRate * seconds);\n      state.reason = \"lane-end\";\n      state.gap = null;\n      state.blockerId = null;\n      state.junctionId = null;\n    }\n    state.lag = Math.max(0, state.authorityTravel - state.visualTravel);\n\n    const visualPhase = state.completedLocalPass ? 1 : wrapPhase(state.visualTravel);"
          )
          replace_once(
              behavior,
              "    const decisions = active.map(item => ({ ...item, decision: this.decisionFor(item.slot, item.state, item.token, active) }));\n    for (const item of decisions) this.applyDecision(item.slot, item.state, item.token, item.decision, dt);\n    this.publish(force);",
              "    const decisions = active.map(item => ({ ...item, decision: this.decisionFor(item.slot, item.state, item.token, active) }));\n    for (const item of decisions) {\n      this.applyDecision(item.slot, item.state, item.token, item.decision, dt);\n      if (!item.state.completedLocalPass) continue;\n      if (!this.materializer.release(item.slot)) continue;\n      this.states.delete(item.state.tokenId);\n      RawAudio.stopVehicleEngine(`traffic:${item.state.tokenId}`);\n    }\n    this.publish(force);"
          )
          replace_once(
              behavior,
              "        phase: round(wrapPhase(state.visualTravel)),\n        authoritativePhase: round(state.lastAuthorityPhase),",
              "        phase: state.completedLocalPass ? 1 : round(wrapPhase(state.visualTravel)),\n        completedLocalPass: Boolean(state.completedLocalPass),\n        authoritativePhase: round(state.lastAuthorityPhase),"
          )

          test_path = Path("tests/city-streaming-4d.test.js")
          test_text = test_path.read_text()
          anchor = 'test("rear local traffic brakes for a same-lane lead and accelerates when the gap clears", async () => {'
          if test_text.count(anchor) != 1:
              raise SystemExit("city-streaming-4d test anchor missing or duplicated")
          new_test = (
              'test("local traffic reaches the lane endpoint before pooled reuse instead of visibly wrapping", async () => {\n'
              '  const flows = {\n'
              '    "west:east": { edgeId: "west:east", tokenCount: 1, phases: [0.96], completedTrips: 0 }\n'
              '  };\n'
              '  const scene = fakeScene({ graph: singleEdgeGraph(), flows });\n'
              '  const installed = await install(scene, singleEdgeLanes());\n'
              '  const { materializer, behavior } = installed;\n'
              '  const initial = materializer.snapshot().materialized[0];\n'
              '  const slot = materializer.pool[initial.slotIndex];\n\n'
              '  assert.ok(initial.x > 940);\n'
              '  assert.ok(materializer.snapshot().spawnCameraMargin >= 120);\n\n'
              '  flows["west:east"].phases[0] = 0.02;\n'
              '  behavior.update(1, { force: true });\n\n'
              '  assert.equal(materializer.assignments.has("west:east#0"), false);\n'
              '  assert.equal(behavior.states.has("west:east#0"), false);\n'
              '  assert.equal(slot.container.active, false);\n'
              '  assert.equal(Math.round(slot.x), 1000);\n'
              '  assert.equal(Math.round(slot.container.x), 1000);\n\n'
              '  materializer.reconcile(true);\n'
              '  const reused = materializer.snapshot().materialized[0];\n'
              '  assert.equal(reused.slotIndex, initial.slotIndex);\n'
              '  assert.equal(reused.tokenId, "west:east#0");\n'
              '  assert.ok(reused.x < 40);\n'
              '  destroyInstalled(installed);\n'
              '});\n\n'
          )
          test_path.write_text(test_text.replace(anchor, new_test + anchor, 1))

          replace_once(
              "docs/CITY_STREAMING_4D.md",
              "Macro phases are modulo-one values. The local system converts consecutive phases into monotonic travel values so a normal phase wrap from `0.99` to `0.01` remains forward movement.",
              "Macro phases are modulo-one values. The local system converts consecutive phases into monotonic travel values so a normal phase wrap from `0.99` to `0.01` remains forward authority movement. A single materialized proxy is nevertheless bounded to one visible lane pass: when it reaches the endpoint it requests retirement there, and the viewport-retention policy defers that retirement until the car is off-screen. Only then may the fixed pool reuse the slot for the token's wrapped start position. This prevents an on-screen endpoint-to-start teleport while preserving the macro traffic authority."
          )

          tracker = Path("docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md")
          tracker_text = tracker.read_text()
          if "## Follow-up — civilian traffic visibility lifecycle" in tracker_text:
              raise SystemExit("tracker section already exists")
          section = (
              "\n\n## Follow-up — civilian traffic visibility lifecycle\n\n"
              "**State: implemented on PR #55; pending in-game validation.**\n\n"
              "- The off-camera materialization guard grows from **54 px to 120 px**, matching the existing viewport guard so normal camera movement cannot reveal a freshly assigned pooled car at the screen edge.\n"
              "- A local traffic proxy now owns exactly one visible pass across its current lane. When macro phase wraps, the local car reaches the lane endpoint instead of teleporting spatially back to the lane start.\n"
              "- At the endpoint the proxy requests retirement. Existing viewport retention keeps it present while still visible; once it is safely off-screen the assignment is released and its fixed pool slot can be reused for the wrapped macro token.\n"
              "- Macro traffic quantity/progress remains authoritative and the local pool remains fixed. No new campaign vehicle, persistence or traffic-density authority is introduced.\n\n"
              "### Acceptance\n\n"
              "- Civilian cars never materialize inside the viewport or its **120 px** guard band.\n"
              "- A car approaching the end of a local lane never jumps visibly to the lane start.\n"
              "- A visible endpoint car is retained until it leaves the viewport guard, then disappears off-screen and its slot is reusable.\n"
              "- Pool size and macro traffic token count remain unchanged.\n"
              "- The next ordered increment is accidental civilian-car collision with the on-foot player: brake first, but a real fortuitous impact may push and damage Vitality.\n"
          )
          tracker.write_text(tracker_text.rstrip() + section + "\n")
          PY

      - name: Install exact dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run focused traffic regression
        run: node --test tests/city-streaming-4d.test.js

      - name: Run fast unit safety net and verify the known failure budget did not grow
        shell: bash
        run: |
          set +e
          npm run check:fast > /tmp/fast.log 2>&1
          status=$?
          set -e
          cat /tmp/fast.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -Eq '# fail 9$' /tmp/fast.log

      - name: Show affected test plan
        run: npm run check:affected:plan -- --base=origin/main

      - name: Commit bounded increment and remove applicator
        shell: bash
        run: |
          git config user.name "ViceBlood automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-traffic-visibility-lifecycle.yml
          git add phaser/src/streaming/TrafficMaterializationSystem.js phaser/src/streaming/TrafficLocalBehaviorSystem.js tests/city-streaming-4d.test.js docs/CITY_STREAMING_4D.md docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md
          git commit -m "Prevent visible civilian traffic wrap pops"
          git push origin HEAD:audio/playtest-p0
