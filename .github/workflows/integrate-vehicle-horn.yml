name: Integrate vehicle horn audio

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - ".github/workflows/integrate-vehicle-horn.yml"
      - ".github/audio-staging/horn/**"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Materialize and wire vehicle horn
        run: |
          set -euo pipefail
          python .github/audio-staging/horn/integrate.py

      - name: Run focused horn and input tests
        run: |
          set -euo pipefail
          node --test \
            tests/vehicle-horn-audio.test.js \
            tests/input-actions.test.js \
            tests/input-system.test.js \
            tests/audio-sample-catalog.test.js

      - name: Remove one-off staging
        run: |
          set -euo pipefail
          rm -rf .github/audio-staging/horn
          rm -f .github/workflows/integrate-vehicle-horn.yml

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate real vehicle horn audio"
          git push
