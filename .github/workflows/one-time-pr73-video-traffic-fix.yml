        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run focused traffic regressions
        run: >-
          node --test
          tests/traffic-junction-flow-policy.test.js
          tests/traffic-junction-runtime-integration.test.js
          tests/traffic-junction-video-regression.test.js
          tests/traffic-multi-agent-route-runtime.test.js

