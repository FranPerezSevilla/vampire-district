name: One-time PR73 video traffic regression fix

on:
  push:
    branches:
      - codex/traffic-junction-topology
    paths:
      - .github/workflows/one-time-pr73-video-traffic-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR 73 branch
        uses: actions/checkout@v4
        with:
          ref: codex/traffic-junction-topology
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply junction, physical-contact and runtime patches
        run: |
          python tools/dev/one-time-pr73-junction-patch.py
          python tools/dev/one-time-pr73-physical-patch.py
          python tools/dev/one-time-pr73-behavior-runtime-patch.py

      - name: Install exact test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run focused video regressions
        run: >-
          node --test
          tests/traffic-junction-flow-policy.test.js
          tests/traffic-junction-runtime-integration.test.js
          tests/traffic-junction-video-regression.test.js
          tests/traffic-multi-agent-route-runtime.test.js

      - name: Hide temporary workflow infrastructure during the unit suite
        run: |
          rm .github/workflows/one-time-pr73-video-traffic-fix.yml
          rm .github/workflows/one-time-repair-pr73-workflow.yml

      - name: Run complete unit suite
        run: npm run test:unit

      - name: Restore temporary workflow infrastructure before committing source
        run: |
          git checkout -- .github/workflows/one-time-pr73-video-traffic-fix.yml
          git checkout -- .github/workflows/one-time-repair-pr73-workflow.yml

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit repaired production behavior
        shell: bash
        run: |
          rm \
            tools/dev/one-time-pr73-junction-patch.py \
            tools/dev/one-time-pr73-physical-patch.py \
            tools/dev/one-time-pr73-behavior-runtime-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            phaser/src/runtime/GameplayRuntime.js \
            phaser/src/streaming/TrafficJunctionFlowPolicy.js \
            phaser/src/streaming/TrafficPhysicalConsequencesSystem.js \
            phaser/src/streaming/TrafficRouteBehaviorPolicy.js \
            tools/dev/one-time-pr73-junction-patch.py \
            tools/dev/one-time-pr73-physical-patch.py \
            tools/dev/one-time-pr73-behavior-runtime-patch.py
          git commit -m "fix: keep compiler routes behind physical junction occupancy"
          git push origin HEAD:codex/traffic-junction-topology
