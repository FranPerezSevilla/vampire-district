name: One-time PR73 video traffic regression fix

on:
  push:
    branches:
      - codex/traffic-junction-topology
    paths:
      - .github/workflows/one-time-pr73-video-traffic-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR 73 branch
        uses: actions/checkout@v4
        with:
          ref: codex/traffic-junction-topology
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply production traffic fix and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch point, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          junction = Path("phaser/src/streaming/TrafficJunctionFlowPolicy.js")

          replace_once(
              junction,
              '''  return best;
          }

          function safeConnectorForTransition(topology, transition) {''',
              '''  return best;
          }

          function pointSegmentDistance(point, from, to) {
            const ax = finite(from?.x);
            const ay = finite(from?.y);
            const dx = finite(to?.x) - ax;
            const dy = finite(to?.y) - ay;
            const lengthSquared = dx * dx + dy * dy;
            if (lengthSquared <= EPSILON) return distance(point, from);
            const local = clamp(
              ((finite(point?.x) - ax) * dx + (finite(point?.y) - ay) * dy) / lengthSquared,
              0,
              1
            );
            return Math.hypot(
              finite(point?.x) - (ax + dx * local),
              finite(point?.y) - (ay + dy * local)
            );
          }

          function segmentOrientation(a, b, c) {
            return (finite(b?.x) - finite(a?.x)) * (finite(c?.y) - finite(a?.y))
              - (finite(b?.y) - finite(a?.y)) * (finite(c?.x) - finite(a?.x));
          }

          function pointOnSegment(point, from, to) {
            return finite(point?.x) >= Math.min(finite(from?.x), finite(to?.x)) - EPSILON
              && finite(point?.x) <= Math.max(finite(from?.x), finite(to?.x)) + EPSILON
              && finite(point?.y) >= Math.min(finite(from?.y), finite(to?.y)) - EPSILON
              && finite(point?.y) <= Math.max(finite(from?.y), finite(to?.y)) + EPSILON;
          }

          function segmentsIntersect(aFrom, aTo, bFrom, bTo) {
            const o1 = segmentOrientation(aFrom, aTo, bFrom);
            const o2 = segmentOrientation(aFrom, aTo, bTo);
            const o3 = segmentOrientation(bFrom, bTo, aFrom);
            const o4 = segmentOrientation(bFrom, bTo, aTo);
            if (((o1 > EPSILON && o2 < -EPSILON) || (o1 < -EPSILON && o2 > EPSILON))
              && ((o3 > EPSILON && o4 < -EPSILON) || (o3 < -EPSILON && o4 > EPSILON))) {
              return true;
            }
            if (Math.abs(o1) <= EPSILON && pointOnSegment(bFrom, aFrom, aTo)) return true;
            if (Math.abs(o2) <= EPSILON && pointOnSegment(bTo, aFrom, aTo)) return true;
            if (Math.abs(o3) <= EPSILON && pointOnSegment(aFrom, bFrom, bTo)) return true;
            if (Math.abs(o4) <= EPSILON && pointOnSegment(aTo, bFrom, bTo)) return true;
            return false;
          }

          function segmentDistance(aFrom, aTo, bFrom, bTo) {
            if (segmentsIntersect(aFrom, aTo, bFrom, bTo)) return 0;
            return Math.min(
              pointSegmentDistance(aFrom, bFrom, bTo),
              pointSegmentDistance(aTo, bFrom, bTo),
              pointSegmentDistance(bFrom, aFrom, aTo),
              pointSegmentDistance(bTo, aFrom, aTo)
            );
          }

          function polylineDistance(leftPoints, rightPoints) {
            const left = polylineMetrics(leftPoints);
            const right = polylineMetrics(rightPoints);
            if (!left.segments.length || !right.segments.length) return Number.POSITIVE_INFINITY;
            let best = Number.POSITIVE_INFINITY;
            for (const leftSegment of left.segments) {
              for (const rightSegment of right.segments) {
                best = Math.min(
                  best,
                  segmentDistance(
                    leftSegment.from,
                    leftSegment.to,
                    rightSegment.from,
                    rightSegment.to
                  )
                );
                if (best <= EPSILON) return 0;
              }
            }
            return best;
          }

          function polylinePrefix(points, requestedLength) {
            const metrics = polylineMetrics(points);
            if (!metrics.points.length) return [];
            if (!metrics.segments.length) return [metrics.points[0]];
            const limit = clamp(requestedLength, 0, metrics.length);
            const prefix = [metrics.points[0]];
            for (const segment of metrics.segments) {
              const available = limit - segment.startDistance;
              if (available <= EPSILON) break;
              if (available + EPSILON >= segment.length) {
                prefix.push(segment.to);
                continue;
              }
              const local = clamp(available / segment.length, 0, 1);
              prefix.push({
                x: finite(segment.from?.x) + segment.dx * local,
                y: finite(segment.from?.y) + segment.dy * local
              });
              break;
            }
            return prefix;
          }

          function safeConnectorForTransition(topology, transition) {'''
          )

          replace_once(
              junction,
              '''  minimumSeedSpacing = 34,
            permitCorridorMargin = 8
          } = {}) {''',
              '''  minimumSeedSpacing = 34,
            permitCorridorMargin = 8,
            movementConflictMargin = 3
          } = {}) {'''
          )

          replace_once(
              junction,
              '''  let approachQueueDenials = 0;
            let occupiedDenials = 0;
            let exitBlockedDenials = 0;''',
              '''  let approachQueueDenials = 0;
            let occupiedDenials = 0;
            let movementPermitDenials = 0;
            let exitBlockedDenials = 0;'''
          )

          replace_once(
              junction,
              '''  function approachFor(agent) {
              return trafficJunctionApproach(topology, agent, slotFor(agent?.tokenId), {
                stopMargin,
                minimumStopDistance,
                maximumStopDistance,
                exitMargin,
                minimumExitClearance,
                conflictMargin
              });
            }

            function queueFor(junctionId) {''',
              '''  function approachFor(agent) {
              return trafficJunctionApproach(topology, agent, slotFor(agent?.tokenId), {
                stopMargin,
                minimumStopDistance,
                maximumStopDistance,
                exitMargin,
                minimumExitClearance,
                conflictMargin
              });
            }

            function appendPathPoints(target, points) {
              for (const point of points || []) {
                if (!point) continue;
                const previous = target[target.length - 1];
                if (previous && distance(previous, point) <= EPSILON) continue;
                target.push({ x: finite(point.x), y: finite(point.y) });
              }
              return target;
            }

            function movementPathFor(approach) {
              if (!approach) return [];
              const connector = topology.junctionConnectors.connectors?.[approach.connectorId];
              const outgoing = topology.lanes?.[approach.outgoingLaneId];
              const path = [];
              appendPathPoints(path, [approach.stopPoint]);
              appendPathPoints(path, connector?.points);
              appendPathPoints(
                path,
                polylinePrefix(
                  outgoing?.points,
                  Math.max(0, finite(approach.exitClearanceDistance) + finite(approach.halfLength))
                )
              );
              return path;
            }

            function conflictingPermit(approach, requesterTokenId) {
              const requesterPath = movementPathFor(approach);
              if (requesterPath.length < 2) return null;
              const candidates = [...permits.values()]
                .filter(permit => String(permit.tokenId) !== String(requesterTokenId))
                .sort((left, right) => String(left.tokenId).localeCompare(String(right.tokenId)));
              for (const permit of candidates) {
                const permitPath = movementPathFor(permit);
                if (permitPath.length < 2) continue;
                const clearance = Math.max(0, finite(approach.halfWidth))
                  + Math.max(0, finite(permit.halfWidth))
                  + Math.max(0, finite(movementConflictMargin, 3));
                const pathDistance = polylineDistance(requesterPath, permitPath);
                if (pathDistance <= clearance + EPSILON) {
                  return {
                    tokenId: permit.tokenId,
                    junctionId: permit.junctionId,
                    connectorId: permit.connectorId,
                    pathDistance,
                    clearance
                  };
                }
              }
              return null;
            }

            function queueFor(junctionId) {'''
          )

          replace_once(
              junction,
              '''  function junctionOccupied(approach, requesterTokenId) {
              for (const agent of currentAgents) {''',
              '''  function safelyQueuedRouteEntity(item, requesterApproach) {
              if (item?.kind !== "route-traffic" || !item.tokenId || permits.has(String(item.tokenId))) return false;
              const routeAgent = agentFor(item.tokenId);
              if (!routeAgent || routeAgent.stage !== "lane") return false;
              const queuedApproach = approachFor(routeAgent);
              if (!queuedApproach || routeAgent.currentLaneId !== queuedApproach.incomingLaneId) return false;
              if (item.entity?.routeStage !== "lane"
                || item.entity?.routeLaneId !== queuedApproach.incomingLaneId) {
                return false;
              }
              if (clamp(routeAgent.stageProgress, 0, 1) > queuedApproach.stopProgress + EPSILON) return false;

              const forwardX = Math.cos(queuedApproach.stopPoint.angle);
              const forwardY = Math.sin(queuedApproach.stopPoint.angle);
              const physicalBeyondStop = (finite(item.entity?.x) - queuedApproach.stopPoint.x) * forwardX
                + (finite(item.entity?.y) - queuedApproach.stopPoint.y) * forwardY;
              if (physicalBeyondStop > 0.25) return false;

              const broadRadius = entityBroadRadius(item.entity);
              if (distance(item.entity, queuedApproach.node)
                <= queuedApproach.conflictRadius + broadRadius + 0.25) {
                return false;
              }

              const requesterPath = movementPathFor(requesterApproach);
              const projection = nearestPointOnPolyline(
                requesterPath,
                item.entity?.x,
                item.entity?.y
              );
              if (!projection) return false;
              const requesterClearance = Math.max(0, finite(requesterApproach?.halfWidth))
                + broadRadius
                + Math.max(0, finite(movementConflictMargin, 3));
              return projection.distance > requesterClearance + EPSILON;
            }

            function junctionOccupied(approach, requesterTokenId) {
              for (const agent of currentAgents) {'''
          )

          replace_once(
              junction,
              '''    for (const item of physicalEntities()) {
                if (item.tokenId === requesterTokenId) continue;
                const broadRadius = entityBroadRadius(item.entity);''',
              '''    for (const item of physicalEntities()) {
                if (item.tokenId === requesterTokenId) continue;
                if (safelyQueuedRouteEntity(item, approach)) continue;
                const broadRadius = entityBroadRadius(item.entity);'''
          )

          replace_once(
              junction,
              '''    const occupancy = junctionOccupied(approach, agent.tokenId);
              if (occupancy.blocked) {''',
              '''    const permitBlocker = conflictingPermit(approach, agent.tokenId);
              if (permitBlocker) {
                return {
                  blocked: true,
                  reason: "junction-conflict-permit",
                  kind: "route-permit",
                  blockerId: permitBlocker.tokenId
                };
              }

              const occupancy = junctionOccupied(approach, agent.tokenId);
              if (occupancy.blocked) {'''
          )

          replace_once(
              junction,
              '''      if (blocker.reason === "junction-approach-queue") approachQueueDenials++;
                else if (blocker.reason === "junction-exit-blocked") exitBlockedDenials++;
                else occupiedDenials++;''',
              '''      if (blocker.reason === "junction-approach-queue") approachQueueDenials++;
                else if (blocker.reason === "junction-exit-blocked") exitBlockedDenials++;
                else if (blocker.reason === "junction-conflict-permit") movementPermitDenials++;
                else occupiedDenials++;'''
          )

          replace_once(
              junction,
              '''      approachQueueDenials,
                occupiedDenials,
                exitBlockedDenials,''',
              '''      approachQueueDenials,
                occupiedDenials,
                movementPermitDenials,
                exitBlockedDenials,'''
          )

          physical = Path("phaser/src/streaming/TrafficPhysicalConsequencesSystem.js")

          replace_once(
              physical,
              '''    this.lastContact = null;
                this.lastTrafficContact = null;
                this.destroyed = false;''',
              '''    this.lastContact = null;
                this.lastTrafficContact = null;
                this.routePreflightFrames = 0;
                this.routePreflightContacts = 0;
                this.routePreflightYields = 0;
                this.routePreflightHoldSeconds = 0.24;
                this.lastRoutePreflight = null;
                this.destroyed = false;'''
          )

          replace_once(
              physical,
              '''    this.blockedHoldSeconds = clamp(option("blockedHoldSeconds", 0.55), this.pushHoldSeconds, 1.5);
                this.playerSpeedRetention = clamp(option("playerSpeedRetention", 0.78), 0.35, 0.95);''',
              '''    this.blockedHoldSeconds = clamp(option("blockedHoldSeconds", 0.55), this.pushHoldSeconds, 1.5);
                this.routePreflightHoldSeconds = clamp(
                  option("routePreflightHoldSeconds", 0.24),
                  0.12,
                  0.75
                );
                this.playerSpeedRetention = clamp(option("playerSpeedRetention", 0.78), 0.35, 0.95);'''
          )

          replace_once(
              physical,
              '''    slot.physicalHoldSeconds = state.holdSeconds;
                slot.physicalReason = state.lastReason;
                slot.container?.setPosition?.(x, y);''',
              '''    slot.physicalHoldSeconds = state.holdSeconds;
                slot.physicalReason = state.lastReason;
                slot.physicalBlockerId = state.lastVehicleId || null;
                slot.container?.setPosition?.(x, y);'''
          )

          replace_once(
              physical,
              '''  pairKey(left, right) {
              return [String(left?.tokenId || ""), String(right?.tokenId || "")].sort().join("|");
            }

            resolveTrafficPair(left, right, contact) {''',
              '''  pairKey(left, right) {
              return [String(left?.tokenId || ""), String(right?.tokenId || "")].sort().join("|");
            }

            activeRoutePermits() {
              const snapshot = this.materializer.__nbdTrafficJunctionFlowController?.snapshot?.();
              return new Map(
                (snapshot?.activePermits || []).map(permit => [String(permit.tokenId), permit])
              );
            }

            routeContactPriority(slot, permits) {
              const permit = permits.get(String(slot?.tokenId || ""));
              const permitPhase = {
                "clearing-exit": 4,
                connector: 3,
                approach: 2
              }[permit?.phase] || 0;
              const routeStage = slot?.routeStage === "connector"
                ? 2
                : slot?.routeStage === "lane"
                  ? 1
                  : 0;
              return {
                permitPhase,
                routeStage,
                laneId: slot?.routeLaneId || null,
                progress: clamp(slot?.routeStageProgress, 0, 1),
                tokenId: String(slot?.tokenId || "")
              };
            }

            compareRouteContactPriority(left, right, permits) {
              const leftPriority = this.routeContactPriority(left, permits);
              const rightPriority = this.routeContactPriority(right, permits);
              if (leftPriority.permitPhase !== rightPriority.permitPhase) {
                return leftPriority.permitPhase - rightPriority.permitPhase;
              }
              if (leftPriority.routeStage !== rightPriority.routeStage) {
                return leftPriority.routeStage - rightPriority.routeStage;
              }
              if (leftPriority.routeStage === 1
                && leftPriority.laneId
                && leftPriority.laneId === rightPriority.laneId
                && Math.abs(leftPriority.progress - rightPriority.progress) > 0.000001) {
                return leftPriority.progress - rightPriority.progress;
              }
              return rightPriority.tokenId.localeCompare(leftPriority.tokenId);
            }

            routeContactWinner(left, right, permits) {
              return this.compareRouteContactPriority(left, right, permits) >= 0 ? left : right;
            }

            prepareRouteFrame(dt = 0.05) {
              if (this.destroyed || !this.ready || this.scene.registry?.get?.("uiPaused")) return false;
              const seconds = clamp(dt, 0, 0.05);
              const slots = this.activeSlots()
                .filter(slot => slot.routeActive === true)
                .sort((left, right) => String(left.tokenId).localeCompare(String(right.tokenId)));
              const permits = this.activeRoutePermits();
              const yieldByToken = new Map();
              let contacts = 0;

              for (let leftIndex = 0; leftIndex < slots.length; leftIndex++) {
                for (let rightIndex = leftIndex + 1; rightIndex < slots.length; rightIndex++) {
                  const left = slots[leftIndex];
                  const right = slots[rightIndex];
                  const contact = orientedVehicleContact(left, right);
                  if (!contact) continue;
                  contacts++;
                  const winner = this.routeContactWinner(left, right, permits);
                  const loser = winner === left ? right : left;
                  const existing = yieldByToken.get(String(loser.tokenId));
                  if (!existing
                    || this.compareRouteContactPriority(winner, existing.winner, permits) > 0
                    || (this.compareRouteContactPriority(winner, existing.winner, permits) === 0
                      && contact.overlap > existing.overlap)) {
                    yieldByToken.set(String(loser.tokenId), {
                      loser,
                      winner,
                      overlap: contact.overlap
                    });
                  }
                }
              }

              const decisions = [...yieldByToken.values()]
                .sort((left, right) => String(left.loser.tokenId).localeCompare(String(right.loser.tokenId)));
              const loserIds = new Set(decisions.map(decision => String(decision.loser.tokenId)));
              const topWinners = [...new Map(
                decisions
                  .filter(decision => !loserIds.has(String(decision.winner.tokenId)))
                  .map(decision => [String(decision.winner.tokenId), decision.winner])
              ).values()];
              const releasedWinnerTokenIds = [];
              for (const winner of topWinners) {
                const state = this.states.get(String(winner.tokenId));
                if (!state || !["traffic-collision", "route-contact-yield"].includes(state.lastReason)) continue;
                state.holdSeconds = 0;
                state.lastVehicleId = null;
                state.lastReason = "route-contact-priority";
                this.applyStateOffset(winner, state);
                releasedWinnerTokenIds.push(winner.tokenId);
              }

              const holdSeconds = Math.max(
                this.routePreflightHoldSeconds,
                seconds * 2
              );
              for (const decision of decisions) {
                const state = this.stateFor(decision.loser);
                if (!state) continue;
                state.holdSeconds = Math.max(state.holdSeconds, holdSeconds);
                state.lastImpactSpeed = 0;
                state.lastVehicleId = decision.winner.tokenId;
                state.lastReason = "route-contact-yield";
                this.applyStateOffset(decision.loser, state);
              }

              this.routePreflightFrames++;
              this.routePreflightContacts += contacts;
              this.routePreflightYields += decisions.length;
              this.lastRoutePreflight = {
                contacts,
                yields: decisions.length,
                releasedWinnerTokenIds,
                decisions: decisions.map(decision => ({
                  loserTokenId: decision.loser.tokenId,
                  winnerTokenId: decision.winner.tokenId,
                  overlap: round(decision.overlap)
                }))
              };
              return decisions.length > 0;
            }

            resolveTrafficPair(left, right, contact) {'''
          )

          replace_once(
              physical,
              '''      totalTrafficDamage: round(this.totalTrafficDamage),
                totalBulletDamage: round(this.totalBulletDamage),
                maxPushStep: round(this.maxPushStep),''',
              '''      totalTrafficDamage: round(this.totalTrafficDamage),
                totalBulletDamage: round(this.totalBulletDamage),
                routePreflightFrames: this.routePreflightFrames,
                routePreflightContacts: this.routePreflightContacts,
                routePreflightYields: this.routePreflightYields,
                routePreflightHoldSeconds: round(this.routePreflightHoldSeconds, 3),
                routePreflightHeldVehicles: contacts.filter(
                  item => item.reason === "route-contact-yield" && item.holdSeconds > 0
                ).length,
                lastRoutePreflight: this.lastRoutePreflight
                  ? {
                      ...this.lastRoutePreflight,
                      releasedWinnerTokenIds: [...this.lastRoutePreflight.releasedWinnerTokenIds],
                      decisions: this.lastRoutePreflight.decisions.map(decision => ({ ...decision }))
                    }
                  : null,
                maxPushStep: round(this.maxPushStep),'''
          )

          replace_once(
              physical,
              '''      snapshot.totalBulletDamage,
                snapshot.lastContact,
                snapshot.lastTrafficContact''',
              '''      snapshot.totalBulletDamage,
                snapshot.routePreflightContacts,
                snapshot.routePreflightYields,
                snapshot.lastRoutePreflight,
                snapshot.lastContact,
                snapshot.lastTrafficContact'''
          )

          behavior = Path("phaser/src/streaming/TrafficRouteBehaviorPolicy.js")

          replace_once(
              behavior,
              '''  YIELD_JUNCTION: "yield-junction",
            STOPPED_TRAFFIC: "stopped-traffic",''',
              '''  YIELD_JUNCTION: "yield-junction",
            PHYSICAL_HOLD: "physical-hold",
            STOPPED_TRAFFIC: "stopped-traffic",'''
          )

          replace_once(
              behavior,
              '''  let followingDecisions = 0;
            let trafficRecoveryDecisions = 0;''',
              '''  let followingDecisions = 0;
            let physicalHoldDecisions = 0;
            let trafficRecoveryDecisions = 0;'''
          )

          replace_once(
              behavior,
              '''      if (state.recoveryBlocked && state.recoveryCooldownSeconds <= EPSILON) state.recoveryBlocked = false;

                const decision = decisionFor(agent, state, agentsById, blockedById, settings);''',
              '''      if (state.recoveryBlocked && state.recoveryCooldownSeconds <= EPSILON) state.recoveryBlocked = false;

                const slot = materializer.assignments.get(agent.tokenId);
                const physicalHoldSeconds = Math.max(0, finite(slot?.physicalHoldSeconds));
                if (physicalHoldSeconds > EPSILON) {
                  const decision = {
                    fsmState: TRAFFIC_ROUTE_BEHAVIOR_STATE.PHYSICAL_HOLD,
                    desiredSpeedFactor: 0,
                    reason: slot?.physicalReason === "route-contact-yield"
                      ? "physical-contact-yield"
                      : slot?.physicalReason === "blocked"
                        ? "physical-blocked"
                        : "physical-contact-hold",
                    gap: 0,
                    blockerId: slot?.physicalBlockerId || null,
                    blockerKind: "physical"
                  };
                  transition(state, decision, duration);
                  state.desiredSpeedFactor = 0;
                  state.speedFactor = 0;
                  state.reason = decision.reason;
                  state.gap = 0;
                  state.blockerId = decision.blockerId;
                  state.blockerKind = decision.blockerKind;
                  state.stoppedSeconds += duration;
                  physicalHoldDecisions++;
                  stoppedDecisions++;
                  applySlotState(agent, state);
                  continue;
                }

                const decision = decisionFor(agent, state, agentsById, blockedById, settings);'''
          )

          replace_once(
              behavior,
              '''      followingVehicles: stateCounts[TRAFFIC_ROUTE_BEHAVIOR_STATE.FOLLOW] || 0,
                assessingBypassVehicles:''',
              '''      followingVehicles: stateCounts[TRAFFIC_ROUTE_BEHAVIOR_STATE.FOLLOW] || 0,
                physicalHoldingVehicles: stateCounts[TRAFFIC_ROUTE_BEHAVIOR_STATE.PHYSICAL_HOLD] || 0,
                assessingBypassVehicles:'''
          )

          replace_once(
              behavior,
              '''      followingDecisions,
                trafficRecoveryDecisions,''',
              '''      followingDecisions,
                physicalHoldDecisions,
                trafficRecoveryDecisions,'''
          )

          runtime = Path("phaser/src/runtime/GameplayRuntime.js")

          replace_once(
              runtime,
              '''    this.diagnostics.claim("TrafficMultiAgentRouteRuntimePolicy.update", "TrafficMultiAgentRouteRuntimePolicy");
                this.diagnostics.claim("MacroTrafficPoliceSystem.update", "MacroTrafficPoliceSystem");''',
              '''    this.diagnostics.claim("TrafficMultiAgentRouteRuntimePolicy.update", "TrafficMultiAgentRouteRuntimePolicy");
                this.diagnostics.claim(
                  "TrafficPhysicalConsequencesSystem.prepareRouteFrame",
                  "TrafficPhysicalConsequencesSystem"
                );
                this.diagnostics.claim("MacroTrafficPoliceSystem.update", "MacroTrafficPoliceSystem");'''
          )

          replace_once(
              runtime,
              '''    // Civilian route state advances first. Macro traffic then consumes only the
                // conservative route projection for civilian accounting while retaining its
                // independent macro police simulation. Materialization samples the same route
                // state afterwards, so route identity/pose/accounting describe one frame.
                scene.trafficLocalAssignmentPolicy?.multiAgentRoutePolicy?.update?.(dt);''',
              '''    // Gate unresolved route-to-route contacts before advancing compiler-route
                // state. This prevents a car body pinned in a junction from rotating or
                // tunnelling through route stages underneath the physical pile.
                scene.trafficPhysicalConsequencesSystem?.prepareRouteFrame?.(dt);
                // Civilian route state advances after the physical gate. Macro traffic then
                // consumes only the conservative route projection for accounting while
                // retaining its independent macro police simulation.
                scene.trafficLocalAssignmentPolicy?.multiAgentRoutePolicy?.update?.(dt);'''
          )

          test_path = Path("tests/traffic-junction-video-regression.test.js")
          test_path.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          import { createTrafficJunctionFlowController } from "../phaser/src/streaming/TrafficJunctionFlowPolicy.js";
          import { createTrafficJunctionReservationRegistry } from "../phaser/src/streaming/TrafficJunctionReservationRegistry.js";
          import { TrafficPhysicalConsequencesSystem } from "../phaser/src/streaming/TrafficPhysicalConsequencesSystem.js";
          import {
            createTrafficRouteBehaviorController,
            TRAFFIC_ROUTE_BEHAVIOR_STATE
          } from "../phaser/src/streaming/TrafficRouteBehaviorPolicy.js";

          function crossingTopology() {
            return {
              nodes: {
                "junction-west": {
                  id: "junction-west",
                  x: 100,
                  y: 0,
                  trimDistance: 20,
                  maximumRoadWidth: 40
                },
                "junction-north": {
                  id: "junction-north",
                  x: 100,
                  y: 0,
                  trimDistance: 20,
                  maximumRoadWidth: 40
                }
              },
              laneIds: ["west-in", "north-in", "east-out", "south-out"],
              lanes: {
                "west-in": {
                  id: "west-in",
                  points: [{ x: 0, y: 0 }, { x: 80, y: 0 }]
                },
                "north-in": {
                  id: "north-in",
                  points: [{ x: 100, y: -100 }, { x: 100, y: -20 }]
                },
                "east-out": {
                  id: "east-out",
                  points: [{ x: 120, y: 0 }, { x: 220, y: 0 }]
                },
                "south-out": {
                  id: "south-out",
                  points: [{ x: 100, y: 20 }, { x: 100, y: 120 }]
                }
              },
              transitionIds: ["west-east", "north-south"],
              transitions: {
                "west-east": {
                  id: "west-east",
                  nodeId: "junction-west",
                  incomingLaneId: "west-in",
                  outgoingLaneId: "east-out",
                  preferred: true,
                  requiresConnector: true,
                  turnType: "straight"
                },
                "north-south": {
                  id: "north-south",
                  nodeId: "junction-north",
                  incomingLaneId: "north-in",
                  outgoingLaneId: "south-out",
                  preferred: true,
                  requiresConnector: true,
                  turnType: "straight"
                }
              },
              junctionConnectors: {
                connectorIds: ["west-east-connector", "north-south-connector"],
                connectors: {
                  "west-east-connector": {
                    id: "west-east-connector",
                    transitionId: "west-east",
                    nodeId: "junction-west",
                    activationSafe: true,
                    rejectionReasons: [],
                    points: [{ x: 80, y: 0 }, { x: 100, y: 0 }, { x: 120, y: 0 }],
                    length: 40
                  },
                  "north-south-connector": {
                    id: "north-south-connector",
                    transitionId: "north-south",
                    nodeId: "junction-north",
                    activationSafe: true,
                    rejectionReasons: [],
                    points: [{ x: 100, y: -20 }, { x: 100, y: 0 }, { x: 100, y: 20 }],
                    length: 40
                  }
                },
                directHandoffTransitionIds: []
              }
            };
          }

          function routeAgent(tokenId, laneId, progress) {
            return {
              tokenId,
              stage: "lane",
              currentLaneId: laneId,
              connectorId: null,
              nextLaneId: null,
              previousLaneId: null,
              routeHop: 0,
              stageProgress: progress
            };
          }

          function routeSlot(tokenId, laneId, progress, x, y, angle = 0) {
            return {
              slotIndex: tokenId === "west" || tokenId === "owner" ? 0 : 1,
              tokenId,
              routeActive: true,
              routeStage: "lane",
              routeLaneId: laneId,
              routeHop: 0,
              routeStageProgress: progress,
              x,
              y,
              angle,
              radius: 14,
              speedFactor: 1,
              archetype: { width: 28, height: 14, mass: 1 },
              container: {
                active: true,
                setPosition() {
                  return this;
                }
              }
            };
          }

          function junctionMaterializer(topology) {
            const pool = [];
            return {
              lanes: { localTopology: topology },
              pool,
              assignments: new Map(),
              scene: {
                vehicleSystem: {
                  vehicles: [],
                  isDriving: () => false
                },
                player: { x: 1000, y: 1000 }
              }
            };
          }

          test("geometrically crossing movements cannot receive simultaneous permits through different compiler node ids", () => {
            const topology = crossingTopology();
            const materializer = junctionMaterializer(topology);
            const west = routeAgent("west", "west-in", 0.75);
            const north = routeAgent("north", "north-in", 0.75);
            const westSlot = routeSlot("west", "west-in", 0.75, 60, 0);
            const northSlot = routeSlot("north", "north-in", 0.75, 100, -40, Math.PI / 2);
            materializer.pool.push(westSlot, northSlot);
            materializer.assignments.set("west", westSlot);
            materializer.assignments.set("north", northSlot);

            const registry = createTrafficJunctionReservationRegistry({ staleAfterSeconds: 5 });
            const controller = createTrafficJunctionFlowController(materializer, { topology });
            controller.prepareStep({
              agents: [west, north],
              nowSeconds: 0,
              reservationRegistry: registry
            });

            const first = controller.requestAdmission({
              agent: west,
              nowSeconds: 0,
              reservationRegistry: registry
            });
            assert.equal(first.granted, true);

            const second = controller.requestAdmission({
              agent: north,
              nowSeconds: 0.01,
              reservationRegistry: registry
            });
            assert.equal(second.granted, false);
            assert.equal(second.reason, "junction-conflict-permit");
            assert.equal(second.blockerId, "west");
            assert.equal(registry.snapshot().activeReservationCount, 1);
            assert.equal(controller.snapshot().movementPermitDenials, 1);

            assert.equal(controller.confirmConnectorEntry({
              tokenId: "west",
              transition: topology.transitions["west-east"],
              connector: topology.junctionConnectors.connectors["west-east-connector"],
              nowSeconds: 0.1,
              reservationRegistry: registry
            }).allowed, true);
            controller.markConnectorExit({
              tokenId: "west",
              outgoingLaneId: "east-out",
              nowSeconds: 0.2,
              reservationRegistry: registry
            });
            westSlot.routeStage = "lane";
            westSlot.routeLaneId = "east-out";
            westSlot.routeStageProgress = 0.5;
            westSlot.x = 170;
            westSlot.y = 0;
            controller.afterAdvance({
              agent: {
                ...west,
                stage: "lane",
                currentLaneId: "east-out",
                previousLaneId: "west-in",
                stageProgress: 0.5
              },
              nowSeconds: 0.5,
              reservationRegistry: registry
            });
            assert.equal(registry.reservationFor("junction-west"), null);

            const afterClearance = controller.requestAdmission({
              agent: north,
              nowSeconds: 0.51,
              reservationRegistry: registry
            });
            assert.equal(afterClearance.granted, true);
            assert.equal(registry.reservationFor("junction-north")?.tokenId, "north");
            controller.destroy();
          });

          function eventBus() {
            return {
              on() {},
              off() {},
              once() {},
              emit() {}
            };
          }

          async function physicalFixture() {
            const pool = [];
            const materializer = {
              pool,
              assignments: new Map(),
              lanes: { physics: {} },
              originalVehicleCanOccupy() {
                return true;
              }
            };
            const behavior = {
              initialization: Promise.resolve(),
              decisionFor() {
                return {
                  desiredSpeedFactor: 1,
                  reason: "route-cruise",
                  gap: null,
                  blockerId: null
                };
              }
            };
            const vehicleSystem = {
              vehicles: [],
              updateDriving() {},
              currentVehicle() {
                return null;
              },
              isDriving() {
                return false;
              }
            };
            const scene = {
              trafficMaterializationSystem: materializer,
              trafficLocalBehaviorSystem: behavior,
              vehicleSystem,
              events: eventBus(),
              registry: { get: () => false },
              statePublisher: { setMany() {} },
              player: { x: 1000, y: 1000 }
            };
            materializer.scene = scene;
            const system = new TrafficPhysicalConsequencesSystem(scene);
            await system.initialization;
            return { system, materializer, pool };
          }

          test("the pre-route OBB gate holds the deterministic loser before compiler progress can rotate under a pile", async () => {
            const { system, materializer, pool } = await physicalFixture();
            const owner = routeSlot("owner", "west-in", 1, 100, 0, 0);
            owner.routeStage = "connector";
            owner.routeConnectorId = "west-east-connector";
            const waiter = routeSlot("waiter", "north-in", 0.75, 100, 0, Math.PI / 2);
            pool.push(owner, waiter);
            materializer.assignments.set(owner.tokenId, owner);
            materializer.assignments.set(waiter.tokenId, waiter);
            materializer.__nbdTrafficJunctionFlowController = {
              snapshot() {
                return {
                  activePermits: [{
                    tokenId: "owner",
                    phase: "connector",
                    junctionId: "junction-west",
                    connectorId: "west-east-connector"
                  }]
                };
              }
            };

            for (const slot of [owner, waiter]) {
              const state = system.stateFor(slot);
              state.holdSeconds = 0.4;
              state.lastVehicleId = slot === owner ? "waiter" : "owner";
              state.lastReason = "traffic-collision";
              system.applyStateOffset(slot, state);
            }
            assert.ok(owner.physicalHoldSeconds > 0);
            assert.ok(waiter.physicalHoldSeconds > 0);

            assert.equal(system.prepareRouteFrame(0.05), true);
            assert.ok(waiter.physicalHoldSeconds >= 0.2);
            assert.equal(waiter.physicalReason, "route-contact-yield");
            assert.equal(waiter.physicalBlockerId, "owner");
            assert.equal(Number(owner.physicalHoldSeconds || 0), 0);
            assert.equal(owner.physicalReason, "route-contact-priority");

            const snapshot = system.snapshot();
            assert.equal(snapshot.lastRoutePreflight.contacts, 1);
            assert.equal(snapshot.lastRoutePreflight.yields, 1);
            assert.equal(snapshot.lastRoutePreflight.decisions[0].loserTokenId, "waiter");
            assert.deepEqual(snapshot.lastRoutePreflight.releasedWinnerTokenIds, ["owner"]);
            assert.equal(snapshot.routePreflightHeldVehicles, 1);
            system.destroy();
          });

          test("route behavior stops immediately and freezes maneuver progression while the physical gate is active", () => {
            const topology = {
              lanes: {
                lane: {
                  id: "lane",
                  points: [{ x: 0, y: 0 }, { x: 300, y: 0 }],
                  length: 300,
                  roadWidth: 52,
                  laneOffset: 10
                }
              }
            };
            const slot = routeSlot("held", "lane", 0.4, 120, 0);
            slot.physicalHoldSeconds = 0.24;
            slot.physicalReason = "route-contact-yield";
            slot.physicalBlockerId = "owner";
            const scene = {
              events: eventBus(),
              trafficLocalBehaviorSystem: {},
              vehicleSystem: {
                vehicles: [],
                isDriving: () => false
              },
              player: { x: 1000, y: 1000 }
            };
            const materializer = {
              scene,
              pool: [slot],
              assignments: new Map([[slot.tokenId, slot]]),
              trafficTokens() {
                return [];
              }
            };
            const controller = createTrafficRouteBehaviorController(materializer, {
              topology,
              baseSpeed: 100
            });
            const runtime = {
              agents() {
                return [{
                  tokenId: "held",
                  stage: "lane",
                  currentLaneId: "lane",
                  routeHop: 0,
                  stageProgress: 0.4
                }];
              },
              snapshot() {
                return { blocked: [] };
              }
            };

            controller.update(runtime, 0.05);
            const state = controller.snapshot();
            assert.equal(controller.speedFactor("held"), 0);
            assert.equal(slot.engineSpeed, 0);
            assert.equal(slot.behaviorState, TRAFFIC_ROUTE_BEHAVIOR_STATE.PHYSICAL_HOLD);
            assert.equal(slot.behaviorReason, "physical-contact-yield");
            assert.equal(slot.behaviorBlockerId, "owner");
            assert.equal(state.physicalHoldingVehicles, 1);
            assert.equal(state.physicalHoldDecisions, 1);
            controller.clear();
          });

          test("gameplay evaluates actual route-body contact before advancing the multi-agent route runtime", async () => {
            const source = await readFile(
              new URL("../phaser/src/runtime/GameplayRuntime.js", import.meta.url),
              "utf-8"
            );
            const preflight = source.indexOf(
              "scene.trafficPhysicalConsequencesSystem?.prepareRouteFrame?.(dt);"
            );
            const routeAdvance = source.indexOf(
              "scene.trafficLocalAssignmentPolicy?.multiAgentRoutePolicy?.update?.(dt);"
            );
            assert.ok(preflight >= 0);
            assert.ok(routeAdvance > preflight);
          });
          ''', encoding="utf-8")

          Path(".github/workflows/one-time-pr73-video-traffic-fix.yml").unlink()
