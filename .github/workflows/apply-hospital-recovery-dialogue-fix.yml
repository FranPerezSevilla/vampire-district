name: Apply hospital recovery dialogue fix

on:
  push:
    branches:
      - "audio/playtest-p0"
    paths:
      - "tools/apply-hospital-recovery-dialogue-fix.mjs"
      - ".github/workflows/apply-hospital-recovery-dialogue-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery fix
        run: node tools/apply-hospital-recovery-dialogue-fix.mjs
      - name: Focused recovery tests
        run: node --test tests/death-recovery-beat.test.js tests/hospital-death-recovery.test.js tests/player-damage.test.js
      - name: Commit applied fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/src/data/death-recovery.js phaser/src/combat/DeathRecoverySystem.js tests/hospital-death-recovery.test.js docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Fix hospital recovery dialogue and controls"
          git push
