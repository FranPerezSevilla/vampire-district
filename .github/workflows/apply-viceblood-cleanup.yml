name: Apply Viceblood identity cleanup

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/faction-naming-foundation

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Detect pending cleanup payload
        id: gate
        shell: bash
        run: |
          if compgen -G '.github/cleanup-parts/cleanup-part-*.py' > /dev/null; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Cleanup payload already consumed; nothing to apply.'
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble and apply cleanup
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cleanup-parts/cleanup-part-*.py > /tmp/apply-viceblood-cleanup.py
          python -m py_compile /tmp/apply-viceblood-cleanup.py
          python /tmp/apply-viceblood-cleanup.py

          rm -rf .github/cleanup-parts
          rm -f .github/workflows/apply-viceblood-cleanup.yml

      - name: Install exact dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Regenerate canonical city outputs
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:topology

      - name: Check JavaScript syntax
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find phaser tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)

      - name: Run unit regression
        if: steps.gate.outputs.apply == 'true'
        run: npm test

      - name: Validate and compile city
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run city:validate
          npm run city:compile -- --output-dir=/tmp/viceblood-city-compiler
          npm run city:foundry -- --output-dir=/tmp/viceblood-foundry

      - name: Verify repository cleanup
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e legacy
          test ! -e css
          test ! -e js
          test ! -e audio_raw
          test ! -e .github/cleanup-parts
          test ! -e .github/workflows/apply-viceblood-cleanup.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "build-itch-zip.yml tests.yml "
          git diff --check

      - name: Publish source and documentation cleanup through Git Data API
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Workflow edits are published separately by the GitHub connector.
          # Restore them here so this API commit changes only ordinary content.
          git checkout "origin/${TARGET_BRANCH}" -- .github/workflows
          git add -A

          python <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          api_root = f"https://api.github.com/repos/{repository}"

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json"
                  }
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          base_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = api("GET", f"/git/commits/{base_commit}")["tree"]["sha"]

          raw = subprocess.check_output([
              "git", "diff", "--cached", "--name-status", "--no-renames", "-z", "HEAD"
          ])
          fields = raw.split(b"\0")
          entries = []
          changed_paths = []

          for index in range(0, len(fields) - 1, 2):
              status = fields[index].decode("utf-8")
              path = fields[index + 1].decode("utf-8")
              if not status or not path:
                  continue
              changed_paths.append(path)
              if status.startswith("D"):
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue

              with open(path, "rb") as handle:
                  encoded = base64.b64encode(handle.read()).decode("ascii")
              blob = api("POST", "/git/blobs", {"content": encoded, "encoding": "base64"})

              staged = subprocess.check_output(["git", "ls-files", "-s", "--", path], text=True).strip()
              mode = staged.split()[0] if staged else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          if not entries:
              raise SystemExit("Cleanup produced no staged source changes.")

          tree = api("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = api("POST", "/git/commits", {
              "message": "Complete Viceblood identity and legacy cleanup",
              "tree": tree["sha"],
              "parents": [base_commit]
          })
          ref_path = "/git/refs/heads/" + urllib.parse.quote(branch, safe="/")
          api("PATCH", ref_path, {"sha": commit["sha"], "force": False})

          result = {
              "base_commit_sha": base_commit,
              "commit_sha": commit["sha"],
              "tree_sha": tree["sha"],
              "changed_path_count": len(changed_paths)
          }
          with open("viceblood-cleanup-publication.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PY

      - name: Upload publication reference
        if: steps.gate.outputs.apply == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: viceblood-cleanup-publication
          path: viceblood-cleanup-publication.json
          if-no-files-found: error
          retention-days: 2
