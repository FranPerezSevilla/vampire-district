name: Apply Viceblood identity cleanup

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/faction-naming-foundation

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble and apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cleanup-parts/cleanup-part-*.py > /tmp/apply-viceblood-cleanup.py
          python -m py_compile /tmp/apply-viceblood-cleanup.py
          python /tmp/apply-viceblood-cleanup.py

          rm -rf .github/cleanup-parts
          rm -f .github/workflows/apply-viceblood-cleanup.yml

      - name: Install exact dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Regenerate canonical city outputs
        run: npm run city:topology

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find phaser tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)

      - name: Run unit regression
        run: npm test

      - name: Validate and compile city
        shell: bash
        run: |
          set -euo pipefail
          npm run city:validate
          npm run city:compile -- --output-dir=/tmp/viceblood-city-compiler
          npm run city:foundry -- --output-dir=/tmp/viceblood-foundry

      - name: Verify repository cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e legacy
          test ! -e css
          test ! -e js
          test ! -e audio_raw
          test ! -e .github/cleanup-parts
          test ! -e .github/workflows/apply-viceblood-cleanup.yml
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "build-itch-zip.yml tests.yml "
          git diff --check

      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Viceblood identity and legacy cleanup"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Dispatch complete test matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --ref "$TARGET_BRANCH"
