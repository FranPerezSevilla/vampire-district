name: Apply death defeat pacing

on:
  push:
    branches:
      - "audio/playtest-p0"
    paths:
      - "tools/apply-death-defeat-pacing.mjs"
      - ".github/workflows/apply-death-defeat-pacing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pacing and dialogue changes
        run: node tools/apply-death-defeat-pacing.mjs

      - name: Run focused death recovery tests
        run: node --test tests/death-recovery-beat.test.js tests/hospital-death-recovery.test.js

      - name: Commit applied changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/src/data/death-recovery.js phaser/src/combat/DeathRecoverySystem.js tests/death-recovery-beat.test.js docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Polish death defeat pacing and Sire dialogue"
          git push
