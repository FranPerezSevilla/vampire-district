name: Finish feeding audio wiring

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/finish-feeding-audio.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audio branch
        uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - name: Wire stateful feeding sample loop
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/finish-feeding.py
          python3 /tmp/finish-feeding.py

      - name: Validate focused feeding audio coverage
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/audio-sample-catalog.test.js
          git diff --check

      - name: Remove one-off repair debris
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finish-feeding-audio.yml
          rm -f .github/workflows/repair-feeding-audio.yml
          rm -f _tmp_audio_fix_note.txt
          rm -f _tmp_audio_start.b64
          rm -f _tmp_connector_probe.txt
          find phaser/assets/audio/feeding -type d -name _staging -empty -delete

      - name: Commit final feeding integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Wire feeding sample loop"
          git push origin HEAD:audio/playtest-p0
