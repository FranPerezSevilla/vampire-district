name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-menu-theme:
    if: github.event_name == 'pull_request' && github.head_ref == 'audio/playtest-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out ViceBlood audio branch
        uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0
      - name: Materialize validated menu theme and self-clean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

          prefix="phaser/assets/audio/music/_staging/main-menu-theme-01.ogg.b64"
          shopt -s nullglob
          parts=("${prefix}.part-"*)
          test "${#parts[@]}" -eq 26
          cat "${parts[@]}" > /tmp/main-menu-theme-01.ogg.b64
          test "$(wc -c < /tmp/main-menu-theme-01.ogg.b64)" -eq 163148
          base64 --decode /tmp/main-menu-theme-01.ogg.b64 > phaser/assets/audio/music/main-menu-theme-01.ogg
          echo "0dabd4d991b4ef579f53c32489d992dd689612693035192af981f3ead1fcbd24  phaser/assets/audio/music/main-menu-theme-01.ogg" | sha256sum --check --strict
          test "$(stat -c%s phaser/assets/audio/music/main-menu-theme-01.ogg)" -eq 122360
          ffprobe -v error phaser/assets/audio/music/main-menu-theme-01.ogg

          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i phaser/assets/audio/music/main-menu-theme-01.ogg \
            -map_metadata -1 -ac 1 -ar 44100 -codec:a libmp3lame -b:a 96k \
            phaser/assets/audio/music/main-menu-theme-01.mp3
          test "$(stat -c%s phaser/assets/audio/music/main-menu-theme-01.mp3)" -gt 100000
          ffprobe -v error phaser/assets/audio/music/main-menu-theme-01.mp3

          sed -i 's/main-menu-theme-01\.m4a/main-menu-theme-01.mp3/g' \
            phaser/src/main.js tests/main-menu-music.test.js phaser/assets/audio/ATTRIBUTION.md
          sed -i 's/User-supplied 24\.75 s AAC\/M4A loop retained as the runtime menu theme/Validated OGG source with browser-compatible MP3 runtime mirror/' phaser/assets/audio/ATTRIBUTION.md
          rm -f phaser/assets/audio/music/main-menu-theme-01.m4a
          rm -rf phaser/assets/audio/music/_staging
          rm -f .github/workflows/recover-menu-theme.yml \
            .github/workflows/recover-menu-theme-v2.yml \
            .github/workflows/recover-menu-theme-v3.yml
          sed -i '/# Manual retrigger for the validated ViceBlood menu-theme staging payload\./d' .github/workflows/materialize-audio-assets.yml
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml

          grep -q 'main-menu-theme-01.mp3' phaser/src/main.js
          ! grep -q 'main-menu-theme-01.m4a' phaser/src/main.js
          grep -q 'waitForStart' phaser/src/scenes/MainMenuScene.js
          grep -q 'PRESS ANY KEY TO START' phaser/src/ui/TitleScreenAudioGate.js
          node --test tests/main-menu-music.test.js tests/main-menu-audio-binary.test.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize complete ViceBlood menu theme playback"
          git pull --rebase origin audio/playtest-p0
          git push origin HEAD:audio/playtest-p0

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log
      - name: Compile city analysis artifacts
        run: npm run city:compile -- --output-dir=city-compiler-output
      - name: Upload current-city compiler report
        uses: actions/upload-artifact@v4
        with:
          name: city-compiler-current-city
          path: city-compiler-output/
          retention-days: 14
      - name: Compile Foundry pilot candidates
        run: npm run city:foundry -- --output-dir=city-compiler-foundry-output
      - name: Upload Foundry candidate comparison
        uses: actions/upload-artifact@v4
        with:
          name: city-compiler-foundry-pilot
          path: city-compiler-foundry-output/
          retention-days: 14
      - name: Upload unit test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          retention-days: 7

  browser-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run boot and presentation loops
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 10m npm run test:browser:boot 2>&1 | tee browser-boot.log
      - name: Upload boot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-boot-diagnostics
          path: |
            browser-boot.log
            playwright-report/
            test-results/
          retention-days: 7

  browser-systems:
    name: browser-systems (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused system loops
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 8m npm run test:browser:systems -- --shard=${{ matrix.shard }}/3 2>&1 | tee browser-systems.log
      - name: Upload system diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-systems-diagnostics-shard-${{ matrix.shard }}
          path: |
            browser-systems.log
            playwright-report/
            test-results/
          retention-days: 7

  browser-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run campaign state loops
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 14m npm run test:browser:campaign 2>&1 | tee browser-campaign.log
      - name: Upload campaign diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-campaign-diagnostics
          path: |
            browser-campaign.log
            playwright-report/
            test-results/
          retention-days: 7
