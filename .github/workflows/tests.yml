name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log
      - name: Verify browser suite ownership
        run: npm run check:browser:suites
      - name: Compile city analysis artifacts
        run: npm run city:compile -- --output-dir=city-compiler-output
      - name: Upload current-city compiler report
        uses: actions/upload-artifact@v4
        with:
          name: city-compiler-current-city
          path: city-compiler-output/
          retention-days: 14
      - name: Compile Foundry pilot candidates
        run: npm run city:foundry -- --output-dir=city-compiler-foundry-output
      - name: Upload Foundry candidate comparison
        uses: actions/upload-artifact@v4
        with:
          name: city-compiler-foundry-pilot
          path: city-compiler-foundry-output/
          retention-days: 14
      - name: Upload unit test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          retention-days: 7

  browser-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run boot and presentation loops
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 10m npm run test:browser:boot 2>&1 | tee browser-boot.log
      - name: Upload boot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-boot-diagnostics
          path: |
            browser-boot.log
            playwright-report/
            test-results/
          retention-days: 7

  browser-integration:
    name: browser-${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        family: [world, traffic, police, gameplay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Compile traffic topology prerequisites
        if: matrix.family == 'traffic'
        run: npm run city:topology
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.family }} integration loops
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 8m npm run test:browser:${{ matrix.family }} 2>&1 | tee browser-${{ matrix.family }}.log
      - name: Upload ${{ matrix.family }} diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.family }}-diagnostics
          path: |
            browser-${{ matrix.family }}.log
            playwright-report/
            test-results/
          retention-days: 7

  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture runtime performance
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 8m npm run test:browser:performance 2>&1 | tee browser-performance.log
      - name: Upload performance capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-capture
          path: .artifacts/performance/runtime-performance-capture.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload performance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-diagnostics
          path: |
            browser-performance.log
            playwright-report/
            test-results/
          retention-days: 7

  browser-building-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 63
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture representative building review set
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 8m npm run test:browser:building-review 2>&1 | tee browser-building-review.log
      - name: Upload building visual review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-visual-review
          path: .artifacts/building-review/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload building review diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-building-review-diagnostics
          path: |
            browser-building-review.log
            playwright-report/
            test-results/
          retention-days: 7

  browser-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run campaign state loops
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 14m npm run test:browser:campaign 2>&1 | tee browser-campaign.log
      - name: Upload campaign diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-campaign-diagnostics
          path: |
            browser-campaign.log
            playwright-report/
            test-results/
          retention-days: 7
