name: Export pending agreement patch
on:
  push:
    branches: [codex/agreement-source-export]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37fcaf8af9414b98827e742378f9523135207b9e
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agreement-import
          run-id: 34763081381
          github-token: ${{ github.token }}
          path: recovered
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const {dirname} = require('node:path');
            const {createHash} = require('node:crypto');
            const {execFileSync} = require('node:child_process');
            const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
            const manifest = JSON.parse(await fs.readFile('recovered/agreement-import.json','utf8'));
            if(manifest.base !== git('rev-parse','HEAD') || manifest.tree !== 'a736892177b445440dadc5230b5961e6d29922fd' || manifest.entries.length!==16) throw new Error('Wrong manifest');
            for(const entry of manifest.entries) {
              if(!/^(docs|phaser\/src|tests|tools\/boot|ui)\/[a-zA-Z0-9_./-]+$/.test(entry.path) || entry.path.includes('..')) throw new Error('Unsafe source path');
              const {data} = await github.rest.git.getBlob({...context.repo,file_sha:entry.sha});
              if(data.encoding !== 'base64') throw new Error('Unexpected encoding');
              const bytes = Buffer.from(data.content,'base64');
              const hash = createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`),bytes])).digest('hex');
              if(hash!==entry.sha) throw new Error('Blob mismatch');
              await fs.mkdir(dirname(entry.path),{recursive:true});
              await fs.writeFile(entry.path,bytes);
              git('add','--',entry.path);
            }
            git('diff','--cached','--check');
            if(git('write-tree')!==manifest.tree) throw new Error('Tree mismatch');
            await fs.writeFile('recovered/agreements.patch',execFileSync('git',['diff','--cached','--binary']));
            core.info('Exact pending source exported as data; no source execution or ref writes.');
      - uses: actions/upload-artifact@v4
        with:
          name: agreement-patch
          path: recovered/
          retention-days: 2
