name: Apply predator feeding depths

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Detect pending feeding-depth payload
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          for index in 00 01 02 03 04 05 06 07 08 09 10; do
            file=".github/feeding-depth-payload.part-${index}"
            if [ ! -f "$file" ]; then
              echo 'apply=false' >> "$GITHUB_OUTPUT"
              echo "Missing payload block: $file"
              exit 0
            fi
          done
          echo 'apply=true' >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify feeding-depth patch
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo '773f5540119ac0ae49f79c73a9e8da22fc2480f87a3cb5148dd1b8aa56c6042b  .github/feeding-depth-payload.part-00' | sha256sum -c -
          echo '185fe74410556fde67a571dc95be17df618beec195afefaf869864b2d2e4c21f  .github/feeding-depth-payload.part-01' | sha256sum -c -
          echo 'd43b312d54e5f94ce7a8471d05da4d95acbcdc2646606fe5d5785726fe0ff0dd  .github/feeding-depth-payload.part-02' | sha256sum -c -
          echo '49061f255d3ea4744586cffe03b485482a0a4b5ef62ec6ab1cf5499c29490e85  .github/feeding-depth-payload.part-03' | sha256sum -c -
          echo 'bc7f4313d4db414c2e68b182c4f2bf51926eac5c0bd275fd9a01bd3567c92dcf  .github/feeding-depth-payload.part-04' | sha256sum -c -
          echo '4a28bf9cd3b907d4ef698e0ebc8037d23b8b0a2e7e0dd18edf11aee09a17553f  .github/feeding-depth-payload.part-05' | sha256sum -c -
          echo '52d82846d67cf573e837ba99c8deff7999d6653cad6a473d786075df2a49b8b9  .github/feeding-depth-payload.part-06' | sha256sum -c -
          echo '2cef7a8d4b40ca9a0ab916820ef74cfd1bb1409c349f11d243423ced1ebe689b  .github/feeding-depth-payload.part-07' | sha256sum -c -
          echo '1eec4c19051ce120bf412afd3b3ba135b241646451d165020af425fd4466409c  .github/feeding-depth-payload.part-08' | sha256sum -c -
          echo 'd99c9c1d4248e1e830a8237acfe9d7c12daddf158fee7025bf208c3c7ae4af8c  .github/feeding-depth-payload.part-09' | sha256sum -c -
          echo '5031f0f52920e1b5b9472cfaa9a85d11247148510de0777b4f120134b6861aaa  .github/feeding-depth-payload.part-10' | sha256sum -c -

          cat .github/feeding-depth-payload.part-* > /tmp/feeding-depth.b64
          test "$(wc -c < /tmp/feeding-depth.b64)" = '36444'
          echo 'e8842493ecb3596afb4587da2d8d87ac182a6e039bceca2532eaa0e806ff2b24  /tmp/feeding-depth.b64' | sha256sum -c -

          base64 -d /tmp/feeding-depth.b64 > /tmp/feeding-depth.patch.gz
          test "$(wc -c < /tmp/feeding-depth.patch.gz)" = '27333'
          echo '48845a9817763a379d14a4ba47fa2f7bda97b5393dd032ced91857c39a5ac54b  /tmp/feeding-depth.patch.gz' | sha256sum -c -
          gzip -t /tmp/feeding-depth.patch.gz

          gzip -dc /tmp/feeding-depth.patch.gz > /tmp/feeding-depth.patch
          test "$(wc -c < /tmp/feeding-depth.patch)" = '110381'
          echo '364a3189d17b11f2cbb0382aeda5b7e9be321498ef6e63ffd338b5e822d282d0  /tmp/feeding-depth.patch' | sha256sum -c -

      - name: Apply predator feeding implementation
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-feeding-depth-source.yml
          cp "$workflow" /tmp/feeding-depth-workflow.yml
          rm -f "$workflow"
          git apply --check --exclude="$workflow" /tmp/feeding-depth.patch
          git apply --exclude="$workflow" /tmp/feeding-depth.patch
          rm -f .github/feeding-depth-payload.part-*

      - name: Install exact dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Check JavaScript syntax
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find phaser tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)

      - name: Run unit regression
        if: steps.gate.outputs.apply == 'true'
        run: node --test tests/*.test.js

      - name: Validate city topology
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:validate

      - name: Compile current city
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:compile -- --output-dir=/tmp/viceblood-feeding-city

      - name: Compile Foundry candidates
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:foundry -- --output-dir=/tmp/viceblood-feeding-foundry

      - name: Install Chromium
        if: steps.gate.outputs.apply == 'true'
        run: npx playwright install chromium

      - name: Validate feeding-depth browser loops
        if: steps.gate.outputs.apply == 'true'
        run: >-
          npx playwright test
          tests/browser/feeding-depths.spec.js
          tests/browser/hunting-law-runtime.spec.js
          tests/browser/night-ledger.spec.js
          --reporter=line

      - name: Verify patch quality
        if: steps.gate.outputs.apply == 'true'
        run: git diff --check

      - name: Publish validated feeding-depth tree
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-feeding-depth-source.yml
          mkdir -p .github/workflows
          mv /tmp/feeding-depth-workflow.yml "$workflow"

          python <<'PY'
          import base64
          import json
          import os
          import stat
          import subprocess
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["TARGET_BRANCH"]

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def paths_from_git(*args):
              raw = subprocess.check_output(args)
              return [item.decode() for item in raw.split(b"\0") if item]

          def request(method, path, payload):
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent = command("git", "rev-parse", "HEAD")
          base_tree = command("git", "rev-parse", "HEAD^{tree}")
          changed = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=ACMRTUXB", "HEAD"
          )
          changed += paths_from_git("git", "ls-files", "--others", "--exclude-standard", "-z")
          deleted = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=D", "HEAD"
          )

          entries = []
          for path in sorted(set(changed)):
              with open(path, "rb") as source:
                  content = base64.b64encode(source.read()).decode("ascii")
              blob = request("POST", "/git/blobs", {"content": content, "encoding": "base64"})
              mode = "100755" if os.stat(path).st_mode & stat.S_IXUSR else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          for path in sorted(set(deleted)):
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})

          tree = request("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Implement Quick Bite, Full Feed and Drain",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          ref = urllib.parse.quote(f"heads/{branch}", safe="/")
          request("PATCH", f"/git/refs/{ref}", {"sha": commit["sha"], "force": False})
          print(f"Published feeding-depth commit {commit['sha']}")
          PY
