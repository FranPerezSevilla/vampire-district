name: Apply traffic visibility lifecycle v2

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/apply-traffic-visibility-lifecycle-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse validated bounded patch
        shell: bash
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/apply-traffic-visibility-lifecycle.yml \
            | sed '1d;$d;s/^          //' \
            | python3
      - name: Install exact dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Run focused traffic regression
        run: node --test tests/city-streaming-4d.test.js
      - name: Run fast unit safety net against current branch baseline
        shell: bash
        run: |
          set +e
          npm run check:fast > /tmp/fast.log 2>&1
          status=$?
          set -e
          cat /tmp/fast.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -Eq '# fail 4$' /tmp/fast.log
          grep -q 'ERR_MODULE_NOT_FOUND' /tmp/fast.log
          grep -q 'tests/current-map-continuity.test.js' /tmp/fast.log
          grep -q 'tests/foundry-hardening.test.js' /tmp/fast.log
          grep -q 'tests/streaming-and-persistence.test.js' /tmp/fast.log
          grep -q 'tests/urban-witness-network.test.js' /tmp/fast.log
          grep -q 'pedestrian-route-expansion.js' /tmp/fast.log
      - name: Show affected test plan
        run: npm run check:affected:plan -- --base=origin/main
      - name: Commit bounded increment and remove applicators
        shell: bash
        run: |
          git config user.name "ViceBlood automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-traffic-visibility-lifecycle.yml .github/workflows/apply-traffic-visibility-lifecycle-v2.yml
          git add phaser/src/streaming/TrafficMaterializationSystem.js phaser/src/streaming/TrafficLocalBehaviorSystem.js tests/city-streaming-4d.test.js docs/CITY_STREAMING_4D.md docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md
          git commit -m "Prevent visible civilian traffic wrap pops"
          git push origin HEAD:audio/playtest-p0
