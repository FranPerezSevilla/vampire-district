name: Feeding-depth browser diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/feeding-depth-payload.part-* | base64 -d | gzip -dc > /tmp/feeding-depth.patch
          rm -f .github/workflows/temporary-feeding-depth-source.yml
          git apply --exclude=.github/workflows/temporary-feeding-depth-source.yml /tmp/feeding-depth.patch

      - name: Install dependencies and Chromium
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx playwright install chromium

      - name: Run feeding-depth diagnostics
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            tests/browser/feeding-depths.spec.js \
            tests/browser/hunting-law-runtime.spec.js \
            tests/browser/night-ledger.spec.js \
            --reporter=line 2>&1 | tee /tmp/feeding-depth-browser.log

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feeding-depth-browser-diagnostics
          path: |
            /tmp/feeding-depth-browser.log
            test-results
            playwright-report
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 2

      - name: Fail when browser diagnostics failed
        if: steps.browser.outcome == 'failure'
        run: exit 1
