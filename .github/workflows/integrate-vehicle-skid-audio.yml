name: Integrate vehicle skid audio

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/integrate-vehicle-skid-audio.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire stateful skid loop and document it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          raw_path = Path('phaser/src/systems/RawAudioSystem.js')
          raw = raw_path.read_text()

          constructor_old = '    this.sampleLoops = new Map();\n    this.sampleLoopWanted = new Set();\n'
          constructor_new = '    this.sampleLoops = new Map();\n    this.sampleLoopWanted = new Set();\n    this.sampleLoopTimers = new Map();\n'
          if 'this.sampleLoopTimers = new Map();' not in raw:
              assert constructor_old in raw
              raw = raw.replace(constructor_old, constructor_new, 1)

          stop_old = '''  stopSampleLoop(name) {
            this.sampleLoopWanted.delete(name);
            const handle = this.sampleLoops.get(name);
            if (!handle) return false;
            this.sampleLoops.delete(name);
            try { handle.source.stop(); } catch {}
            try { handle.source.disconnect(); } catch {}
            try { handle.gain.disconnect(); } catch {}
            return true;
          }
'''
          replacement = '''  pulseSampleLoop(name, options = {}) {
            const hold = Math.max(0.16, Number(options.hold) || 0.34);
            const started = this.startSampleLoop(name, options);
            const previousTimer = this.sampleLoopTimers.get(name);
            if (previousTimer && typeof window !== "undefined") window.clearTimeout(previousTimer);
            if (typeof window !== "undefined") {
              const timer = window.setTimeout(() => {
                this.sampleLoopTimers.delete(name);
                this.stopSampleLoop(name);
              }, hold * 1000);
              this.sampleLoopTimers.set(name, timer);
            }
            // Keep immediate feedback while a newly unlocked browser is still
            // decoding the real loop. Once loaded, subsequent pulses sustain
            // the sample-backed loop instead of retriggering one-shots.
            if (!started && name === "vehicleSkidLoop") this.vehicleSkid();
            return started;
          }

          stopSampleLoop(name) {
            this.sampleLoopWanted.delete(name);
            const timer = this.sampleLoopTimers.get(name);
            if (timer && typeof window !== "undefined") window.clearTimeout(timer);
            this.sampleLoopTimers.delete(name);
            const handle = this.sampleLoops.get(name);
            if (!handle) return false;
            this.sampleLoops.delete(name);
            try { handle.source.stop(); } catch {}
            try { handle.source.disconnect(); } catch {}
            try { handle.gain.disconnect(); } catch {}
            return true;
          }
'''
          if 'pulseSampleLoop(name, options = {})' not in raw:
              assert stop_old in raw
              raw = raw.replace(stop_old, replacement, 1)

          play_old = '    if (this.playSample(name, options)) return;\n'
          play_new = '''    if (name === "vehicleSkidLoop" && sampleAudioDefinition(name)?.loop) {
              this.pulseSampleLoop(name, { ...options, hold: 0.34 });
              return;
            }

            if (this.playSample(name, options)) return;
'''
          if 'name === "vehicleSkidLoop" && sampleAudioDefinition(name)?.loop' not in raw:
              assert play_old in raw
              raw = raw.replace(play_old, play_new, 1)

          raw_path.write_text(raw)

          test_path = Path('tests/vehicle-skid-audio.test.js')
          test_path.write_text('''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { SAMPLE_AUDIO_CATALOG } from "../phaser/src/audio/SampleAudioCatalog.js";

          const repoFile = path => new URL(`../${path}`, import.meta.url);

          test("vehicleSkidLoop is a committed PCM loop used as continuous aggressive-driving audio", () => {
            const definition = SAMPLE_AUDIO_CATALOG.vehicleSkidLoop;
            assert.deepEqual(definition.files, ["phaser/assets/audio/vehicles/vehicle-skid-loop-01.wav"]);
            assert.equal(definition.loop, true);
            assert.equal(definition.volume, 0.68);

            const wav = readFileSync(repoFile(definition.files[0]));
            assert.ok(wav.length > 50_000);
            assert.equal(wav.subarray(0, 4).toString("ascii"), "RIFF");
            assert.equal(wav.subarray(8, 12).toString("ascii"), "WAVE");

            const rawAudio = readFileSync(repoFile("phaser/src/systems/RawAudioSystem.js"), "utf8");
            const driving = readFileSync(repoFile("phaser/src/vehicles/VehicleDriving.js"), "utf8");
            assert.match(rawAudio, /pulseSampleLoop\(name, options = \{\}\)/);
            assert.match(rawAudio, /name === "vehicleSkidLoop" && sampleAudioDefinition\(name\)\?\.loop/);
            assert.match(rawAudio, /hold: 0\.34/);
            assert.match(rawAudio, /stopSampleLoop\(name\)/);
            assert.match(driving, /RawAudio\.play\("vehicleSkidLoop", \{ cooldown: 0\.16 \}\)/);
            assert.match(driving, /panicCiviliansFromAggressiveDriving\(system, vehicle, intensity\)/);
          });
          ''')

          docs_path = Path('docs/audio-catalog.md')
          docs = docs_path.read_text()
          if '`policeSirenLoop` — **wired candidate' not in docs:
              anchor = '- `civilianScream` — **integrated + listening accepted on PR #55**:'
              start = docs.index(anchor)
              end = docs.index('\n\n## Audio Lab', start)
              block = docs[start:end]
              block += '\n- `policeSirenLoop` — **wired candidate on PR #55, pending in-game listening acceptance**: one spatial PCM loop per active response cruiser, with distance attenuation and stereo pan.\n- `vehicleSkidLoop` — **wired candidate on PR #55, pending in-game listening acceptance**: a real tyre-skid PCM loop sustained by aggressive-driving pulses; civilian panic remains a separate non-reporting gameplay reaction.\n'
              docs = docs[:start] + block + docs[end:]
          docs = docs.replace('- `vehicleSkidLoop`\n', '- `vehicleSkidLoop` — **wired candidate:** real gap-sensitive PCM loop; sustained while aggressive drifting continues\n')
          docs = docs.replace('Continue sourcing with `policeSirenLoop`, then `ambienceStreetNight`.', 'With `policeSirenLoop` and `vehicleSkidLoop` now wired as listening candidates, continue sourcing with `ambienceStreetNight`.')
          docs_path.write_text(docs)
          PY

      - name: Validate focused audio behavior
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/aggressive-driving-panic.test.js tests/vehicle-skid-audio.test.js tests/audio-sample-catalog.test.js
          git diff --check

      - name: Commit integration and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-vehicle-skid-audio.yml
          git add phaser/src/systems/RawAudioSystem.js tests/vehicle-skid-audio.test.js docs/audio-catalog.md
          git commit -m "Integrate real vehicle skid loop"
          git push
