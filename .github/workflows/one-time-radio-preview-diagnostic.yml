name: One-time radio deploy-preview diagnostic

on:
  push:
    branches:
      - codex/traffic-junction-topology
    paths:
      - .github/workflows/one-time-radio-preview-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Netlify endpoints
        shell: bash
        run: |
          set -u
          inspect() {
            local label="$1"
            local url="$2"
            local safe
            safe="$(echo "$label" | tr -c 'A-Za-z0-9' '_')"
            echo "===== ${label} ====="
            status="$(curl --silent --show-error --location --max-time 30 \
              -D "/tmp/${safe}.headers" \
              -o "/tmp/${safe}.body" \
              -w '%{http_code}' \
              "$url" || true)"
            echo "URL: ${url}"
            echo "HTTP: ${status}"
            echo "--- headers ---"
            sed -n '1,80p' "/tmp/${safe}.headers" | tr -d '\r' || true
            echo "--- body ---"
            head -c 1600 "/tmp/${safe}.body" || true
            echo
          }

          inspect "deploy preview root" \
            "https://deploy-preview-73--vampire-district.netlify.app/"
          inspect "deploy preview radio catalogue" \
            "https://deploy-preview-73--vampire-district.netlify.app/phaser/src/audio/RadioCatalog.js"
          inspect "production root" \
            "https://vampire-district.netlify.app/"
          inspect "radio 78 draft root" \
            "https://radio-78--vampire-district.netlify.app/"
          inspect "radio 78 private master" \
            "https://radio-78--vampire-district.netlify.app/phaser/assets/audio/radio-private/vice-fm__daisuke-teiko__the-real-deal-90s-hip-hop-instrumental.mp3"
