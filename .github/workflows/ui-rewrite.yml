name: UI rewrite

on:
  push:
    branches: [codex/ui-rewrite]

permissions:
  contents: read

concurrency:
  group: ui-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record affected validation plan
        run: npm run check:affected:plan -- --base=origin/main > ui-affected-plan.log
      - name: Native and DOM event tests (no browsers)
        shell: bash
        run: |
          set -o pipefail
          npm run check:fast 2>&1 | tee ui-native.log
      - name: Build complete review package
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: viceblood-ui-review
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-validation
          path: |
            ui-native.log
            ui-affected-plan.log
          retention-days: 14
