name: UI rewrite

on:
  push:
    branches: [codex/ui-rewrite, codex/traffic-junction-topology]

permissions:
  contents: read

concurrency:
  group: ui-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-build:
    if: github.ref == 'refs/heads/codex/ui-rewrite'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record affected validation plan
        run: npm run check:affected:plan -- --base=origin/main > ui-affected-plan.log
      - name: Native and DOM event tests (no browsers)
        shell: bash
        run: |
          set -o pipefail
          npm run check:fast 2>&1 | tee ui-native.log
      - name: Build complete review package
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: viceblood-ui-review
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-validation
          path: |
            ui-native.log
            ui-affected-plan.log
          retention-days: 14

  # Preparation is deliberately separate from publication. Only the connector's
  # explicit non-force ref update publishes to the existing Pages source branch.
  prepare-pages:
    needs: native-and-build
    if: github.repository == 'FranPerezSevilla/vampire-district' && github.ref == 'refs/heads/codex/ui-rewrite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: viceblood-ui-review
          path: review
      - name: Prepare verified static objects for an explicit Pages publication
        uses: actions/github-script@v7
        with:
          script: |
            const { readFile, writeFile } = require('node:fs/promises');
            const { createHash } = require('node:crypto');
            const { owner, repo } = context.repo;
            const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
            const blobHash = bytes => createHash('sha1').update(Buffer.concat([
              Buffer.from(`blob ${bytes.length}\0`), bytes
            ])).digest('hex');
            const metadata = JSON.parse(await readFile('review/build.json', 'utf8'));
            if (metadata.revision !== context.sha || metadata.dirty !== false || metadata.ui !== 'react-radix') {
              throw new Error('Build provenance does not match the validated source');
            }
            const paths = [
              'phaser/ui-dist/interface.js', 'phaser/ui-dist/interface.css',
              'node_modules/phaser/dist/phaser.min.js', 'node_modules/phaser/LICENSE.md',
              'build.json', '.nojekyll'
            ];
            const objects = [];
            for (const path of paths) {
              // upload-artifact excludes dotfiles; recreate this empty marker.
              const bytes = path === '.nojekyll' ? Buffer.alloc(0) : await readFile(`review/${path}`);
              if (path === 'phaser/ui-dist/interface.js' && sha256(bytes) !== metadata.interfaceSha256) {
                throw new Error('Compiled interface digest mismatch');
              }
              if (path !== '.nojekyll' && bytes.length === 0) throw new Error(`Empty asset: ${path}`);
              objects.push({ path, bytes, sha: blobHash(bytes), sha256: sha256(bytes) });
            }
            const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            for (const object of objects) {
              const { data } = await github.rest.git.createBlob({
                owner, repo, content: object.bytes.toString('base64'), encoding: 'base64'
              });
              if (data.sha !== object.sha) throw new Error(`Uploaded asset mismatch: ${object.path}`);
            }
            const manifest = {
              revision: context.sha, sourceTree: commit.tree.sha, runId: context.runId,
              entries: objects.map(({ path, sha, sha256, bytes }) => ({
                path, mode: '100644', type: 'blob', sha, sha256, size: bytes.length
              }))
            };
            await writeFile('pages-preparation.json', JSON.stringify(manifest, null, 2));
            core.info(`PAGES_PREPARATION=${JSON.stringify(manifest)}`);
            await core.summary.addHeading('Pages package prepared, not published')
              .addRaw(`Validated source: ${context.sha}\n\nSix static objects verified. No branch ref, Pages setting or PR was changed by this job.\n`)
              .write();
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preparation
          path: pages-preparation.json
          retention-days: 14

  verify-pages:
    if: github.repository == 'FranPerezSevilla/vampire-district' && github.ref == 'refs/heads/codex/traffic-junction-topology'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the published revision and static runtime over HTTP (no browser)
        uses: actions/github-script@v7
        with:
          script: |
            const { readFile, writeFile } = require('node:fs/promises');
            const { createHash } = require('node:crypto');
            const base = 'https://franperezsevilla.github.io/vampire-district/';
            const digest = bytes => createHash('sha256').update(bytes).digest('hex');
            const expectedBytes = await readFile('build.json');
            const expected = JSON.parse(expectedBytes);
            if (expected.ui !== 'react-radix' || expected.dirty !== false || !/^[a-f0-9]{40}$/.test(expected.revision)) {
              throw new Error('Missing clean publication provenance');
            }
            const paths = [
              'index.html', 'phaser/index.html', 'phaser/viewport.css', 'phaser/title-screen.css',
              'phaser/ui-dist/interface.js', 'phaser/ui-dist/interface.css',
              'phaser/src/app-bootstrap.js', 'phaser/src/main.js',
              'phaser/src/scenes/UIScene.js', 'phaser/src/scenes/MainMenuScene.js',
              'phaser/src/ui/UiStore.js', 'phaser/src/ui/GameUiReadModel.js',
              'phaser/src/vampire/VampireRuntime.js', 'phaser/src/data/district.js',
              'phaser/assets/ui/viceblood-logo.svg', 'phaser/assets/audio/music/main-menu-theme-01.mp3'
            ];
            const local = await Promise.all(paths.map(async path => ({ path, sha256: digest(await readFile(path)) })));
            if (local.find(file => file.path === 'phaser/ui-dist/interface.js').sha256 !== expected.interfaceSha256) {
              throw new Error('Local published bundle does not match build.json');
            }
            const deadline = Date.now() + 240000;
            const getBytes = async path => {
              const remaining = deadline - Date.now();
              if (remaining <= 0) throw new Error('Publication verification deadline reached');
              const url = new URL(path, base);
              url.searchParams.set('verify', `${context.sha}-${Date.now()}`);
              const response = await fetch(url, {
                signal: AbortSignal.timeout(Math.min(10000, remaining)),
                headers: { 'Cache-Control': 'no-cache' }, redirect: 'error'
              });
              if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
              return Buffer.from(await response.arrayBuffer());
            };
            let report = null, lastError = null;
            for (let attempt = 1; Date.now() < deadline; attempt++) {
              try {
                if (digest(await getBytes('build.json')) !== digest(expectedBytes)) throw new Error('Pages still serves another revision');
                const verified = [];
                // Four concurrent reads at most; no browser, gameplay or save access.
                for (let start = 0; start < local.length; start += 4) {
                  verified.push(...await Promise.all(local.slice(start, start + 4).map(async file => {
                    if (digest(await getBytes(file.path)) !== file.sha256) throw new Error(`Stale or mismatched asset: ${file.path}`);
                    return { ...file, status: 200 };
                  })));
                }
                report = { url: base, sourceRevision: expected.revision, deploymentRevision: context.sha,
                  verifiedAt: new Date().toISOString(), files: verified, browserExecuted: false };
                break;
              } catch (error) {
                lastError = error;
                core.info(`Pages propagation check ${attempt}: ${error.message}`);
                const remaining = deadline - Date.now();
                if (remaining > 0) await new Promise(resolve => setTimeout(resolve, Math.min(10000, remaining)));
              }
            }
            if (!report) throw lastError || new Error('Pages verification did not finish');
            await writeFile('pages-http-verification.json', JSON.stringify(report, null, 2));
            core.info(`PAGES_HTTP_VERIFIED=${JSON.stringify(report)}`);
            await core.summary.addHeading('Public Pages files verified')
              .addRaw(`Source: ${expected.revision}\n\nPublication: ${context.sha}\n\n16 HTTP assets match the committed bytes. No browser or visual acceptance is claimed.\n`)
              .write();
      - uses: actions/upload-artifact@v4
        with:
          name: pages-http-verification
          path: pages-http-verification.json
          retention-days: 14
