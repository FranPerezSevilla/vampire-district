name: Integrate footsteps and hitscan world collision

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - ".github/workflows/integrate-bullet-hit-world.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Recover verified integration script
        run: |
          base64 -d .github/audio-staging/integrate-footsteps-world-hits.py.gz.b64 \
            | gzip -d > /tmp/integrate_footsteps_world_hits.py
          python3 -m py_compile /tmp/integrate_footsteps_world_hits.py

      - name: Materialize audio and wire gameplay collision
        run: python3 /tmp/integrate_footsteps_world_hits.py

      - name: Remove encoded script staging
        run: |
          rm -f .github/audio-staging/integrate-footsteps-world-hits.py.gz.b64
          rmdir .github/audio-staging 2>/dev/null || true

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect footsteps and hitscan world impacts"
          git push origin HEAD:audio/playtest-p0
