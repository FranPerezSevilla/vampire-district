name: Fix Slice 6 applicator assertion

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/fix-slice6-applicator.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
      - name: Fix source assertion and push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-slice6-hospital.yml')
          text = p.read_text()
          old = 'assert.match(code, /hospital-recovery-lackey/);'
          new = 'assert.match(code, /HOSPITAL_RECOVERY\\.lackeyId/);'
          if old not in text:
              raise SystemExit('expected assertion not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-slice6-hospital.yml
          git commit -m "Fix hospital recovery focused assertion"
          git push origin HEAD:audio/playtest-p0