name: Apply browser boot cleanup patch

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/apply-browser-boot-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0
      - name: Apply focused cleanup and remove applicator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path('phaser/src/scenes/UIScene.js')
          ui = ui_path.read_text()
          old = '''    const code = event.code;\n    if (event.defaultPrevented && code !== "Escape") return;'''
          new = '''    const code = event.code;\n    const gameScene = this.scene.get("GameScene");\n    const hornBinding = this.registry.get("inputBindings")?.bindings?.horn;\n    const hornOwnsH = code === "KeyH"\n      && String(hornBinding || "H").toUpperCase() === "H"\n      && Boolean(gameScene?.vehicleSystem?.isDriving?.());\n    const uiOwnsH = code === "KeyH" && !hornOwnsH;\n    if (event.defaultPrevented && code !== "Escape" && !uiOwnsH) return;'''
          if old not in ui:
              raise SystemExit('UIScene default-prevention anchor not found')
          ui = ui.replace(old, new, 1)
          old = '''    } else if (code === "KeyH") {\n      if (!this.ledgerOpen && !this.introOpen && !this.resultOpen && !this.registry.get("taskRevealActive")) {'''
          new = '''    } else if (code === "KeyH") {\n      if (uiOwnsH && !this.ledgerOpen && !this.introOpen && !this.resultOpen && !this.registry.get("taskRevealActive")) {'''
          if old not in ui:
              raise SystemExit('UIScene KeyH anchor not found')
          ui_path.write_text(ui.replace(old, new, 1))

          slice_path = Path('tests/browser/playtest-slice.spec.js')
          source = slice_path.read_text()
          replacements = {
              'sidewalkPatrols: patrolRoutes.filter(route => route.surface === "sidewalk").length,': 'pedestrianPatrols: patrolRoutes.filter(route => route.surface === "pedestrian").length,',
              'expect(cityConsequences.sidewalkPatrols).toBeGreaterThan(0);': 'expect(cityConsequences.pedestrianPatrols).toBeGreaterThan(0);',
          }
          for before, after in replacements.items():
              if before not in source:
                  raise SystemExit(f'playtest-slice anchor not found: {before}')
              source = source.replace(before, after, 1)
          slice_path.write_text(source)

          doc_path = Path('docs/BROWSER_BOOT_REGRESSION_CLEANUP.md')
          doc = doc_path.read_text()
          before = '- `taskRevealActive` deliberately owns world/UI input while an objective reveal is active. The pause-menu hotkey **H** is therefore expected to do nothing until the reveal authority is idle.\n'
          after = before + '- **H** is also the default remappable vehicle horn. The UI menu owns H while the player is on foot, even though Phaser has already marked that bound key as handled; while actively driving with H still bound to the horn, vehicle input owns it instead.\n'
          if before not in doc:
              raise SystemExit('browser cleanup doc authority anchor not found')
          doc = doc.replace(before, after, 1)
          before = '- `tests/browser/ui-accessibility.spec.js` waits for the RC harness task-reveal authority to become idle before pressing **H**, preserving the intentional input lock instead of racing it.\n'
          after = before + '- `UIScene` now arbitrates the shared H key explicitly: an on-foot menu shortcut is not discarded merely because Phaser captured the horn binding, while an actively driven vehicle still retains horn ownership.\n'
          if before not in doc:
              raise SystemExit('browser cleanup doc regression anchor not found')
          doc = doc.replace(before, after, 1)
          before = '- H remains blocked while a task reveal owns input, then opens the pause menu once that authority is idle.\n'
          after = '- H remains blocked while a task reveal owns input, then opens the pause menu on foot once that authority is idle; an actively driven vehicle keeps H for the horn when that remains its configured binding.\n'
          if before not in doc:
              raise SystemExit('browser cleanup doc acceptance anchor not found')
          doc_path.write_text(doc.replace(before, after, 1))

          Path('.github/workflows/apply-browser-boot-cleanup.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/src/scenes/UIScene.js tests/browser/playtest-slice.spec.js docs/BROWSER_BOOT_REGRESSION_CLEANUP.md .github/workflows/apply-browser-boot-cleanup.yml
          git commit -m "Finish browser boot regression cleanup"
          git push origin HEAD:audio/playtest-p0
