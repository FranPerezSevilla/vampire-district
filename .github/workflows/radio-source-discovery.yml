name: Radio source discovery

on:
  push:
    branches:
      - codex/car-radio-runtime
    paths:
      - .github/workflows/radio-source-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test standard reader against one AudioObject
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H 'Accept: application/json' \
            -H 'X-Target-Selector: script[type="application/ld+json"]' \
            'https://r.jina.ai/https://pixabay.com/music/beats-daisuke-teiko-the-real-deal-90s-hip-hop-instrumental-111454/' \
            | tee /tmp/reader.json
          echo
          grep -Eo 'https://cdn\.pixabay\.com[^"[:space:]<>]+\.mp3[^"[:space:]<>]*' /tmp/reader.json || true
