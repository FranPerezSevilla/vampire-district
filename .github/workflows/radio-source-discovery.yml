name: Radio source discovery

on:
  push:
    branches:
      - codex/car-radio-runtime
    paths:
      - .github/workflows/radio-source-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Extract Pixabay AudioObject contentUrl once
        shell: bash
        run: |
          set -euo pipefail
          declare -A PAGES=(
            [daisuke]='https://pixabay.com/music/beats-daisuke-teiko-the-real-deal-90s-hip-hop-instrumental-111454/'
            [catch22]='https://pixabay.com/music/beats-coasting-west-coast-hip-hop-381615/'
            [abydos]='https://pixabay.com/music/beats-trip-hop-lovers-206690/'
            [ejah1]='https://pixabay.com/music/electronic-big-beat-rave-industrial-breakbeat-1-472114/'
            [natureseye]='https://pixabay.com/music/upbeat-dirty-industrial-rave-177919/'
            [ejah3]='https://pixabay.com/music/hard-rock-big-beat-rave-industrial-breakbeat-3-473019/'
            [maty]='https://pixabay.com/es/music/optimista-tema-acid-house-329018/'
            [placidplace]='https://pixabay.com/es/music/techno-y-trance-franic-acid-trance-395688/'
            [berrydeep]='https://pixabay.com/music/soft-house-back-to-90s-579460/'
          )
          for id in daisuke catch22 abydos ejah1 natureseye ejah3 maty placidplace berrydeep; do
            target="${PAGES[$id]}"
            echo "::group::$id"
            curl --fail-with-body --silent --show-error --max-time 45 \
              -H 'Accept: application/json' \
              -H 'X-Engine: cf-browser-rendering' \
              -H 'X-Respond-With: readerlm-v2' \
              -H 'X-Instruction: Extract the AudioObject direct MP3 contentUrl from the page structured data. Return only JSON with keys contentUrl and name. Do not invent a URL.' \
              "https://r.jina.ai/${target}" || true
            echo
            echo '::endgroup::'
          done
