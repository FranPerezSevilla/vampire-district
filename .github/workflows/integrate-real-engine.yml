name: Integrate real vehicle engine audio

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - ".github/workflows/integrate-real-engine.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Reconstruct verified engine derivatives
        run: |
          set -euo pipefail
          echo "Staged fragment diagnostics:"
          for staged in .github/audio-staging/engine/*.part-*; do
            printf '%s bytes=' "$staged"
            wc -c < "$staged" | tr -d '\n'
            printf ' sha256='
            sha256sum "$staged" | cut -d' ' -f1
            if LC_ALL=C grep -n '[^A-Za-z0-9+/=[:space:]]' "$staged"; then
              echo "Invalid base64 character found in $staged" >&2
              exit 1
            fi
          done
          mkdir -p phaser/assets/audio/vehicles
          cat .github/audio-staging/engine/vehicle-engine-start-01.ogg.b64.part-* > /tmp/engine-start.b64
          cat .github/audio-staging/engine/vehicle-engine-loop-01.ogg.b64.part-* > /tmp/engine-loop.b64
          base64 --decode /tmp/engine-start.b64 > phaser/assets/audio/vehicles/vehicle-engine-start-01.ogg
          base64 --decode /tmp/engine-loop.b64 > phaser/assets/audio/vehicles/vehicle-engine-loop-01.ogg
          echo "83cd107a70f8f089131a94f8334857306d57817ef69c2a00004c701d05df7865  phaser/assets/audio/vehicles/vehicle-engine-start-01.ogg" | sha256sum -c -
          echo "c03ac98e545b3d5c713e0b20cbf01e955912ca9d6712a0e3d477041fb0668353  phaser/assets/audio/vehicles/vehicle-engine-loop-01.ogg" | sha256sum -c -
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 phaser/assets/audio/vehicles/vehicle-engine-start-01.ogg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 phaser/assets/audio/vehicles/vehicle-engine-loop-01.ogg
          ffmpeg -nostdin -hide_banner -loglevel error -y -i phaser/assets/audio/vehicles/vehicle-engine-start-01.ogg -map_metadata -1 -ac 1 -ar 44100 -codec:a libmp3lame -q:a 4 phaser/assets/audio/vehicles/vehicle-engine-start-01.mp3
          ffmpeg -nostdin -hide_banner -loglevel error -y -i phaser/assets/audio/vehicles/vehicle-engine-loop-01.ogg -map_metadata -1 -ac 1 -ar 44100 -codec:a pcm_s16le phaser/assets/audio/vehicles/vehicle-engine-loop-01.wav
          ffmpeg -nostdin -hide_banner -loglevel error -y -i phaser/assets/audio/vehicles/vehicle-engine-loop-01.ogg -map_metadata -1 -ac 1 -ar 44100 -codec:a libmp3lame -q:a 4 phaser/assets/audio/vehicles/vehicle-engine-loop-01.mp3

      - name: Integrate sample-backed engine system
        run: |
          set -euo pipefail
          python tools/_tmp-integrate-real-engine.py

      - name: Validate focused engine and door behavior
        run: |
          set -euo pipefail
          node --test tests/vehicle-engine-audio.test.js tests/vehicle-door-audio.test.js

      - name: Remove one-off staging helpers
        run: |
          set -euo pipefail
          rm -rf .github/audio-staging/engine
          rm -f tools/_tmp-integrate-real-engine.py
          rm -f .github/workflows/integrate-real-engine.yml

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/assets/audio phaser/src docs tests .github tools
          git commit -m "Integrate real sample-backed vehicle engine"
          git push
