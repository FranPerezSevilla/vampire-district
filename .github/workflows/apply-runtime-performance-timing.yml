name: Apply runtime performance timing

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/apply-runtime-performance-timing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Apply bounded runtime profiling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          runtime_diagnostics = Path('phaser/src/runtime/RuntimeDiagnostics.js')
          runtime_diagnostics.write_text(r'''function clockNow() {
            if (typeof performance !== "undefined" && typeof performance.now === "function") return performance.now();
            return Date.now();
          }

          function average(values = []) {
            if (!values.length) return 0;
            return values.reduce((sum, value) => sum + value, 0) / values.length;
          }

          function maximum(values = []) {
            if (!values.length) return 0;
            return Math.max(...values);
          }

          export class RuntimeDiagnostics {
            constructor({ sampleSize = 120, systemSampleStride = 6, clock = clockNow } = {}) {
              this.sampleSize = Math.max(10, Math.floor(Number(sampleSize) || 120));
              this.systemSampleStride = Math.max(1, Math.floor(Number(systemSampleStride) || 6));
              this.clock = typeof clock === "function" ? clock : clockNow;
              this.owners = new Map();
              this.systems = new Set();
              this.samples = [];
              this.frameStartedAt = null;
              this.maxFrameMs = 0;
              this.systemCallCounts = new Map();
              this.systemSamples = new Map();
              this.systemMaxMs = new Map();
            }

            claim(method, owner) {
              const key = String(method || "");
              const nextOwner = String(owner || "unknown");
              if (!key) return false;
              const existing = this.owners.get(key);
              if (existing && existing !== nextOwner) {
                throw new Error(`Runtime owner conflict for ${key}: ${existing} and ${nextOwner}`);
              }
              this.owners.set(key, nextOwner);
              return !existing;
            }

            registerSystem(name) {
              if (name) this.systems.add(String(name));
            }

            beginSystem(name) {
              const key = String(name || "");
              if (!key) return null;
              this.registerSystem(key);
              const calls = (this.systemCallCounts.get(key) || 0) + 1;
              this.systemCallCounts.set(key, calls);
              if ((calls - 1) % this.systemSampleStride !== 0) return null;
              return this.clock();
            }

            endSystem(name, startedAt) {
              if (startedAt == null) return 0;
              const key = String(name || "");
              if (!key) return 0;
              const elapsed = Math.max(0, this.clock() - startedAt);
              const samples = this.systemSamples.get(key) || [];
              samples.push(elapsed);
              if (samples.length > this.sampleSize) samples.shift();
              this.systemSamples.set(key, samples);
              this.systemMaxMs.set(key, Math.max(this.systemMaxMs.get(key) || 0, elapsed));
              return elapsed;
            }

            beginFrame() {
              this.frameStartedAt = this.clock();
            }

            endFrame() {
              if (this.frameStartedAt == null) return 0;
              const elapsed = Math.max(0, this.clock() - this.frameStartedAt);
              this.frameStartedAt = null;
              this.samples.push(elapsed);
              if (this.samples.length > this.sampleSize) this.samples.shift();
              this.maxFrameMs = Math.max(this.maxFrameMs, elapsed);
              return elapsed;
            }

            averageFrameMs() {
              return average(this.samples);
            }

            recentMaxFrameMs() {
              return maximum(this.samples);
            }

            systemTimingSnapshot() {
              const timings = {};
              for (const name of [...this.systems].sort()) {
                const samples = this.systemSamples.get(name) || [];
                if (!samples.length) continue;
                timings[name] = {
                  calls: this.systemCallCounts.get(name) || 0,
                  samples: samples.length,
                  averageMs: Number(average(samples).toFixed(3)),
                  recentMaxMs: Number(maximum(samples).toFixed(3)),
                  maxMs: Number((this.systemMaxMs.get(name) || 0).toFixed(3))
                };
              }
              return timings;
            }

            slowestSystems(limit = 5) {
              return Object.entries(this.systemTimingSnapshot())
                .map(([name, timing]) => ({ name, ...timing }))
                .sort((a, b) => (
                  b.averageMs - a.averageMs
                  || b.recentMaxMs - a.recentMaxMs
                  || a.name.localeCompare(b.name)
                ))
                .slice(0, Math.max(0, Math.floor(Number(limit) || 0)));
            }

            snapshot() {
              return {
                owners: Object.fromEntries(this.owners),
                systems: [...this.systems].sort(),
                samples: this.samples.length,
                averageFrameMs: Number(this.averageFrameMs().toFixed(3)),
                recentMaxFrameMs: Number(this.recentMaxFrameMs().toFixed(3)),
                maxFrameMs: Number(this.maxFrameMs.toFixed(3)),
                systemSampleStride: this.systemSampleStride,
                systemTimings: this.systemTimingSnapshot(),
                slowestSystems: this.slowestSystems(),
                conflicts: []
              };
            }

            expose(target = globalThis) {
              if (!target) return;
              target.NBD_RUNTIME_DIAGNOSTICS = this;
            }

            summary() {
              const avg = this.averageFrameMs();
              const recentMax = this.recentMaxFrameMs();
              const hot = this.slowestSystems(1)[0];
              const hotspot = hot ? ` · hot ${hot.name} ${hot.averageMs.toFixed(2)} ms` : "";
              return `Runtime ${this.systems.size} systems · frame ${avg.toFixed(2)} ms avg / ${recentMax.toFixed(2)} ms recent max · ${this.owners.size} owned methods${hotspot}`;
            }
          }
          ''', encoding='utf-8')

          runtime = Path('phaser/src/runtime/GameplayRuntime.js')
          text = runtime.read_text(encoding='utf-8')
          old = '''    const dt = Math.min(Math.max(0, Number(deltaMs) || 0) / 1000, 0.05);\n    RawAudio.beginVehicleEngineFrame({ paused: Boolean(scene.registry?.get?.("uiPaused")) });\n\n    scene.cityStreamSystem?.update?.();\n    scene.districtPackSystem?.update?.();\n    scene.entityStreamSystem?.update?.(dt);\n    scene.distantSimulationSystem?.update?.(dt);\n    scene.macroTrafficPoliceSystem?.update?.(dt);\n    scene.trafficMaterializationSystem?.update?.(dt);\n    scene.trafficOccupantWitnessSystem?.update?.(dt);\n    scene.trafficLocalBehaviorSystem?.update?.(dt);\n    scene.trafficPhysicalConsequencesSystem?.update?.(dt);\n    scene.trafficImpactConsequencesSystem?.update?.(dt);\n    scene.motorizedPoliceSystem?.update?.(dt);\n    scene.pedestrianSystem?.update?.(dt);\n'''
          new = '''    const dt = Math.min(Math.max(0, Number(deltaMs) || 0) / 1000, 0.05);\n    const diagnostics = this.diagnostics;\n    let profileMark;\n    RawAudio.beginVehicleEngineFrame({ paused: Boolean(scene.registry?.get?.("uiPaused")) });\n\n    profileMark = diagnostics.beginSystem("StreamingPipeline");\n    scene.cityStreamSystem?.update?.();\n    scene.districtPackSystem?.update?.();\n    scene.entityStreamSystem?.update?.(dt);\n    scene.distantSimulationSystem?.update?.(dt);\n    diagnostics.endSystem("StreamingPipeline", profileMark);\n\n    profileMark = diagnostics.beginSystem("TrafficPipeline");\n    scene.macroTrafficPoliceSystem?.update?.(dt);\n    scene.trafficMaterializationSystem?.update?.(dt);\n    scene.trafficOccupantWitnessSystem?.update?.(dt);\n    scene.trafficLocalBehaviorSystem?.update?.(dt);\n    scene.trafficPhysicalConsequencesSystem?.update?.(dt);\n    scene.trafficImpactConsequencesSystem?.update?.(dt);\n    diagnostics.endSystem("TrafficPipeline", profileMark);\n\n    profileMark = diagnostics.beginSystem("MotorizedPoliceSystem");\n    scene.motorizedPoliceSystem?.update?.(dt);\n    diagnostics.endSystem("MotorizedPoliceSystem", profileMark);\n\n    profileMark = diagnostics.beginSystem("PedestrianSystem");\n    scene.pedestrianSystem?.update?.(dt);\n    diagnostics.endSystem("PedestrianSystem", profileMark);\n'''
          if text.count(old) != 1:
              raise SystemExit('GameplayRuntime update pipeline anchor mismatch')
          text = text.replace(old, new)

          old = '''    try {\n      super.update(time, deltaMs);\n    } finally {\n      if (input && originalBeginFrame) input.beginFrame = originalBeginFrame;\n      if (originalCollectInteractions) scene.collectInteractions = originalCollectInteractions;\n      RawAudio.endVehicleEngineFrame();\n    }\n    scene.territoryRuntimeSystem?.update?.();\n'''
          new = '''    profileMark = diagnostics.beginSystem("GameplayRuntimeCore");\n    try {\n      super.update(time, deltaMs);\n    } finally {\n      diagnostics.endSystem("GameplayRuntimeCore", profileMark);\n      if (input && originalBeginFrame) input.beginFrame = originalBeginFrame;\n      if (originalCollectInteractions) scene.collectInteractions = originalCollectInteractions;\n      RawAudio.endVehicleEngineFrame();\n    }\n\n    profileMark = diagnostics.beginSystem("TerritoryRuntimeSystem");\n    scene.territoryRuntimeSystem?.update?.();\n    diagnostics.endSystem("TerritoryRuntimeSystem", profileMark);\n'''
          if text.count(old) != 1:
              raise SystemExit('GameplayRuntime core anchor mismatch')
          runtime.write_text(text.replace(old, new), encoding='utf-8')

          core = Path('phaser/src/runtime/GameplayRuntimeCore.js')
          text = core.read_text(encoding='utf-8')
          old = '''    this.diagnostics = new RuntimeDiagnostics({ sampleSize: 180 });\n    this.installDiagnostics();\n\n    scene.inputSystem?.destroy?.();\n'''
          new = '''    this.diagnostics = new RuntimeDiagnostics({ sampleSize: 180, systemSampleStride: 6 });\n    this.installDiagnostics();\n    this.nextDiagnosticsPublishAt = 0;\n    this.cachedRuntimeText = "";\n    this.cachedPerformanceText = "";\n    this.cachedRuntimeDiagnostics = null;\n\n    scene.inputSystem?.destroy?.();\n'''
          if text.count(old) != 1:
              raise SystemExit('GameplayRuntimeCore constructor anchor mismatch')
          text = text.replace(old, new)

          old = '''    this.diagnostics.beginFrame();\n    scene.deathRecoverySystem?.update?.(dt);\n\n    const rawFrame = scene.inputSystem?.beginFrame() || createEmptyInputFrame();\n    scene.playerDamageSystem?.preUpdate(rawFrame);\n    const frame = scene.playerDamageSystem?.filterFrame(rawFrame) || rawFrame;\n    scene.currentInputFrame = frame;\n    scene.aiStateSystem?.preUpdate?.(dt, frame);\n    scene.weaponSystem?.update(frame);\n'''
          new = '''    this.diagnostics.beginFrame();\n    let profileMark = this.diagnostics.beginSystem("InputPipeline");\n    scene.deathRecoverySystem?.update?.(dt);\n\n    const rawFrame = scene.inputSystem?.beginFrame() || createEmptyInputFrame();\n    scene.playerDamageSystem?.preUpdate(rawFrame);\n    const frame = scene.playerDamageSystem?.filterFrame(rawFrame) || rawFrame;\n    scene.currentInputFrame = frame;\n    scene.aiStateSystem?.preUpdate?.(dt, frame);\n    scene.weaponSystem?.update(frame);\n    this.diagnostics.endSystem("InputPipeline", profileMark);\n'''
          if text.count(old) != 1:
              raise SystemExit('GameplayRuntimeCore input anchor mismatch')
          text = text.replace(old, new)

          old = '''    scene.handleLayerDebugInput(frame);\n    scene.powersSystem.update(dt, frame);\n    scene.combatSystem?.update(dt, frame);\n    scene.drainSystem?.update(dt, frame);\n\n    let availableActions = this.filterActions(scene.collectInteractions());\n    let split = splitActions(availableActions);\n    scene.nearestMovement = nearest(scene, split.movement);\n    scene.nearestInteraction = nearest(scene, split.interaction);\n'''
          new = '''    profileMark = this.diagnostics.beginSystem("CombatPipeline");\n    scene.handleLayerDebugInput(frame);\n    scene.powersSystem.update(dt, frame);\n    scene.combatSystem?.update(dt, frame);\n    scene.drainSystem?.update(dt, frame);\n    this.diagnostics.endSystem("CombatPipeline", profileMark);\n\n    profileMark = this.diagnostics.beginSystem("InteractionQueryPipeline");\n    let availableActions = this.filterActions(scene.collectInteractions());\n    let split = splitActions(availableActions);\n    scene.nearestMovement = nearest(scene, split.movement);\n    scene.nearestInteraction = nearest(scene, split.interaction);\n    this.diagnostics.endSystem("InteractionQueryPipeline", profileMark);\n'''
          if text.count(old) != 1:
              raise SystemExit('GameplayRuntimeCore combat anchor mismatch')
          text = text.replace(old, new)

          old = '''      if (scene.feedingSystem.isActive()) {\n        scene.witnessSystem.update(dt);\n        scene.feedingSystem.update(dt, frame.hasMovementIntent);\n        scene.npcSystem.update(0);\n      } else {\n        const movementBlocked = scene.combatSystem?.blocksMovement() || scene.playerDamageSystem?.blocksMovement();\n        if (!movementBlocked) {\n          const leaving = scene.outskirtsSystem?.isTryingToLeave?.(frame);\n          scene.updatePlayerMovement(dt, frame);\n          if (leaving) void scene.outskirtsSystem?.warnBoundary?.();\n        }\n        scene.npcSystem.update(dt);\n        scene.witnessSystem.update(dt);\n      }\n\n      scene.evidenceSystem.update(dt);\n      scene.heatSystem?.cool?.(dt);\n      scene.exposureSystem.cool(dt);\n      scene.policeSystem.update(dt);\n      scene.policeFirearmSystem?.update(dt, frame);\n      scene.hunterSystem.update(dt);\n      scene.npcSystem.rebuildSpatialIndex?.();\n      scene.aiStateSystem?.postUpdate?.(dt, frame);\n      scene.playerDamageSystem?.postUpdate(dt, frame);\n      scene.missionSystem.update();\n      scene.tutorialDirector?.update?.(dt, frame);\n'''
          new = '''      profileMark = this.diagnostics.beginSystem("NpcWitnessPipeline");\n      if (scene.feedingSystem.isActive()) {\n        scene.witnessSystem.update(dt);\n        scene.feedingSystem.update(dt, frame.hasMovementIntent);\n        scene.npcSystem.update(0);\n      } else {\n        const movementBlocked = scene.combatSystem?.blocksMovement() || scene.playerDamageSystem?.blocksMovement();\n        if (!movementBlocked) {\n          const leaving = scene.outskirtsSystem?.isTryingToLeave?.(frame);\n          scene.updatePlayerMovement(dt, frame);\n          if (leaving) void scene.outskirtsSystem?.warnBoundary?.();\n        }\n        scene.npcSystem.update(dt);\n        scene.witnessSystem.update(dt);\n      }\n      this.diagnostics.endSystem("NpcWitnessPipeline", profileMark);\n\n      profileMark = this.diagnostics.beginSystem("WorldStatePipeline");\n      scene.evidenceSystem.update(dt);\n      scene.heatSystem?.cool?.(dt);\n      scene.exposureSystem.cool(dt);\n      this.diagnostics.endSystem("WorldStatePipeline", profileMark);\n\n      profileMark = this.diagnostics.beginSystem("PoliceHunterPipeline");\n      scene.policeSystem.update(dt);\n      scene.policeFirearmSystem?.update(dt, frame);\n      scene.hunterSystem.update(dt);\n      this.diagnostics.endSystem("PoliceHunterPipeline", profileMark);\n\n      profileMark = this.diagnostics.beginSystem("PostWorldPipeline");\n      scene.npcSystem.rebuildSpatialIndex?.();\n      scene.aiStateSystem?.postUpdate?.(dt, frame);\n      scene.playerDamageSystem?.postUpdate(dt, frame);\n      scene.missionSystem.update();\n      scene.tutorialDirector?.update?.(dt, frame);\n      this.diagnostics.endSystem("PostWorldPipeline", profileMark);\n'''
          if text.count(old) != 1:
              raise SystemExit('GameplayRuntimeCore world anchor mismatch')
          text = text.replace(old, new)

          start = text.index('  finishFrame() {')
          end = text.index('\n  handleLayerDebugInput', start)
          old_finish = text[start:end]
          new_finish = '''  finishFrame() {\n    const scene = this.scene;\n    const profileMark = this.diagnostics.beginSystem("PresentationPipeline");\n    const cinematicOwnsCamera = Boolean(\n      scene.taskRevealCinematic?.active\n      || scene.registry?.get?.("taskRevealActive")\n    );\n    if (!cinematicOwnsCamera) scene.updateCameraForLayer();\n    scene.outskirtsSystem?.updatePresentation?.();\n    scene.objectiveMarkerSystem?.update?.(scene.time?.now || 0);\n    scene.drawPromptMarker();\n    this.diagnostics.endSystem("PresentationPipeline", profileMark);\n\n    const frameMs = this.diagnostics.endFrame();\n    const now = Number(scene.time?.now) || 0;\n    if (this.cachedRuntimeDiagnostics == null || now >= this.nextDiagnosticsPublishAt) {\n      this.nextDiagnosticsPublishAt = now + 250;\n      this.cachedRuntimeText = this.diagnostics.summary();\n      this.cachedPerformanceText = `Frame ${frameMs.toFixed(2)} ms · spatial NPCs ${scene.npcSystem?.spatial?.size?.() || 0}`;\n      this.cachedRuntimeDiagnostics = this.diagnostics.snapshot();\n    }\n    scene.statePublisher?.setMany?.({\n      runtimeText: this.cachedRuntimeText,\n      performanceText: this.cachedPerformanceText,\n      runtimeDiagnostics: this.cachedRuntimeDiagnostics\n    });\n    scene.publishState();\n  }\n'''
          text = text[:start] + new_finish + text[end:]
          core.write_text(text, encoding='utf-8')

          test_file = Path('tests/runtime-performance-diagnostics.test.js')
          test_file.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { RuntimeDiagnostics } from "../phaser/src/runtime/RuntimeDiagnostics.js";

          const source = path => readFileSync(new URL(`../${path}`, import.meta.url), "utf8");

          test("RuntimeDiagnostics samples named wall time at a bounded cadence", () => {
            let now = 0;
            const diagnostics = new RuntimeDiagnostics({
              sampleSize: 10,
              systemSampleStride: 2,
              clock: () => now
            });

            let mark = diagnostics.beginSystem("TrafficPipeline");
            assert.equal(mark, 0);
            now = 4;
            assert.equal(diagnostics.endSystem("TrafficPipeline", mark), 4);

            now = 10;
            assert.equal(diagnostics.beginSystem("TrafficPipeline"), null);

            now = 20;
            mark = diagnostics.beginSystem("TrafficPipeline");
            assert.equal(mark, 20);
            now = 26;
            assert.equal(diagnostics.endSystem("TrafficPipeline", mark), 6);

            const snapshot = diagnostics.snapshot();
            assert.equal(snapshot.systemSampleStride, 2);
            assert.deepEqual(snapshot.systemTimings.TrafficPipeline, {
              calls: 3,
              samples: 2,
              averageMs: 5,
              recentMaxMs: 6,
              maxMs: 6
            });
          });

          test("RuntimeDiagnostics ranks the slowest measured pipelines", () => {
            let now = 0;
            const diagnostics = new RuntimeDiagnostics({ systemSampleStride: 1, clock: () => now });
            const record = (name, duration) => {
              const mark = diagnostics.beginSystem(name);
              now += duration;
              diagnostics.endSystem(name, mark);
            };

            record("StreamingPipeline", 2);
            record("TrafficPipeline", 7);
            record("PedestrianSystem", 4);

            assert.deepEqual(
              diagnostics.slowestSystems(3).map(entry => entry.name),
              ["TrafficPipeline", "PedestrianSystem", "StreamingPipeline"]
            );
            assert.match(diagnostics.summary(), /hot TrafficPipeline 7\.00 ms/);
          });

          test("gameplay runtime profiles the major pipelines with low-overhead markers", () => {
            const runtime = source("phaser/src/runtime/GameplayRuntime.js");
            const core = source("phaser/src/runtime/GameplayRuntimeCore.js");

            for (const name of [
              "StreamingPipeline",
              "TrafficPipeline",
              "MotorizedPoliceSystem",
              "PedestrianSystem",
              "GameplayRuntimeCore",
              "TerritoryRuntimeSystem"
            ]) assert.match(runtime, new RegExp(`beginSystem\\("${name}"\\)`));

            for (const name of [
              "InputPipeline",
              "CombatPipeline",
              "InteractionQueryPipeline",
              "NpcWitnessPipeline",
              "WorldStatePipeline",
              "PoliceHunterPipeline",
              "PostWorldPipeline",
              "PresentationPipeline"
            ]) assert.match(core, new RegExp(`beginSystem\\("${name}"\\)`));

            assert.match(core, /systemSampleStride: 6/);
          });

          test("heavy runtime diagnostic snapshots publish at four hertz instead of every frame", () => {
            const core = source("phaser/src/runtime/GameplayRuntimeCore.js");
            assert.match(core, /nextDiagnosticsPublishAt = 0/);
            assert.match(core, /now >= this\.nextDiagnosticsPublishAt/);
            assert.match(core, /this\.nextDiagnosticsPublishAt = now \+ 250/);
            assert.equal((core.match(/this\.diagnostics\.snapshot\(\)/g) || []).length, 1);
          });
          ''', encoding='utf-8')

          docs = Path('docs/PERFORMANCE_REVIEW.md')
          doc = docs.read_text(encoding='utf-8')
          marker = '## Pass 2 — bounded runtime pipeline timing'
          if marker in doc:
              raise SystemExit('Performance Pass 2 already documented')
          doc += r'''

          ## Pass 2 — bounded runtime pipeline timing

          **State: implemented; pending in-game browser capture and ranking.**

          ### Instrumentation contract

          `RuntimeDiagnostics` now samples named wall-time pipelines with `performance.now()` at a bounded cadence: one sample every **6 invocations per named pipeline**. Sampling is independent per pipeline, so traffic, pedestrians and core gameplay cannot starve each other because of call ordering. The runtime snapshot exposes average, recent maximum, lifetime maximum, call count and sample count, plus a ranked `slowestSystems` list.

          The first coarse-grained categories are `StreamingPipeline`, `TrafficPipeline`, `MotorizedPoliceSystem`, `PedestrianSystem`, `GameplayRuntimeCore`, `TerritoryRuntimeSystem`, `InputPipeline`, `CombatPipeline`, `InteractionQueryPipeline`, `NpcWitnessPipeline`, `WorldStatePipeline`, `PoliceHunterPipeline`, `PostWorldPipeline` and `PresentationPipeline`. The purpose is to identify the dominant browser-time owner before another subsystem is optimized; a winning pipeline should be drilled down in the next pass rather than guessed at.

          ### Allocation-pressure reduction

          The heavy nested diagnostics snapshot and runtime summary are now republished at **4 Hz (250 ms)** instead of being rebuilt every render frame. At a 60 FPS target this reduces those diagnostic snapshot constructions from roughly **60 per second to 4 per second — 93.3% fewer** — while frame timing itself continues every frame and gameplay systems remain untouched.

          ### Playtest capture

          In the hitch-prone area, inspect `window.NBD_RUNTIME_DIAGNOSTICS.snapshot()` after at least several seconds of normal driving/walking and compare `slowestSystems`, `systemTimings`, average frame time and recent max frame time. The next optimization must target the top repeatable pipeline from that capture. Pass 1 remains the deterministic proof that pedestrian broadphase scaling was poor; Pass 2 provides the browser wall-time evidence needed to rank it against traffic, streaming, police, interaction queries and presentation.
          '''
          docs.write_text(doc, encoding='utf-8')
          PY

      - name: Run focused performance tests
        run: node --test tests/runtime-performance-diagnostics.test.js tests/pedestrian-performance.test.js tests/runtime-consolidation.test.js

      - name: Run full unit suite and preserve known legacy baseline
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee unit-test.log
          status=${PIPESTATUS[0]}
          set -e
          failures=$(awk '/^# fail / { value=$3 } END { print value+0 }' unit-test.log)
          echo "unit exit=$status failures=$failures"
          if [ "$failures" -ne 9 ]; then
            echo "Expected the existing 9 legacy failures; refusing to commit a changed regression count."
            exit 1
          fi

      - name: Commit performance instrumentation
        run: |
          git config user.name "ViceBlood automation"
          git config user.email "actions@users.noreply.github.com"
          git add phaser/src/runtime/RuntimeDiagnostics.js phaser/src/runtime/GameplayRuntime.js phaser/src/runtime/GameplayRuntimeCore.js tests/runtime-performance-diagnostics.test.js docs/PERFORMANCE_REVIEW.md
          git commit -m "Profile runtime pipelines with bounded diagnostics"
          git push origin HEAD:audio/playtest-p0
