name: Apply Night Ledger panel

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Detect pending Night Ledger payload
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          for index in 01 02 03 04 05; do
            file=".github/night-ledger-payload.part-${index}"
            if [ ! -f "$file" ]; then
              echo 'apply=false' >> "$GITHUB_OUTPUT"
              echo "Missing payload block: $file"
              exit 0
            fi
          done
          echo 'apply=true' >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify Night Ledger patch
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'd97772b57d4bb15ee062999201386c23b205bb612d739149d995f208a866bae7  .github/night-ledger-payload.part-01' | sha256sum -c -
          echo 'a76ec991916ee72e5421bc564cfd95541e9d6c218a24d93dce6a63aab62cf8a4  .github/night-ledger-payload.part-02' | sha256sum -c -
          echo '57826a9ad718d413634db737799bcc5ebbce1e3b855e01985d365f72e5e09833  .github/night-ledger-payload.part-03' | sha256sum -c -
          echo '163a21a92b58226d8384aa49394d590d461aa9ea2c4c2781b0cb7b4dc58f0de2  .github/night-ledger-payload.part-04' | sha256sum -c -
          echo 'a49c0391a12d54ed2edf24e394ffbc337cc7ad79d7c7460b5281c578f7bd7a48  .github/night-ledger-payload.part-05' | sha256sum -c -

          cat .github/night-ledger-payload.part-* > /tmp/night-ledger.b64
          test "$(wc -c < /tmp/night-ledger.b64)" = '23100'
          echo '1cf1bad0db3e6cf666c91c7fa6f11f6ac5a22b80386428bc5d3dc0673d46176f  /tmp/night-ledger.b64' | sha256sum -c -

          base64 -d /tmp/night-ledger.b64 > /tmp/night-ledger.patch.gz
          test "$(wc -c < /tmp/night-ledger.patch.gz)" = '17325'
          echo '36ff86afb24d436220bec49b3b3d0a63339a28f91c1ce84c2a3fc9fe8819bcb4  /tmp/night-ledger.patch.gz' | sha256sum -c -
          gzip -t /tmp/night-ledger.patch.gz

          gzip -dc /tmp/night-ledger.patch.gz > /tmp/night-ledger.patch
          test "$(wc -c < /tmp/night-ledger.patch)" = '71521'
          echo '430eef66ee0f07163f48b3a257d73d2a57d90a002ec6ee0c812e1ed66d172511  /tmp/night-ledger.patch' | sha256sum -c -

      - name: Apply Night Ledger implementation
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-night-ledger-source.yml
          cp "$workflow" /tmp/night-ledger-workflow.yml
          rm -f "$workflow"
          git apply --check --exclude="$workflow" /tmp/night-ledger.patch
          git apply --exclude="$workflow" /tmp/night-ledger.patch
          rm -f .github/night-ledger-payload.part-*
          python <<'PY'
          from pathlib import Path
          path = Path('phaser/styles.css')
          path.write_text(path.read_text().rstrip() + '\n')
          PY

      - name: Install exact dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Check JavaScript syntax
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find phaser tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)

      - name: Run unit regression
        if: steps.gate.outputs.apply == 'true'
        run: node --test tests/*.test.js

      - name: Validate city topology
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:validate

      - name: Compile current city
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:compile -- --output-dir=/tmp/viceblood-night-ledger-city

      - name: Compile Foundry candidates
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:foundry -- --output-dir=/tmp/viceblood-night-ledger-foundry

      - name: Verify patch quality
        if: steps.gate.outputs.apply == 'true'
        run: git diff --check

      - name: Publish validated Night Ledger tree
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-night-ledger-source.yml
          mkdir -p .github/workflows
          mv /tmp/night-ledger-workflow.yml "$workflow"

          python <<'PY'
          import base64
          import json
          import os
          import stat
          import subprocess
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["TARGET_BRANCH"]

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def paths_from_git(*args):
              raw = subprocess.check_output(args)
              return [item.decode() for item in raw.split(b"\0") if item]

          def request(method, path, payload):
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent = command("git", "rev-parse", "HEAD")
          base_tree = command("git", "rev-parse", "HEAD^{tree}")
          changed = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=ACMRTUXB", "HEAD"
          )
          changed += paths_from_git("git", "ls-files", "--others", "--exclude-standard", "-z")
          deleted = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=D", "HEAD"
          )

          entries = []
          for path in sorted(set(changed)):
              with open(path, "rb") as source:
                  content = base64.b64encode(source.read()).decode("ascii")
              blob = request("POST", "/git/blobs", {"content": content, "encoding": "base64"})
              mode = "100755" if os.stat(path).st_mode & stat.S_IXUSR else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          for path in sorted(set(deleted)):
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})

          tree = request("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Add paused Night Ledger panel",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          ref = urllib.parse.quote(f"heads/{branch}", safe="/")
          request("PATCH", f"/git/refs/{ref}", {"sha": commit["sha"], "force": False})
          print(f"Published Night Ledger commit {commit['sha']}")
          PY
