name: Import verified handoff objects
on:
  push:
    branches: [codex/fast-boot-recovery]
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 880431fbe9373832ca896cf66884cf23bdeed059
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {createHash}=require('node:crypto');
            const {gunzipSync}=require('node:zlib');
            const {execFileSync}=require('node:child_process');
            const blob=b=>createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${b.length}\0`),b])).digest('hex');
            const shas=['5111500f768d6bee3b07f47a8aa18095b4261848','456c8d3561786ddf02c335b2ad24019325ecbacb'];
            const parts=[];
            for(const sha of shas){
              const {data}=await github.rest.git.getBlob({...context.repo,file_sha:sha});
              const b=Buffer.from(data.content,'base64');if(blob(b)!==sha)throw new Error('Transport hash mismatch');parts.push(b);
            }
            // Correct the identified one-character transfer typo; require the
            // original locally calculated object hash and complete patch hash.
            const encoded=parts[1].toString('base64');
            if(!encoded.includes('Wif9LpBpRlptbph'))throw new Error('Unexpected transfer');
            parts[1]=Buffer.from(encoded.replace('Wif9LpBpRlptbph','Wif9LpBpzlptbph'),'base64');
            if(blob(parts[1])!=='7e45a80b655016739f99eb12a85f4b9ca10a6409')throw new Error('Repaired transport mismatch');
            const packed=Buffer.concat(parts);
            if(createHash('sha256').update(packed).digest('hex')!=='0e4edc269579b1921d01c5057d7eef8af46430fe00de3d628bcbc4cab1444afd')throw new Error('Patch digest mismatch');
            const patch=gunzipSync(packed);
            execFileSync('git',['apply','--index','--check','-'],{input:patch});
            execFileSync('git',['apply','--index','-'],{input:patch});
            const tree=execFileSync('git',['write-tree'],{encoding:'utf8'}).trim();
            if(tree!=='9c3d108355fb281a6746dcb9dee3fc7ad4baf3d5')throw new Error('Not the validated source tree');
            const paths=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');
            if(paths.length!==11||paths.some(p=>!p.match(/^(phaser\/src\/|tests\/|ui\/|tools\/boot\/|docs\/)/)))throw new Error('Unexpected scope');
            for(const path of paths){
              const bytes=execFileSync('git',['show',`:${path}`]);
              const {data}=await github.rest.git.createBlob({...context.repo,content:bytes.toString('base64'),encoding:'base64'});
              if(data.sha!==blob(bytes))throw new Error(`Uploaded mismatch: ${path}`);
              core.info(`${path}: ${data.sha}`);
            }
            core.info(`Imported 11 verified immutable blobs. Source tree ${tree}. No branch, PR, main or deployment updates.`);
