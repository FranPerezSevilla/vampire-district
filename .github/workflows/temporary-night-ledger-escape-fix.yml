name: Apply Night Ledger Escape fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Detect pending fix
        id: gate
        shell: bash
        run: |
          if [ -f .github/night-ledger-escape.patch.b64 ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and apply Escape fix
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/night-ledger-escape.patch.b64
          workflow=.github/workflows/temporary-night-ledger-escape-fix.yml
          test "$(wc -c < "$payload")" = '724'
          echo '2f0956d0b1bea4567ed2405667a575b544e2f8210b2773cf5018e7f713fef2fa  .github/night-ledger-escape.patch.b64' | sha256sum -c -
          base64 -d "$payload" > /tmp/night-ledger-escape.patch
          test "$(wc -c < /tmp/night-ledger-escape.patch)" = '543'
          echo '51fcefee45d2e3a133a21b4682dce60c383734838642ade474205c353942ddf5  /tmp/night-ledger-escape.patch' | sha256sum -c -
          cp "$workflow" /tmp/night-ledger-escape-workflow.yml
          rm -f "$workflow"
          git apply --check /tmp/night-ledger-escape.patch
          git apply /tmp/night-ledger-escape.patch
          rm -f "$payload"
          node --check phaser/src/scenes/UIScene.js
          git diff --check

      - name: Install browser dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Install Chromium
        if: steps.gate.outputs.apply == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate Night Ledger keyboard close
        if: steps.gate.outputs.apply == 'true'
        run: npx playwright test tests/browser/night-ledger.spec.js --project=chromium

      - name: Publish validated Escape fix
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-night-ledger-escape-fix.yml
          mkdir -p .github/workflows
          mv /tmp/night-ledger-escape-workflow.yml "$workflow"

          python <<'PY'
          import base64
          import json
          import os
          import stat
          import subprocess
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["TARGET_BRANCH"]

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def paths_from_git(*args):
              raw = subprocess.check_output(args)
              return [item.decode() for item in raw.split(b"\0") if item]

          def request(method, path, payload):
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent = command("git", "rev-parse", "HEAD")
          base_tree = command("git", "rev-parse", "HEAD^{tree}")
          changed = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=ACMRTUXB", "HEAD"
          )
          changed += paths_from_git("git", "ls-files", "--others", "--exclude-standard", "-z")
          deleted = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=D", "HEAD"
          )

          entries = []
          for path in sorted(set(changed)):
              with open(path, "rb") as source:
                  content = base64.b64encode(source.read()).decode("ascii")
              blob = request("POST", "/git/blobs", {"content": content, "encoding": "base64"})
              mode = "100755" if os.stat(path).st_mode & stat.S_IXUSR else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          for path in sorted(set(deleted)):
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})

          tree = request("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Allow Escape to close Night Ledger",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          ref = urllib.parse.quote(f"heads/{branch}", safe="/")
          request("PATCH", f"/git/refs/{ref}", {"sha": commit["sha"], "force": False})
          print(f"Published Escape fix {commit['sha']}")
          PY
