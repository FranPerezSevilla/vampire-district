name: Import verified session-only demo source
on:
  push:
    branches: [codex/session-source-export]
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2e8effa03647d827a191d0a0ac32001d8c6a597b
          persist-credentials: false
      - name: Import reviewed immutable source objects without changing application refs
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs/promises');
            const {dirname}=require('node:path');
            const {createHash}=require('node:crypto');
            const {brotliDecompressSync}=require('node:zlib');
            const {execFileSync}=require('node:child_process');
            const {owner,repo}=context.repo;
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const hash=b=>createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${b.length}\0`),b])).digest('hex');
            const base='2e8effa03647d827a191d0a0ac32001d8c6a597b',tree='e415f8a72c33b2b0743809b83818f141ad632545';
            if(`${owner}/${repo}`!=='FranPerezSevilla/vampire-district'||git('rev-parse','HEAD')!==base)throw new Error('Wrong base');
            const {data}=await github.rest.git.getBlob({owner,repo,file_sha:'fbc536a5e72bc5d37733c77eec2724d905f8d699'});
            if(data.encoding!=='base64')throw new Error('Unexpected encoding');
            const packed=Buffer.from(data.content,'base64');
            if(hash(packed)!=='fbc536a5e72bc5d37733c77eec2724d905f8d699')throw new Error('Transport mismatch');
            const raw=brotliDecompressSync(packed);
            if(createHash('sha256').update(raw).digest('hex')!=='a328eac40a689fc662c8c3752307c5a41931d9f0182a03ecbcc791576fc46859')throw new Error('Payload mismatch');
            const payload=JSON.parse(raw);
            if(payload.base!==base||payload.tree!==tree)throw new Error('Wrong source identity');
            const allowed=['docs/FIRST_BUSINESS_DEMO.md','docs/SESSION_ONLY_DEMO.md','index.html','phaser/index.html','phaser/src/boot/BootProfile.js','phaser/src/campaign/preload.js','tests/boot-profile.test.js','tests/browser/free-roam-baseline.spec.js','tests/campaign-bootstrap.test.js','tests/free-roam-baseline.test.js','tests/main-menu.test.js','tests/session-only-boot.test.js','tools/boot/smoke-module.mjs'];
            if(payload.files.length!==allowed.length||new Set(payload.files.map(f=>f.path)).size!==allowed.length)throw new Error('Unexpected scope');
            for(const f of payload.files){
              if(!allowed.includes(f.path))throw new Error('Unexpected path');
              let old=Buffer.alloc(0);
              if(f.old){old=await fs.readFile(f.path);if(hash(old)!==f.old)throw new Error('Old source mismatch');}
              else{try{await fs.stat(f.path);throw new Error('New path exists');}catch(e){if(e.code!=='ENOENT')throw e;}}
              const points=Array.from(old.toString('utf8')),output=[];let cursor=0;
              for(const [start,end,insert] of f.edits){
                if(!Number.isInteger(start)||!Number.isInteger(end)||start<cursor||end<start||end>points.length||typeof insert!=='string')throw new Error('Invalid edit');
                output.push(points.slice(cursor,start).join(''),insert);cursor=end;
              }
              output.push(points.slice(cursor).join(''));const bytes=Buffer.from(output.join(''));
              if(hash(bytes)!==f.sha)throw new Error(`New source mismatch: ${f.path}`);
              await fs.mkdir(dirname(f.path),{recursive:true});await fs.writeFile(f.path,bytes);git('add','--',f.path);
            }
            git('diff','--cached','--check');if(git('write-tree')!==tree)throw new Error('Final tree mismatch');
            const entries=[];
            for(const f of payload.files){
              const bytes=await fs.readFile(f.path);let created;
              for(let attempt=0;attempt<3;attempt++){
                try{created=(await github.rest.git.createBlob({owner,repo,content:bytes.toString('base64'),encoding:'base64'})).data;break;}
                catch(e){if(attempt===2||!(e.status>=500))throw e;await new Promise(r=>setTimeout(r,1000*(attempt+1)));}
              }
              if(created.sha!==f.sha)throw new Error('Upload mismatch');entries.push({path:f.path,mode:'100644',type:'blob',sha:f.sha});
            }
            await fs.writeFile('session-source-import.json',JSON.stringify({base,tree,entries},null,2));
            core.info(`Verified ${entries.length} source blobs. No application ref, deployment, main or PR changes. No imported source executed.`);
      - uses: actions/upload-artifact@v4
        with:
          name: session-source-import
          path: session-source-import.json
          retention-days: 2
