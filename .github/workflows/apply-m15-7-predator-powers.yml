name: Apply Milestone 15.7 predator powers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m15-7-publisher-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/blood-sense-whisper-beast'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Detect complete predator-powers payload
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          required=(
            .github/m15-7-final.part-01a
            .github/m15-7-final.part-01b
            .github/m15-7-final.part-02
            .github/m15-7-final.part-03
            .github/m15-7-final.part-04
          )
          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo 'apply=false' >> "$GITHUB_OUTPUT"
              echo "Waiting for $file"
              exit 0
            fi
          done
          echo 'apply=true' >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct, verify and apply implementation
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/m15-7-final.part-01a \
            .github/m15-7-final.part-01b \
            .github/m15-7-final.part-02 \
            .github/m15-7-final.part-03 \
            .github/m15-7-final.part-04 \
            > /tmp/m15-7.b64

          wc -c /tmp/m15-7.b64
          sha256sum /tmp/m15-7.b64
          test "$(wc -c < /tmp/m15-7.b64)" = '42108'
          echo '3bb322b27f05f12d661c46ea171debd01ab36e2138ce4f635038ee7b0b0853ca  /tmp/m15-7.b64' | sha256sum -c -

          base64 -d /tmp/m15-7.b64 > /tmp/m15-7.patch.gz
          test "$(wc -c < /tmp/m15-7.patch.gz)" = '31580'
          echo 'c6fcadd8f73d2f20bc8ee1b9969226794d99bd1b812974e00f27cca175ea2ac5  /tmp/m15-7.patch.gz' | sha256sum -c -
          gzip -t /tmp/m15-7.patch.gz

          gzip -dc /tmp/m15-7.patch.gz > /tmp/m15-7.patch
          test "$(wc -c < /tmp/m15-7.patch)" = '124496'
          echo '27b602a3323253b25af770d5fab57e362f3c4d3b2cb6c25bcbb1789a517247e4  /tmp/m15-7.patch' | sha256sum -c -

          git apply --check /tmp/m15-7.patch
          git apply /tmp/m15-7.patch

          rm -f \
            .github/m15-7-final.part-01 \
            .github/m15-7-final.part-01a \
            .github/m15-7-final.part-01b \
            .github/m15-7-final.part-02 \
            .github/m15-7-final.part-03 \
            .github/m15-7-final.part-04 \
            .github/workflows/apply-m15-7-predator-powers.yml

      - name: Install exact dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Check JavaScript syntax
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find phaser tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)

      - name: Run unit regression
        if: steps.gate.outputs.apply == 'true'
        run: npm test

      - name: Validate and compile city
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run city:validate
          npm run city:compile -- --output-dir=/tmp/viceblood-m15-7-city
          npm run city:foundry -- --output-dir=/tmp/viceblood-m15-7-foundry

      - name: Verify patch quality
        if: steps.gate.outputs.apply == 'true'
        run: git diff --check

      - name: Commit and publish implementation
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Blood Sense, contextual Whisper and the Beast'
          git push origin "HEAD:${TARGET_BRANCH}"
