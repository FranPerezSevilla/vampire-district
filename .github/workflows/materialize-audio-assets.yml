name: Materialize staged audio assets
# Temporary retry hook for the skid integration; removed after this run.

on:
  push:
    branches:
      - "audio/**"
    paths:
      - ".github/workflows/materialize-audio-assets.yml"
      - "phaser/assets/audio/**/*.ogg"
      - "phaser/assets/audio/**/*.ogg.b64"
      - "phaser/assets/audio/**/*.ogg.b64.part-*"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Reassemble chunked binary payloads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t groups < <(
            find phaser/assets/audio -type f -name '*.ogg.b64.part-*' -print \
              | sed -E 's/\.part-[0-9]+$//' \
              | sort -u
          )
          for prefix in "${groups[@]}"; do
            parts=("${prefix}.part-"*)
            if [[ "${#parts[@]}" -eq 0 ]]; then continue; fi
            if [[ "$(basename "$(dirname "$prefix")")" == "_staging" ]]; then
              target="$(dirname "$(dirname "$prefix")")/$(basename "$prefix")"
            else
              target="$prefix"
            fi
            cat "${parts[@]}" > "$target"
            rm -f "${parts[@]}"
            echo "Reassembled $target from ${#parts[@]} chunk(s)"
          done
          find phaser/assets/audio -type d -name '_staging' -empty -delete

      - name: Decode staged OGG payloads
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' staged; do
            found=1
            output="${staged%.b64}"
            base64 --decode "$staged" > "$output"
            if [[ "$(head -c 4 "$output")" != "OggS" ]]; then
              echo "Invalid OGG payload: $staged" >&2
              exit 1
            fi
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$output"
            rm "$staged"
            echo "Materialized $output"
          done < <(find phaser/assets/audio -type f -name '*.ogg.b64' -print0)
          if [[ "$found" -eq 0 ]]; then echo "No staged OGG payloads found."; fi

      - name: Generate browser-compatible runtime mirrors
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' ogg; do
            found=1
            mp3="${ogg%.ogg}.mp3"
            ffmpeg -nostdin -hide_banner -loglevel error -y -i "$ogg" -map_metadata -1 -ac 1 -ar 44100 -codec:a libmp3lame -q:a 4 "$mp3"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$mp3"
            if [[ "$ogg" == *-loop-*.ogg ]]; then
              wav="${ogg%.ogg}.wav"
              ffmpeg -nostdin -hide_banner -loglevel error -y -i "$ogg" -map_metadata -1 -ac 1 -ar 44100 -codec:a pcm_s16le "$wav"
              ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$wav"
            fi
          done < <(find phaser/assets/audio -type f -name '*.ogg' -print0)
          if [[ "$found" -eq 0 ]]; then echo "No OGG runtime assets found."; fi

      # TEMP_SKID_INTEGRATION_BEGIN
      - name: Integrate real vehicle skid loop
        shell: bash
        run: |
          set -euo pipefail
          node tools/_tmp-integrate-skid.mjs
          node --test tests/aggressive-driving-panic.test.js tests/vehicle-skid-audio.test.js tests/audio-sample-catalog.test.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate real vehicle skid loop"
          git push
      # TEMP_SKID_INTEGRATION_END

      - name: Commit generated audio binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/assets/audio
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Generate browser-compatible audio mirrors"
          git push
