name: Materialize staged audio assets

on:
  push:
    branches:
      - "audio/**"
    paths:
      - ".github/workflows/materialize-audio-assets.yml"
      - "phaser/assets/audio/**/*.ogg"
      - "phaser/assets/audio/**/*.ogg.b64"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Decode staged OGG payloads
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' staged; do
            found=1
            output="${staged%.b64}"
            base64 --decode "$staged" > "$output"
            if [[ "$(head -c 4 "$output")" != "OggS" ]]; then
              echo "Invalid OGG payload: $staged" >&2
              exit 1
            fi
            rm "$staged"
            echo "Materialized $output"
          done < <(find phaser/assets/audio -type f -name '*.ogg.b64' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No staged OGG payloads found."
          fi

      - name: Generate browser-compatible runtime mirrors
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' ogg; do
            found=1
            mp3="${ogg%.ogg}.mp3"
            ffmpeg -nostdin -hide_banner -loglevel error -y \
              -i "$ogg" \
              -map_metadata -1 \
              -ac 1 \
              -ar 44100 \
              -codec:a libmp3lame \
              -q:a 4 \
              "$mp3"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$mp3"
            echo "Generated $mp3"

            # Short state-driven loops use PCM WAV in the Web Audio runtime.
            # This keeps older WebKit compatibility while avoiding MP3 encoder
            # padding at the loop boundary. OGG remains the working derivative.
            if [[ "$ogg" == *-loop-*.ogg ]]; then
              wav="${ogg%.ogg}.wav"
              ffmpeg -nostdin -hide_banner -loglevel error -y \
                -i "$ogg" \
                -map_metadata -1 \
                -ac 1 \
                -ar 44100 \
                -codec:a pcm_s16le \
                "$wav"
              ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 "$wav"
              echo "Generated $wav"
            fi
          done < <(find phaser/assets/audio -type f -name '*.ogg' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No OGG runtime assets found."
          fi

      - name: Commit generated audio binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/assets/audio
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Generate browser-compatible audio mirrors"
          git push
