name: Archive Heat Exposure payload

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/heat-exposure-evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Inspect payload
        shell: bash
        run: |
          wc -c .github/heat-exposure-payload.part-* || true
          sha256sum .github/heat-exposure-payload.part-* || true
      - name: Upload payload files
        uses: actions/upload-artifact@v4
        with:
          name: heat-exposure-payload-files
          path: .github/heat-exposure-payload.part-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
