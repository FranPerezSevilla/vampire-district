name: Integrate heavy vehicle collision audio

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - ".github/workflows/integrate-heavy-collision.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Reconstruct verified source
        run: |
          set -euo pipefail
          mkdir -p phaser/assets/audio/vehicles
          cat .github/audio-staging/heavy/vehicle-collision-heavy-01.ogg.b64.part-* > /tmp/heavy.b64
          base64 --decode /tmp/heavy.b64 > phaser/assets/audio/vehicles/vehicle-collision-heavy-01.ogg
          echo "273e0420f8e56e01b269c4176022efb6e51cc06f426e12f090a569b1247bbb18  phaser/assets/audio/vehicles/vehicle-collision-heavy-01.ogg" | sha256sum -c -
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels:format=duration -of default=noprint_wrappers=1 phaser/assets/audio/vehicles/vehicle-collision-heavy-01.ogg

      - name: Generate variants and register family
        run: |
          set -euo pipefail
          python .github/audio-staging/heavy/integrate.py

      - name: Run focused collision tests
        run: |
          set -euo pipefail
          node --test tests/vehicle-collision-audio.test.js tests/audio-sample-catalog.test.js

      - name: Remove one-off staging
        run: |
          set -euo pipefail
          rm -rf .github/audio-staging/heavy
          rm -f .github/workflows/integrate-heavy-collision.yml

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate real heavy vehicle collision audio"
          git push
