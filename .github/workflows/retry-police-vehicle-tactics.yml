name: Retry police vehicle tactics

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/retry-police-vehicle-tactics.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - name: Apply original patch with indentation-tolerant anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-police-vehicle-tactics.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])

          old = '''def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement anchor: {label}")
              return text.replace(old, new, 1)
          '''
          new = '''def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              needle = [line.strip() for line in old.splitlines() if line.strip()]
              lines = text.splitlines(keepends=True)
              for begin in range(len(lines)):
                  cursor = begin
                  matched = 0
                  while cursor < len(lines) and matched < len(needle):
                      current = lines[cursor].strip()
                      if not current:
                          cursor += 1
                          continue
                      if current != needle[matched]:
                          break
                      matched += 1
                      cursor += 1
                  if matched == len(needle):
                      replacement = new if new.endswith("\\n") else new + "\\n"
                      return "".join(lines[:begin]) + replacement + "".join(lines[cursor:])
              raise SystemExit(f"missing replacement anchor: {label}")
          '''
          if old not in script:
              raise SystemExit('could not upgrade replace_once helper')
          script = script.replace(old, new, 1)
          exec(compile(script, 'police-vehicle-tactics-patch', 'exec'))

          fixture_path = Path('tests/motorized-police-local-policy.test.js')
          fixture = fixture_path.read_text()
          old_first = "    dismountUnit() { return []; }\n  };"
          new_first = "    dismountUnit() { return []; },\n    update() { return false; }\n  };"
          if old_first not in fixture:
              raise SystemExit('first local-policy fixture anchor missing')
          fixture = fixture.replace(old_first, new_first, 1)
          old_second = "    dismountUnit(unitId, reason) {\n      calls.push({ unitId, reason });\n      return [\"officer-1\", \"officer-2\"];\n    }\n  };"
          new_second = "    dismountUnit(unitId, reason) {\n      calls.push({ unitId, reason });\n      return [\"officer-1\", \"officer-2\"];\n    },\n    update() { return false; }\n  };"
          if old_second not in fixture:
              raise SystemExit('second local-policy fixture anchor missing')
          fixture_path.write_text(fixture.replace(old_second, new_second, 1))
          PY

      - name: Run focused tactical tests
        run: |
          node --test \
            tests/motorized-police.test.js \
            tests/motorized-police-local-policy.test.js \
            tests/police-vehicle-tactics.test.js \
            tests/ballistic-projectile.test.js

      - name: Commit tactical slice
        shell: bash
        run: |
          rm .github/workflows/apply-police-vehicle-tactics.yml
          rm .github/workflows/retry-police-vehicle-tactics.yml
          rm .github/workflows/finalize-police-vehicle-tactics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            phaser/src/police/MotorizedPolicePolicy.js \
            phaser/src/police/MotorizedPoliceSystem.js \
            tests/motorized-police.test.js \
            tests/motorized-police-local-policy.test.js \
            tests/police-vehicle-tactics.test.js \
            docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md \
            .github/workflows/apply-police-vehicle-tactics.yml \
            .github/workflows/retry-police-vehicle-tactics.yml \
            .github/workflows/finalize-police-vehicle-tactics.yml
          git commit -m "Add telegraphed police vehicle tactics"
          git push origin HEAD:audio/playtest-p0
