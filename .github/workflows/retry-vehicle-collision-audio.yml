name: Retry vehicle collision audio

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/retry-vehicle-collision-audio.yml
      - tools/_tmp-retry-vehicle-collision-audio.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repaired target-aware collision audio
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_tmp-retry-vehicle-collision-audio.py

      - name: Remove one-off helpers
        shell: bash
        run: |
          set -euo pipefail
          rm tools/_tmp-integrate-vehicle-collision-audio.py
          rm tools/_tmp-retry-vehicle-collision-audio.py
          rm .github/workflows/integrate-vehicle-collision-audio.yml
          rm .github/workflows/retry-vehicle-collision-audio.yml

      - name: Validate focused vehicle behavior
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/vehicle-collision-audio.test.js \
            tests/vehicle-model.test.js \
            tests/vehicle-runtime-source.test.js \
            tests/vehicle-engine-audio.test.js \
            tests/vehicle-skid-audio.test.js \
            tests/aggressive-driving-panic.test.js
          git diff --check
          npm run check:affected:plan -- --base=origin/main

      - name: Commit collision audio integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add target-aware vehicle collision audio"
          git push
