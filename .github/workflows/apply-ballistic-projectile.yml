name: Apply ballistic projectile and traffic collision

on:
  push:
    branches:
      - audio/playtest-p0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - name: Implement visible swept projectile
        shell: bash
        run: |
          cat > /tmp/apply_ballistic.py.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/apply_ballistic.py.gz.b64 | gzip -d > /tmp/apply_ballistic.py
          python3 /tmp/apply_ballistic.py

      - name: Run focused projectile tests
        run: |
          node --test \
            tests/ballistic-projectile.test.js \
            tests/bullet-hit-world-audio.test.js \
            tests/combat.test.js

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-ballistic-projectile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            phaser/src/combat/BallisticProjectile.js \
            phaser/src/combat/CombatSystem.js \
            phaser/src/combat/HitscanWorldCollision.js \
            phaser/src/streaming/TrafficLocalBehaviorSystem.js \
            tests/ballistic-projectile.test.js \
            tests/bullet-hit-world-audio.test.js \
            .github/workflows/apply-ballistic-projectile.yml
          git commit -m "Add visible swept bullet projectiles"
          git push origin HEAD:audio/playtest-p0
