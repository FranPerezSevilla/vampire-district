name: Apply Wanted 2 pressure and armed police

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/apply-wanted2-armed-police.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: audio/playtest-p0
          fetch-depth: 0

      - name: Apply changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              path.write_text(text.replace(old, new, 1))

          motor = Path("phaser/src/police/MotorizedPoliceSystem.js")
          replace_once(
              motor,
              "      if (level >= 3\n        && unit.index === 0\n        && unit.tacticCooldown <= 0\n        && ![MOTORIZED_POLICE_TACTICS.PIT_TELEGRAPH, MOTORIZED_POLICE_TACTICS.PIT_COMMIT].includes(unit.tactic)",
              "      if (level >= 2\n        && unit.index === 0\n        && unit.tacticCooldown <= 0\n        && ![MOTORIZED_POLICE_TACTICS.PIT_TELEGRAPH, MOTORIZED_POLICE_TACTICS.PIT_COMMIT].includes(unit.tactic)",
              "Wanted 2 PIT"
          )
          replace_once(
              motor,
              "    if (level >= 3\n      && unit.index === 0\n      && unit.tacticCooldown <= 0\n      && ![MOTORIZED_POLICE_TACTICS.RAM_TELEGRAPH, MOTORIZED_POLICE_TACTICS.RAM_COMMIT].includes(unit.tactic)",
              "    if (level >= 2\n      && unit.index === 0\n      && unit.tacticCooldown <= 0\n      && ![MOTORIZED_POLICE_TACTICS.RAM_TELEGRAPH, MOTORIZED_POLICE_TACTICS.RAM_COMMIT].includes(unit.tactic)",
              "Wanted 2 RAM"
          )

          police = Path("phaser/src/systems/PoliceSystem.js")
          replace_once(
              police,
              'this.scene.lastActionText = "WANTED LEVEL 2: two response cruisers support the foot search from separate approaches.";',
              'this.scene.lastActionText = "WANTED LEVEL 2: response cruisers actively intercept, ram and force vehicles off line while armed officers close in.";',
              "Wanted 2 copy"
          )

          runtime = Path("phaser/src/runtime/GameplayRuntimeCore.js")
          replace_once(
              runtime,
              'import { PlayerDamageSystem } from "../combat/PlayerDamageSystem.js";\n',
              'import { PlayerDamageSystem } from "../combat/PlayerDamageSystem.js";\nimport { PoliceFirearmSystem } from "../combat/PoliceFirearmSystem.js";\n',
              "firearm import"
          )
          replace_once(
              runtime,
              '    scene.playerDamageSystem = new PlayerDamageSystem(scene);\n    scene.drainSystem = new DrainSystem(scene);',
              '    scene.playerDamageSystem = new PlayerDamageSystem(scene);\n    scene.policeFirearmSystem = new PoliceFirearmSystem(scene);\n    scene.drainSystem = new DrainSystem(scene);',
              "firearm construction"
          )
          replace_once(
              runtime,
              '      "PlayerDamageSystem",\n      "DrainSystem",',
              '      "PlayerDamageSystem",\n      "PoliceFirearmSystem",\n      "DrainSystem",',
              "firearm diagnostics"
          )
          text = runtime.read_text()
          old = '      scene.drainSystem?.update(0, frame);\n      scene.playerDamageSystem?.postUpdate(0, frame);'
          new = '      scene.drainSystem?.update(0, frame);\n      scene.policeFirearmSystem?.update(0, frame);\n      scene.playerDamageSystem?.postUpdate(0, frame);'
          if text.count(old) != 3:
              raise SystemExit("paused firearm anchors changed")
          runtime.write_text(text.replace(old, new))
          replace_once(
              runtime,
              '      scene.policeSystem.update(dt);\n      scene.hunterSystem.update(dt);',
              '      scene.policeSystem.update(dt);\n      scene.policeFirearmSystem?.update(dt, frame);\n      scene.hunterSystem.update(dt);',
              "firearm update"
          )
          replace_once(
              runtime,
              '    } else {\n      scene.playerDamageSystem?.postUpdate(0, frame);',
              '    } else {\n      scene.policeFirearmSystem?.update(0, frame);\n      scene.playerDamageSystem?.postUpdate(0, frame);',
              "modal firearm update"
          )
          replace_once(
              runtime,
              '  destroy() {\n    this.scene.traversalPromptLabel?.destroy?.();',
              '  destroy() {\n    this.scene.policeFirearmSystem?.destroy?.();\n    this.scene.policeFirearmSystem = null;\n    this.scene.traversalPromptLabel?.destroy?.();',
              "firearm destroy"
          )

          docs = Path("docs/PLAYTEST_ESCALATION_DAMAGE_RECOVERY.md")
          text = docs.read_text()
          old = "Pursuit cruisers now switch from district routing to local tactical states when they become visible. On foot, they lead the player's motion; at wanted level 3 the first cruiser visibly telegraphs a committed ram before deploying officers. While driving, the two pursuit cruisers pressure opposite rear quarters; at wanted level 3 the lead unit telegraphs a controlled PIT attempt with a cooldown. The third unit keeps its route-informed roadblock role, offsets across the lane to leave a risky escape gap, and cannot materialize inside the player's immediate safety radius."
          new = "Pursuit cruisers now switch from district routing to local tactical states when they become visible. From wanted level 2, the lead cruiser can visibly telegraph a committed ram against an on-foot target and a controlled PIT against a driving target, while the second cruiser pressures the opposite rear quarter. Wanted level 3 adds the third route-informed roadblock cruiser, which leaves a risky escape gap. No unit may materialize inside the player's immediate safety radius."
          if old not in text:
              raise SystemExit("police tactics roadmap paragraph changed")
          text = text.replace(old, new, 1)
          old_state = "## Slice 4 — armed police on foot\n\n**State: documented backlog.**"
          new_state = "## Slice 4 — armed police on foot\n\n**State: implemented on PR #55; pending grouped in-game validation.**\n\nAt wanted level 2, one eligible chasing officer may visibly aim and fire controlled two-shot bursts; wanted level 3 allows up to two coordinated shooters. Firearms use finite magazines, reload pauses and shared ballistic collision. Buildings, traffic, cruisers and other officers block shots. While the player occupies a vehicle, officers target and damage that vehicle first."
          if old_state not in text:
              raise SystemExit("armed police roadmap state changed")
          docs.write_text(text.replace(old_state, new_state, 1))
          PY

          node --check phaser/src/combat/PoliceFirearmSystem.js
          node --test tests/police-vehicle-tactics.test.js
          rm .github/workflows/apply-wanted2-armed-police.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Escalate Wanted 2 and arm foot police"
          git push origin HEAD:audio/playtest-p0
