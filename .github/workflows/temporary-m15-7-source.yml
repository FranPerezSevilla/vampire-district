name: Temporary Milestone 15.7 source snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/blood-sense-whisper-beast'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Archive tracked source
        run: git archive --format=zip --output=viceblood-m15-7-source.zip HEAD
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: viceblood-m15-7-source
          path: viceblood-m15-7-source.zip
          retention-days: 2
