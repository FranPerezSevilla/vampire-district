name: One-time traffic junction CI repair

on:
  push:
    branches:
      - codex/traffic-junction-topology
    paths:
      - .github/workflows/one-time-traffic-junction-ci-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/traffic-junction-topology
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch false junction occupancy from safely queued route traffic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("phaser/src/streaming/TrafficJunctionFlowPolicy.js")
          text = path.read_text(encoding="utf-8")
          old = '''  function junctionOccupied(approach, requesterTokenId) {
    for (const agent of currentAgents) {
      if (agent.tokenId === requesterTokenId || agent.stage !== "connector" || !agent.connectorId) continue;
      const connector = topology.junctionConnectors.connectors[agent.connectorId];
      if (connector?.nodeId === approach.junctionId) {
        return { blocked: true, kind: "route-connector", blockerId: agent.tokenId };
      }
    }

    for (const item of physicalEntities()) {
      if (item.tokenId === requesterTokenId) continue;
      const broadRadius = entityBroadRadius(item.entity);
'''
          new = '''  function safelyQueuedRouteEntity(item, requesterApproach) {
    if (item?.kind !== "route-traffic" || !item.tokenId || permits.has(String(item.tokenId))) return false;
    const routeAgent = agentFor(item.tokenId);
    if (!routeAgent || routeAgent.stage !== "lane") return false;
    const queuedApproach = approachFor(routeAgent);
    if (!queuedApproach || queuedApproach.junctionId !== requesterApproach?.junctionId) return false;
    if (routeAgent.currentLaneId !== queuedApproach.incomingLaneId) return false;
    if (item.entity?.routeStage !== "lane" || item.entity?.routeLaneId !== queuedApproach.incomingLaneId) return false;
    if (clamp(routeAgent.stageProgress, 0, 1) > queuedApproach.stopProgress + EPSILON) return false;

    const forwardX = Math.cos(queuedApproach.stopPoint.angle);
    const forwardY = Math.sin(queuedApproach.stopPoint.angle);
    const physicalBeyondStop = (finite(item.entity?.x) - queuedApproach.stopPoint.x) * forwardX
      + (finite(item.entity?.y) - queuedApproach.stopPoint.y) * forwardY;
    if (physicalBeyondStop > 0.25) return false;

    return distance(item.entity, queuedApproach.node) > queuedApproach.conflictRadius + 0.25;
  }

  function junctionOccupied(approach, requesterTokenId) {
    for (const agent of currentAgents) {
      if (agent.tokenId === requesterTokenId || agent.stage !== "connector" || !agent.connectorId) continue;
      const connector = topology.junctionConnectors.connectors[agent.connectorId];
      if (connector?.nodeId === approach.junctionId) {
        return { blocked: true, kind: "route-connector", blockerId: agent.tokenId };
      }
    }

    for (const item of physicalEntities()) {
      if (item.tokenId === requesterTokenId) continue;
      if (safelyQueuedRouteEntity(item, approach)) continue;
      const broadRadius = entityBroadRadius(item.entity);
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one junction occupancy patch point, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install exact test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run focused traffic regressions
        run: >-
          node --test
          tests/traffic-multi-agent-route-runtime.test.js
          tests/traffic-junction-flow-policy.test.js
          tests/traffic-junction-runtime-integration.test.js

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-traffic-junction-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/src/streaming/TrafficJunctionFlowPolicy.js .github/workflows/one-time-traffic-junction-ci-fix.yml
          git commit -m "fix: prevent queued traffic from self-deadlocking junctions"
          git push origin HEAD:codex/traffic-junction-topology

      - name: Dispatch full semantic CI on repaired head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/dispatches" \
            -d '{"ref":"codex/traffic-junction-topology"}'
