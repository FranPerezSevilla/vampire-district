name: Apply hunting rights and poaching

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Detect pending hunting-law payload
        id: gate
        shell: bash
        run: |
          if [ -f .github/hunting-law-payload.part-01 ] \
            && [ -f .github/hunting-law-payload.part-02 ] \
            && [ -f .github/hunting-law-payload.part-03 ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Hunting-law implementation payload already consumed.'
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and verify payload
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/hunting-law-payload.part-01 \
            .github/hunting-law-payload.part-02 \
            .github/hunting-law-payload.part-03 \
            > /tmp/hunting-law.b64
          test "$(wc -c < /tmp/hunting-law.b64)" = '22652'
          echo '39aca90e9fd51260d85b95bd40442dae45e566da6193d4aeec1dce2802920c95  /tmp/hunting-law.b64' | sha256sum -c -

          base64 -d /tmp/hunting-law.b64 > /tmp/hunting-law.patch.gz
          test "$(wc -c < /tmp/hunting-law.patch.gz)" = '16987'
          echo '0ea169677b9e88ac84ab5547e72af94a7bf6f74912a95f03b8ce2a5b347b4620  /tmp/hunting-law.patch.gz' | sha256sum -c -
          gzip -t /tmp/hunting-law.patch.gz

          gzip -dc /tmp/hunting-law.patch.gz > /tmp/hunting-law.patch
          test "$(wc -c < /tmp/hunting-law.patch)" = '69725'
          echo '2f3d8497b41481c4adb2af4bbb4cb312aef1912e1331ba04b222e40a33f6b4f1  /tmp/hunting-law.patch' | sha256sum -c -

      - name: Apply hunting-law implementation
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-hunting-source-snapshot.yml
          cp "$workflow" /tmp/hunting-law-workflow.yml
          rm -f "$workflow"
          git apply --check /tmp/hunting-law.patch
          git apply /tmp/hunting-law.patch
          rm -f \
            .github/hunting-law-payload.part-01 \
            .github/hunting-law-payload.part-02 \
            .github/hunting-law-payload.part-03

      - name: Install exact dependencies
        if: steps.gate.outputs.apply == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Check JavaScript syntax
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find phaser tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)

      - name: Run unit regression
        if: steps.gate.outputs.apply == 'true'
        run: node --test tests/*.test.js

      - name: Validate city topology
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:validate

      - name: Compile current city
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:compile -- --output-dir=/tmp/viceblood-hunting-city

      - name: Compile Foundry candidates
        if: steps.gate.outputs.apply == 'true'
        run: npm run city:foundry -- --output-dir=/tmp/viceblood-hunting-foundry

      - name: Verify patch quality
        if: steps.gate.outputs.apply == 'true'
        run: git diff --check

      - name: Publish validated hunting-law tree
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/temporary-hunting-source-snapshot.yml
          mkdir -p .github/workflows
          mv /tmp/hunting-law-workflow.yml "$workflow"

          python <<'PY'
          import base64
          import json
          import os
          import stat
          import subprocess
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["TARGET_BRANCH"]

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          def paths_from_git(*args):
              raw = subprocess.check_output(args)
              return [item.decode() for item in raw.split(b"\0") if item]

          def request(method, path, payload):
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          parent = command("git", "rev-parse", "HEAD")
          base_tree = command("git", "rev-parse", "HEAD^{tree}")
          changed = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=ACMRTUXB", "HEAD"
          )
          changed += paths_from_git("git", "ls-files", "--others", "--exclude-standard", "-z")
          deleted = paths_from_git(
              "git", "diff", "--name-only", "-z", "--diff-filter=D", "HEAD"
          )

          entries = []
          for path in sorted(set(changed)):
              with open(path, "rb") as source:
                  content = base64.b64encode(source.read()).decode("ascii")
              blob = request("POST", "/git/blobs", {"content": content, "encoding": "base64"})
              mode = "100755" if os.stat(path).st_mode & stat.S_IXUSR else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          for path in sorted(set(deleted)):
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})

          tree = request("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "Implement hunting rights and poaching",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          ref = urllib.parse.quote(f"heads/{branch}", safe="/")
          request("PATCH", f"/git/refs/{ref}", {"sha": commit["sha"], "force": False})
          print(f"Published hunting-law commit {commit['sha']}")
          PY
