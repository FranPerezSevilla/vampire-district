name: Recover ViceBlood menu theme

on:
  push:
    branches:
      - audio/playtest-p0
    paths:
      - .github/workflows/recover-menu-theme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-menu-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble validated source from Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phaser/assets/audio/music
          : > /tmp/main-menu-theme-01.ogg.b64

          append_blob() {
            local sha="$1"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode \
              >> /tmp/main-menu-theme-01.ogg.b64
          }

          append_blob 4b5da281459acd7a3016e19ed459820ceee5c80b
          append_blob 4a3b4fc56066c5c5dd052ea1db6093ea80edc87b
          append_blob d432e69d06b940f501af095b14ebaa1d5dc4aa42
          append_blob 452757ebd981c01dd46015ba72e67baf35334967
          append_blob f5dc0aa8f03772db142f58dd5b84e2e5742e8912
          append_blob d0cb5e1e524766490cbc430143662560e6bdc64c
          append_blob 282453cec40fcb237c9c1acade6296a02a5818fc
          append_blob d30d6fe121b935c18275e99ab615650e8b3f09ce
          append_blob 24cc98be1bd46c4d6013c67022cd31a4625cfc9e
          append_blob 3c4431a55666053390e3fd8cb1f6d53c2c92aecd
          append_blob a1fc21a69c1eda142c5d6d63b50032f62cbdc76b
          append_blob 318c3a7fb55b78b87421ad82db26192cdb3a4ac9
          append_blob 835d36d59edbe8b22b3659146a924d6cd6009ada
          append_blob 57b7ae2e09a8b24673c36eb5cd665880ea2f3dc7
          append_blob c197c428acac9f982468e3c11792d735f441b881
          append_blob 14d649d7e1b91195d9b45847122fd32fdf30bac8
          append_blob 05904bf51e5bed982a231d9ded85e19333253e1a
          append_blob 49b6a9eef1684fcf84d84fb2ecd5f1fc7a03cf3a

          base64 --decode /tmp/main-menu-theme-01.ogg.b64 > phaser/assets/audio/music/main-menu-theme-01.ogg
          echo "0dabd4d991b4ef579f53c32489d992dd689612693035192af981f3ead1fcbd24  phaser/assets/audio/music/main-menu-theme-01.ogg" | sha256sum --check --strict
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 phaser/assets/audio/music/main-menu-theme-01.ogg

          ffmpeg -hide_banner -loglevel error -y \
            -i phaser/assets/audio/music/main-menu-theme-01.ogg \
            -ar 44100 -codec:a libmp3lame -b:a 96k \
            phaser/assets/audio/music/main-menu-theme-01.mp3
          test "$(stat -c%s phaser/assets/audio/music/main-menu-theme-01.mp3)" -gt 100000
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of json phaser/assets/audio/music/main-menu-theme-01.mp3

      - name: Commit recovered binary and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser/assets/audio/music/main-menu-theme-01.ogg phaser/assets/audio/music/main-menu-theme-01.mp3
          git rm .github/workflows/recover-menu-theme.yml
          git commit -m "Materialize complete ViceBlood menu theme"
          git push origin HEAD:audio/playtest-p0
