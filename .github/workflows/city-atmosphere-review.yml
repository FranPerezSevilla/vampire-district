name: City atmosphere review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-atmosphere-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 72
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify pinned local Phaser
        run: test -f node_modules/phaser/dist/phaser.min.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture city atmosphere review package
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 12m npm run test:browser:atmosphere-review 2>&1 | tee city-atmosphere-review.log
      - name: Upload city atmosphere review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-atmosphere-review
          path: .artifacts/city-atmosphere-review/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: city-atmosphere-review-diagnostics
          path: |
            city-atmosphere-review.log
            playwright-report/
            test-results/
          retention-days: 7
